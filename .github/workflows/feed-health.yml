name: Monthly feed health check

on:
  schedule:
    - cron: "23 10 3 * *" # 10:23 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check every feed in feeds.yaml
        id: check
        run: |
          set +e
          python scripts/verify_feeds.py > feed-health.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat feed-health.txt
      - name: Open, update, or close the feed health issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "Feed health: in:title" \
            --json number --jq '.[0].number // empty')
          if [[ "${{ steps.check.outputs.exit_code }}" != "0" ]]; then
            # grep -c exits nonzero on no matches, which would abort the step.
            n=$(grep -c '^  ACTION' feed-health.txt || true)
            held=$(grep -c '^  held, no action' feed-health.txt || true)
            title="Feed health: ${n} needing action"
            {
              echo "The monthly check found something that needs a decision."
              echo
              echo '```'
              grep -E '^  ACTION|^skip' feed-health.txt
              echo '```'
              echo
              echo "Two kinds of item appear here:"
              echo
              echo "- **new failure**: fix or replace the feed in feeds.yaml, verify with"
              echo "  \`python scripts/verify_feeds.py\`, and commit."
              echo "- **recovered**: a feed marked \`expect_fail_in_ci\` is reachable again,"
              echo "  so the block lifted. Drop its \`expect_fail_in_ci\` line and decide"
              echo "  whether the replacement added alongside it can now be retired."
              echo
              echo "${held} known-blocked feeds were tolerated and are not listed above."
              echo "Full log in the workflow run."
            } > body.md
            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --title "$title" --body-file body.md
              gh issue comment "$existing" --body "Still failing as of $(date -u +%F)."
            else
              gh issue create --title "$title" --body-file body.md \
                --assignee TarronKayAUA
            fi
          elif [[ -n "$existing" ]]; then
            gh issue close "$existing" \
              --comment "Nothing needs action as of $(date -u +%F). Closing."
          else
            echo "Nothing actionable; no issue to manage."
          fi
