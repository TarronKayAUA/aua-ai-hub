name: Model comparison

# Manual only. Runs a real pipeline prompt against several models on the
# real current inputs and prints the results blind in the run log, so a
# model choice is made on the output rather than on benchmark headlines.
# Read-only: it commits nothing, writes no page, and never touches the
# seen-items ledger, so it cannot affect the site.
#
# Added 2026-07-25 for the section-brief comparison (GPT-4.1 against
# Haiku 4.5 against Opus 5). The same harness answers the Sonnet 5 versus
# Sonnet 4.6 question when Sonnet 5's introductory pricing ends on
# 2026-08-31, and every model release after that.
#
# COST WARNING, from measured experience on 2026-07-25: a six-model
# three-sample sweep including claude-fable-5 cost roughly $2 to $3 and
# hit the workspace monthly cap. Fable dominates the bill: its always-on
# thinking is charged as output tokens at $50 per million, so a single
# Fable brief call can cost 20 to 30 cents against fractions of a cent
# for Haiku. Before dispatching: drop Fable from the model list unless
# its answer is specifically needed, prefer repeat=1 with a follow-up
# only where results disagree, and check the month's remaining budget in
# the Claude Console first.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated provider:model pairs"
        required: false
        default: "github:openai/gpt-4.1 anthropic:claude-haiku-4-5 anthropic:claude-opus-5"
      category:
        description: "Limit to one category key (blank runs all three)"
        required: false
        default: ""
      repeat:
        description: "Samples per model per category"
        required: false
        default: "1"

permissions:
  contents: read
  models: read

jobs:
  compare:
    runs-on: ubuntu-latest
    # Generous: a six-model, three-sample sweep is 54 sequential calls, and
    # Fable-class models are slow because thinking runs before the answer.
    # A 10-minute ceiling cancelled such a run after one category on
    # 2026-07-25, losing the end-of-run summary with it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare models on the section-brief prompt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--models ${{ inputs.models }} --repeat ${{ inputs.repeat }}"
          if [ -n "${{ inputs.category }}" ]; then
            ARGS="$ARGS --category ${{ inputs.category }}"
          fi
          python scripts/compare_brief_models.py $ARGS
