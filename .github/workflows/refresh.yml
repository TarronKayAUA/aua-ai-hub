name: Nightly news refresh

on:
  schedule:
    # GitHub runs cron best-effort, and observed delays on this repo grew
    # from occasional (9.5 hours late, 2026-06-10) to a consistent 5 to 11
    # hours on every slot (June 2026), so scheduled times cannot be
    # trusted to land anywhere in particular. Six slots every four hours
    # blanket the day instead: whatever the delay, runs land morning,
    # midday, and evening local (UTC-4). Extra runs are cheap and
    # harmless: fresh items are curated exactly once (seen-items ledger),
    # briefs are hash-gated, the digest fires at most once per ISO week,
    # and the workflow commits only when content changed.
    - cron: "20 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

# Pushes made with the default GITHUB_TOKEN do not trigger other workflows,
# so this workflow must build and deploy the site itself rather than relying
# on deploy.yml to fire after the pipeline's commit.

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      narration: ${{ steps.narrate.outcome }}
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      # Full history: scripts/page_dates.py dates each page in sitemap.xml from
      # git log, and a shallow clone would leave every page on the build date.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run aggregation pipeline
        env:
          # Exposes the workflow token (models: read) so the pipeline can use
          # GitHub Models inference; without this the run falls back to
          # keyword mode.
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/aggregate.py --verbose
      - name: Commit refreshed content
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(news): refresh $(date -u +%F)"
            # A human push can land between this run's checkout and its
            # push (it did on 2026-07-13, failing the run); rebase first,
            # matching the three watch workflows.
            git pull --rebase origin main
            git push
          else
            echo "No content changes; skipping commit."
          fi
      - name: Cache narration model
        uses: actions/cache@v6
        with:
          path: ~/.cache/aua-narration
          key: narration-model-v1
      # Only the build-generated files are cached. Caching the whole folder
      # restored last run's stale pathway MP3s over the freshly checked-out
      # committed ones (found 2026-09-02, the live audio lagged a commit).
      - name: Cache generated narration audio
        uses: actions/cache@v6
        with:
          path: |
            docs/assets/audio/news-*
            docs/assets/audio/digest-*
          key: narration-audio-${{ github.run_id }}
          restore-keys: narration-audio-
      # A narration failure (the Kokoro engine or its install) must not stop
      # the build: the site deploys with no player on the new briefs, as any
      # build without news audio does, and the run is failed afterwards by
      # the narration-failed job so the failure is still reported.
      - name: Narrate news briefs and digest
        id: narrate
        continue-on-error: true
        run: |
          pip install -r requirements-narration.txt
          python scripts/narrate.py --check || true
          python scripts/narrate.py --only news
      # Static narration is no longer re-read here: it is generated on the
      # maintainer's machine with a metered voice CI has no key for. A page
      # edited without a local run keeps stale audio, the build hook drops
      # that page's player, and narration-health.yml raises an issue.
      - run: mkdocs build --strict
      # IndexNow (2026-10-02): the pages this deploy adds, redates or removes,
      # read against the live sitemap before it is replaced. The deploy job
      # sends the notice; a failure here only means no notice this time.
      - id: indexnow
        continue-on-error: true
        run: python scripts/indexnow.py site/sitemap.xml >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Same transient-failure retry as deploy.yml: Pages occasionally
      # rejects deployments with "try again later"; two retries on a
      # lengthening backoff absorb it. Content is additionally
      # self-healing here because every one of the six daily slots
      # deploys.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 90
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment_retry.outcome == 'failure'
        run: sleep 180
      - id: deployment_final
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
      # Once the new pages are live, tell the IndexNow search engines (Bing and
      # the others that share api.indexnow.org) which ones changed. 200 is
      # accepted, 202 accepted with the key still being checked; anything else
      # marks this step failed without failing the run (scripts/indexnow.py).
      - name: Notify search engines (IndexNow)
        if: >-
          !cancelled() && needs.refresh.outputs.indexnow != '' &&
          (steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success' ||
          steps.deployment_final.outcome == 'success')
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.refresh.outputs.indexnow }}
        run: |
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data "$PAYLOAD")
          n=$(python3 -c 'import json, os; print(len(json.loads(os.environ["PAYLOAD"])["urlList"]))')
          echo "IndexNow answered HTTP $code for $n URLs"
          cat response.txt 2>/dev/null || true
          case "$code" in 200|202) ;; *) exit 1 ;; esac

  # Runs after the deploy, and only when the news narration step failed: the
  # site is already live without the new audio, and this fails the run so
  # the failure is emailed rather than hidden (added 2026-09-28, before the
  # ubuntu-latest move to Ubuntu 26.04 on 2026-10-19 to 11-19, where the
  # narration code had never run).
  narration-failed:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.narration == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error title=News narration failed::The site was built and deployed without new news audio. See the 'Narrate news briefs and digest' step of the refresh job."
          exit 1
