name: Haiku 5.5 live check (temporary)

# TEMPORARY, branch models/haiku-5-5 only; removed before the merge.
# Runs the three tasks moving from claude-haiku-4-5 to claude-haiku-5-5 on
# real current inputs, in their write-nothing modes, twice: once as
# configured (Haiku 5.5) and once with Haiku 4.5 substituted, with the
# checkout restored in between so both see the same inputs. Calls to other
# models (the content-watch synthesis, page review, gate verification) are
# made once and replayed in the second run. Every call's model, stop
# reason, usage and time is logged, so refusals and truncations are counted
# rather than guessed. Read-only: no commit step, contents: read.

on:
  push:
    branches: [models/haiku-5-5]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write the driver
        run: |
          cat > /tmp/driver.py <<'EOF'
          import hashlib, json, os, runpy, sys, time
          sys.path.insert(0, "scripts")
          import aggregate
          ARM = os.environ["ARM"]
          CACHE = "/tmp/replay_cache.json"
          cache = json.load(open(CACHE)) if os.path.exists(CACHE) else {}
          orig = aggregate.call_anthropic
          log = open(f"/tmp/out/calls-{ARM}.jsonl", "a", encoding="utf-8")
          current = {"script": ""}
          def patched(system, user, cfg, timeout):
              haiku = str(cfg.get("model", "")).startswith("claude-haiku")
              if haiku and ARM == "haiku45":
                  cfg = dict(cfg, model="claude-haiku-4-5")
              k = hashlib.sha1((cfg["model"] + "\0" + system + "\0" + user).encode()).hexdigest()
              rec = {"script": current["script"], "model": cfg["model"], "max_tokens": cfg.get("max_tokens"),
                     "effort": cfg.get("effort"), "user_chars": len(user)}
              if not haiku and ARM == "haiku45" and k in cache:
                  rec["replayed"] = True
                  log.write(json.dumps(rec) + "\n"); log.flush()
                  return cache[k]
              t = time.time()
              try:
                  out = orig(system, user, cfg, timeout)
              except Exception as exc:
                  rec.update(error=repr(exc)[:300], seconds=round(time.time() - t, 1))
                  log.write(json.dumps(rec) + "\n"); log.flush()
                  raise
              rec.update(seconds=round(time.time() - t, 1), stop=aggregate.LAST_ANTHROPIC_STOP.get("reason"),
                         usage=dict(aggregate.LAST_ANTHROPIC_USAGE), out_chars=len(out))
              log.write(json.dumps(rec) + "\n"); log.flush()
              if not haiku and ARM == "haiku55":
                  cache[k] = out
              return out
          aggregate.call_anthropic = patched
          for script, args in (("conference_watch", ["--propose-only"]),
                               ("opportunity_watch", ["--no-state"]),
                               ("content_watch", ["--no-bump"])):
              current["script"] = script
              sys.argv = [f"scripts/{script}.py", *args, "--report", f"/tmp/out/report-{script}-{ARM}.md"]
              print(f"\n===== {ARM}: {script} =====", flush=True)
              try:
                  runpy.run_path(f"scripts/{script}.py", run_name="__main__")
              except SystemExit as exc:
                  print(f"[{script} exited {exc.code}]", flush=True)
              except Exception as exc:
                  print(f"[{script} raised {exc!r}]", flush=True)
          json.dump(cache, open(CACHE, "w"))
          EOF
          cat > /tmp/trim_state.py <<'EOF'
          # Forget the 20 most recently screened opportunity candidates, so the
          # screen has about a normal week's work (runner only, never committed).
          import json
          p = "data/opportunity_watch_state.json"
          s = json.load(open(p, encoding="utf-8"))
          newest = sorted(s["seen"].items(), key=lambda kv: kv[1])[-20:]
          for url, _ in newest:
              del s["seen"][url]
          json.dump(s, open(p, "w", encoding="utf-8"), indent=1)
          print("opportunity state: forgot", len(newest), "candidates; keeps", len(s["seen"]))
          EOF
          mkdir -p /tmp/out
      - name: Run on Haiku 5.5 (as configured)
        env:
          ARM: haiku55
        run: |
          python /tmp/trim_state.py
          python /tmp/driver.py
      - name: Restore the checkout
        run: |
          git checkout -- .
          git clean -fdq
          git status --short
      - name: Run on Haiku 4.5 (same inputs)
        env:
          ARM: haiku45
        run: |
          python /tmp/trim_state.py
          python /tmp/driver.py
      - name: Summary
        if: always()
        run: |
          python - <<'EOF'
          import json, glob, collections
          PRICE = {"claude-haiku-5-5": (0.10, 0.50), "claude-haiku-4-5": (1.0, 5.0),
                   "claude-sonnet-5-5": (2.0, 10.0)}
          for path in sorted(glob.glob("/tmp/out/calls-*.jsonl")):
              rows = [json.loads(l) for l in open(path, encoding="utf-8")]
              print(f"\n### {path.split('/')[-1]}")
              by = collections.defaultdict(list)
              for r in rows:
                  by[(r["script"], r["model"])].append(r)
              for (script, model), rs in sorted(by.items()):
                  live = [r for r in rs if not r.get("replayed")]
                  stops = collections.Counter(r.get("stop") or ("error" if r.get("error") else "none") for r in live)
                  tin = sum((r.get("usage") or {}).get("input_tokens", 0) for r in live)
                  tout = sum((r.get("usage") or {}).get("output_tokens", 0) for r in live)
                  pin, pout = PRICE.get(model, (0, 0))
                  secs = [r.get("seconds", 0) for r in live]
                  print(f"{script:18s} {model:18s} calls {len(rs):3d} (replayed {len(rs) - len(live)}) "
                        f"stops {dict(stops)} tokens in {tin} out {tout} cost ${(tin * pin + tout * pout) / 1e6:.4f} "
                        f"max {max(secs) if secs else 0}s")
                  for r in live:
                      if r.get("stop") in ("refusal", "max_tokens") or r.get("error"):
                          print("   PROBLEM:", json.dumps(r)[:400])
          EOF
          for s in conference_watch opportunity_watch content_watch; do
            echo; echo "===== report diff: $s (haiku45 -> haiku55) ====="
            diff -u "/tmp/out/report-$s-haiku45.md" "/tmp/out/report-$s-haiku55.md" || true
          done
      - name: Upload the logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: haiku55-check
          path: /tmp/out/
