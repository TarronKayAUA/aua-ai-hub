site_name: AUA AI Hub
site_description: >-
  Curated artificial intelligence reference and news hub for the American
  University of Antigua College of Medicine.
site_url: https://tarronkayaua.github.io/aua-ai-hub/
# No repo_url or repo_name, deliberately (2026-09-22 site review): Material
# renders them as a GitHub widget in the header of every page, which read as
# a personal code project on an institutional site and advertised "0 stars,
# 0 forks". Nothing else uses them: comments and the Prompt Exchange link to
# the Discussions board directly, and edit links are not enabled.
copyright: >-
  Maintained by Dr. Tarron Kayalackakom, Associate Dean of AI in Medical
  Education, AUA College of Medicine

# Anchor checking (added 2026-09-25 for the navigation redesign). By default
# MkDocs checks that a linked page exists but not that the #anchor on it
# does, so renaming a heading silently broke every link to it. At "warn",
# --strict turns a missing anchor into a failed build. Raw-HTML links and
# the prompt library's title-derived card anchors are still unchecked, so
# prompts are never retitled casually.
validation:
  links:
    anchors: warn

extra:
  # Footer links, rendered by overrides/partials/copyright.html and NOT by
  # the copyright string above. They used to be raw HTML inside that string,
  # but MkDocs inserts `copyright` verbatim and never rewrites a relative
  # href in it, so <a href="accessibility/"> shipped unchanged to every page:
  # right from the site root, and pointing at a page that does not exist
  # everywhere else. On 2026-09-08 that was 78 of 79 content pages, the
  # accessibility statement's own footer among them.
  #
  # Write an internal target as the path a reader sees in the ADDRESS BAR,
  # with a trailing slash ("accessibility/"), never the file path under
  # docs/ ("accessibility.md"). Anything containing "://" is treated as
  # external and passed through untouched. scripts/render_data.py checks
  # both rules at build time, because the template renders nothing at all if
  # this block is missing or mistyped.
  footer_links:
    - text: Feedback
      url: https://forms.office.com/r/5a8RCi2YKP
    - text: Contact
      url: about/
    - text: Events
      url: conferences/
    - text: Accessibility
      url: accessibility/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-mark-white.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # AUA brand colors sampled from the official logo artwork; the custom
    # primary is defined in docs/stylesheets/extra.css.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - announce.dismiss

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/counter.js
  - javascripts/hardware.js
  - javascripts/prompts.js
  - javascripts/topics.js
  - javascripts/better-answers.js
  - javascripts/listen.js
  - javascripts/next-token.js
  - javascripts/tools-chooser.js
  - javascripts/prompt-chooser.js

plugins:
  # Material's default separator splits only on whitespace and hyphens, which
  # broke search in two ways specific to this site (measured 2026-09-08, from
  # an external review). House style expands an acronym on first use, so the
  # first and most authoritative mention on every page is written "protected
  # health information (PHI)"; with the default separator "(PHI)" is one
  # token and a search for PHI never matches it. "CGEA" returned nothing at
  # all despite appearing eight times. Tool cards have the same shape,
  # "Comet (Perplexity)", so searching a vendor missed its own card. And a
  # trailing question mark silently deleted the reader's last word, so
  # "Can students use AI?" searched two terms of three.
  #
  # Adding ( ) and ? to the separator fixes all three. Deliberately NOT done
  # instead: per-page search boosts, lowering the title boost, or the
  # stemmer. All three were measured and all three are worse here; the
  # policy page needs roughly a 200x boost to move on "patient data" while
  # 2x already steals other queries from the right guide, and the stemmer
  # stops "glossary" returning the Glossary.
  #
  # What did fix "patient data" (2026-09-23) was wording, not weighting:
  # the audience pages' hard-rules headings now name patient data and
  # student records, and headings rank highly. Reach for a descriptive
  # heading before any search setting.
  - search:
      separator: '[\s\-()?]+'

hooks:
  - scripts/render_data.py

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Navigation, redesigned 2026-09-25 (owner approved; the Phase 2 study is
# summarized in SPEC section 12). The two audience pages are tabs that hold
# their own guides, so a guide opened from a hub keeps that hub's tab and
# breadcrumb. File paths are unchanged: a page's URL comes from its file,
# not its place here. Three index pages stay wrapped in single-page sections
# (Tool Directory, News Archive, Announcements) so navigation.indexes does
# not turn them into their parent tab's landing page (SPEC, 2026-09-23).
nav:
  - Home: index.md
  - For Students:
      - For Students: students.md
      - Shelf and NBME Score Reports: playbooks/score-reports.md
      - AI and the Residency Application: playbooks/residency-application.md
  - "For Faculty & Staff":
      - "For Faculty & Staff": faculty.md
      - Step-by-Step Guides:
          - playbooks/index.md
          - Preparing a Lecture: playbooks/lecture-prep.md
          - Writing and Vetting Exam Questions: playbooks/exam-items.md
          - Your Syllabus AI Statement: playbooks/syllabus-statement.md
          - Feedback on Student Writing: playbooks/writing-feedback.md
          - AI-Generated Images in Teaching: playbooks/ai-images.md
          - Reviewing the Literature: playbooks/literature-reviews.md
          - "Administrative Drafting: Memos, Minutes, and Reports": playbooks/admin-drafting.md
  - Learn:
      - pathway/index.md
      - "1. How AI Works": pathway/how-ai-works.md
      - "2. Prompting Fundamentals": pathway/prompting.md
      - "3. The Policy in Practice": pathway/rules.md
      - "4. Teaching and Assessment": pathway/teaching-assessment.md
      - "5. Research and Scholarship": pathway/research.md
      - "6. Clinical Contexts": pathway/clinical.md
      - "7. Working with Agents": pathway/working-with-agents.md
      - Quick Reference:
          - Glossary: basics/glossary.md
          - Common Misconceptions: basics/misconceptions.md
          - "How LLMs Work, in Depth": basics/how-llms-work.md
          - Getting Better Answers: basics/better-answers.md
      - Courses and Resources: learning/index.md
  - "Tools & Prompts":
      - Tool Directory:
          - tools/index.md
      - Prompt Library:
          - prompts/index.md
          - Learning to Prompt: prompts/learning.md
          - Prompt Exchange: prompts/exchange.md
      - "Gemini Notebook (formerly NotebookLM)": tools/gemini-notebook.md
      - AI for Research: tools/research.md
      - Local and Open Models:
          - Running Models Locally: tools/local.md
          - Hardware for Local AI: tools/hardware.md
      - Agents and Setups (Advanced):
          - AI Agents: tools/agents.md
          - Choosing Your Interface: tools/interfaces.md
          - Your First Agent Session: tools/first-session.md
          - "Standing Setups: Assistants that Remember": tools/standing-setups.md
          - Agent Skills: tools/skills.md
      - Benchmarks:
          - Language Models: benchmarks.md
          - Image Generation: benchmarks/image.md
          - Video Generation: benchmarks/video.md
  - "News & Events":
      - "News & Events": news-and-events.md
      - News:
          - Medical Education: news/medical-education.md
          - This Week: news/this-week.md
          - Clinical Practice: news/clinical-practice.md
          - General AI: news/general-ai.md
          - Videos: news/videos.md
          - Podcasts: news/podcasts.md
          - News Archive:
              - news/archive/index.md
      - Events:
          - Conferences and Events: conferences.md
          - Opportunities: opportunities.md
      - Announcements and Committee Polls:
          - announcements/index.md
  - Governance:
      - governance/index.md
      - AI Responsible Use Policy: governance/policy.md
      - AI Committee: governance/committee.md
      - Committee Work and Updates: governance/updates.md
      - How Tools Are Reviewed: governance/review-process.md
  - "About & Contact":
