<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07618c"/>
      <stop offset="1" stop-color="#1b4165"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="140" rx="10" fill="url(#bg)"/>
  <!-- work shown: a route with one branch abandoned and corrected, ending in a
       verified result. The discarded branch is the point of the section. -->
  <path d="M 150 70 L 380 70 L 610 70 L 840 70 L 1020 70"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.5"/>
  <path d="M 380 70 C 450 70 470 112 545 112"
        fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.3"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7">
    <circle cx="150" cy="70" r="15"/>
    <circle cx="380" cy="70" r="15"/>
    <circle cx="610" cy="70" r="15"/>
    <circle cx="840" cy="70" r="15"/>
  </g>
  <g fill="#ffffff" opacity="0.85" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="150" y="75">1</text>
    <text x="380" y="75">2</text>
    <text x="610" y="75">3</text>
    <text x="840" y="75">4</text>
  </g>
  <!-- the abandoned attempt, struck through rather than hidden -->
  <g opacity="0.45">
    <circle cx="560" cy="112" r="13" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 554 106 L 566 118 M 566 106 L 554 118" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <g opacity="0.85">
    <circle cx="1020" cy="70" r="16" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M 1012 70 L 1018 76 L 1029 64" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3">
    <line x1="128" y1="34" x2="196" y2="34"/>
    <line x1="358" y1="34" x2="420" y2="34"/>
    <line x1="588" y1="34" x2="646" y2="34"/>
    <line x1="818" y1="34" x2="884" y2="34"/>
  </g>
  <g fill="#ffffff" opacity="0.25">
    <circle cx="1090" cy="46" r="4"/><circle cx="1120" cy="70" r="4"/><circle cx="1090" cy="94" r="4"/>
  </g>
</svg>
