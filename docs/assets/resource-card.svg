<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-hidden="true">
  <!-- Placeholder thumbnail for Courses and Resources cards whose source
       publishes no og:image. Self-contained colors on purpose: an external
       SVG referenced through an img tag cannot read the page's CSS
       variables, so the brand gradient is written literally here, matching
       the section-*.svg artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07618c"/>
      <stop offset="1" stop-color="#1b4165"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- An open book: reads as course, article, or volume alike -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" opacity="0.75">
    <path d="M 320 132 C 285 112 245 108 205 118 L 205 246 C 245 236 285 240 320 260 Z"/>
    <path d="M 320 132 C 355 112 395 108 435 118 L 435 246 C 395 236 355 240 320 260 Z"/>
    <line x1="320" y1="132" x2="320" y2="260"/>
  </g>

  <!-- Lines of text on each page -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4">
    <line x1="232" y1="150" x2="296" y2="156"/>
    <line x1="232" y1="176" x2="296" y2="182"/>
    <line x1="232" y1="202" x2="278" y2="207"/>
    <line x1="344" y1="156" x2="408" y2="150"/>
    <line x1="344" y1="182" x2="408" y2="176"/>
    <line x1="344" y1="207" x2="390" y2="202"/>
  </g>
</svg>
