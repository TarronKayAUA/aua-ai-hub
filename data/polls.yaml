# Polls from the AI Committee, rendered onto the Announcements page at build
# time by scripts/render_data.py. Owner-owned: polls run on Microsoft Forms
# in the owner's institutional tenant; add a poll here when it opens and
# move it to closed (with a one-line outcome) when it ends. The renderer
# shows a quiet placeholder when no poll is active.
#
# active entries: question, url (the Forms share link), closes (display
# string), optional note. closed entries: question, outcome.

# Poll URL verified live at add time; the Forms page is JavaScript-rendered,
# so the question wording below is confirmed against the owner's form
# directly rather than fetched.

# A standing invitation rather than a timed poll (owner decision
# 2026-07-24): no `closes`, so the renderer omits the closing clause and
# this stays up until the owner replaces it. Same form as the footer's
# Feedback link, on the forms.cloud.microsoft domain.
active:
  - question: How are you using the AI Hub, and what should we build or fix next?
    url: https://forms.cloud.microsoft/r/5a8RCi2YKP
    note: Five questions, about two minutes.
    button: Share your feedback

closed:
  - question: Which AI workshop would you be interested in attending?
    outcome: Closed July 19, 2026; results are with the committee.
