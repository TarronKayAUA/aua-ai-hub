# Pronunciation lexicon for the narration voice (scripts/narrate.py).
# Owner-owned. Each entry maps a term as it appears in page text to the
# form the voice should read. Matching is whole-word and case-sensitive,
# so "AI" here does not touch "AIDS" or "said". Acronyms the voice would
# otherwise read as words are spelled out with spaces; terms that are
# genuinely said as words (FERPA, ERAS, MERSQI, PRISMA) are left alone.
# Add an entry when a mispronunciation is reported; regenerate with
# `python scripts/narrate.py` and the affected pages re-narrate because
# their spoken text, and therefore their hash, changed.

terms:
  AI: "A I"
  AUA: "A U A"
  AUACOM: "A U A com"
  LLM: "L L M"
  LLMs: "L L Ms"
  MCQ: "M C Q"
  MCQs: "M C Qs"
  NBME: "N B M E"
  USMLE: "U S M L E"
  PHI: "P H I"
  AAMC: "A A M C"
  ECFMG: "E C F M G"
  NRMP: "N R M P"
  CGEA: "C G E A"
  IDE: "I D E"
  GPU: "G P U"
  GPUs: "G P Us"
  CPU: "C P U"
  VRAM: "V RAM"
  EED: "E E D"
  IRB: "I R B"
  ICMJE: "I C M J E"
  PDF: "P D F"
  PDFs: "P D Fs"
  URL: "U R L"
  API: "A P I"
  UK: "U K"
  US: "U S"
  EU: "E U"
