  # to Microsoft Copilot customers with usage-based billing", "Admins can
  # enable Cowork in the Microsoft 365 admin center". Support page "Transcribe
  # your recordings" (Word for Microsoft 365, Word for the web, OneNote):
  # "converts speech to a text transcript with each speaker individually
  # separated"; .wav, .mp4, .m4a, .mp3; "maximum of 300 minutes of uploaded
  # audio per month" with a Microsoft 365 subscription, 30,000 with a Copilot
  # license; recordings go to a Transcribed Files folder on OneDrive. The
  # transcription needs only Microsoft 365, so the blurb does not tie it to
  # Copilot.
  also_for: [slides, agents, transcribe]
  url: https://www.microsoft.com/en-us/microsoft-365-copilot
  # Owner confirmed 2026-09-26: AUA licenses Copilot for a small number of
  # faculty (the owner among them); students are unlikely to have access.
  cost: AUA-licensed
  governance_status: licensed
  status_note: "AUA licenses Copilot for a small number of faculty; students are unlikely to have access through AUA."
  last_reviewed: 2026-10-02
