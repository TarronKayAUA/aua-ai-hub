- name: Microsoft 365 Copilot
  vendor: Microsoft
  category: assistants
  # Cowork and Word's transcription folded in 2026-10-02 (tool discovery issue
  # #52, owner approved, in place of new cards). Read that day:
  # microsoft.com/en-us/microsoft-365-copilot/cowork, "Cowork plans the steps,
  # picks the right skills and apps, pauses for your approval at key
  # checkpoints, and returns finished artifacts", "sensitive steps, like
