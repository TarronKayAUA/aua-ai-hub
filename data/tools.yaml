# Recommended tools directory. Rendered into docs/tools/index.md at build time
# by scripts/render_data.py. Edit this file only; never the rendered page.
#
# governance_status values: listed | licensed | reviewed | caution | restricted
# Statuses describe the institution's relationship with a tool, never a
# pending process (reframed 2026-07-14, owner-approved): listed = in the
# directory, not an endorsement; licensed = institutionally procured;
# reviewed = examined by the AI Committee (on request, via the review
# process); caution = a committee review outcome, with the concern documented in the status note;
# restricted = reviewed and found unsuitable.
# Only the owner changes governance_status.
#
# Task chooser key (optional, per entry, added 2026-09-23): `also_for:` lists
# extra task ids from data/tool_tasks.yaml. Every tool already joins one
# task through its category; cross-list a tool under another task only
# where its own blurb or status note, or an existing guide page on this
# site, names that task. The render hook fails on an unknown id.
#
# Content-watch keys (optional, per entry): the weekly content-watch
# workflow verifies entries against their pages and bumps last_reviewed
# when unchanged. verify_url points it at a fetchable marketing page when
# the product url is a login wall; `verify: skip` excludes an entry whose
# pages never yield text to a scripted fetch (those stay owner-reviewed).
#
# Skip sweep 2026-08-26: every `verify: skip` entry was probed for a
# fetchable surface carrying a real product description. Three were
# recovered (Perplexity, OpenEvidence, Osmosis AI). The rest stay skipped
# and the reason is per-entry: Nabu Tutor, StudyFetch and Gamma 403 every
# candidate; Adobe Firefly and Adobe Podcast time out; SciSpace does not
# resolve; Midjourney and Udio serve help shells too thin to verify
# against; Consensus offers only a volatile blog index; and Z.ai's only
# substantial surface is API documentation describing a different product
# from the chat assistant listed here, which would invite false drift
# flags. Re-probe before assuming any of these is still unreachable.

- name: Claude
  vendor: Anthropic
  category: assistants
  # Claude Slides added 2026-10-02 (tool discovery issue #52, owner approved:
  # decks point to Claude Slides). It is a feature of Claude, not a separate
  # product, so it sits in this entry (issue #51 declined a card of its own on
  # 2026-09-22). Read 2026-10-02: claude.com/features/artifacts, "Claude
  # Design, Claude Slides and Claude Docs are available in beta on paid plans"
  # and "You can export your deck to PowerPoint and PDF"; Help Center, Claude
  # Design admin guide, "Make on-brand decks from notes, reports, or an
  # existing conversation, and export them to PowerPoint or PDF".
  # Updated 2026-10-09 (owner approved): Anthropic took Claude Docs, Slides and
  # Design out of beta on 2026-10-08. Read 2026-10-09:
  # claude.com/resources/articles/dashboards-and-motion (dated October 8,
  # 2026), "Claude Docs, Slides, and Design are out of beta and available on
  # every plan, including Free"; Help Center, What are artifacts, "The Docs,
  # Slides, and Design templates are available on all plans and are on by
  # default" and "Decks export to PowerPoint and PDF, or go straight to Google
  # Slides as editable files". Two features announced the same day were left
  # out: Claude Motion (animated explainers exported as MP4; beta on Team and
  # Enterprise only), offered to the owner and not taken for now, and Claude
  # Dashboards (beta on paid plans; needs a company data platform such as
  # BigQuery, Snowflake or Salesforce), which does not fit the Hub's readers.
  also_for: [slides]
  url: https://claude.com
  cost: freemium
  governance_status: listed
  last_reviewed: 2026-10-09
  blurb: General-purpose artificial intelligence assistant for writing, analysis, coding, and answering questions through a chat interface. On every plan, including Free, its Claude Slides feature builds a presentation from notes, a report, or a conversation and exports it to PowerPoint, PDF, or Google Slides.

