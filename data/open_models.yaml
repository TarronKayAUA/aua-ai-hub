# Discovery survey additions (owner-directed open-weights audit,
# 2026-07-15): licenses read verbatim from each Hugging Face model card
# tag the same day.

- name: MiniMax M3
  vendor: MiniMax
  url: https://huggingface.co/MiniMaxAI/MiniMax-M3
  license: MiniMax Community
  last_reviewed: 2026-07-15
  blurb: Large open-weight mixture-of-experts model from the Chinese company MiniMax, with about 428 billion total parameters and 23 billion active per token. Accepts text, image, and video input with a 1 million token context window.

- name: MedGemma
  vendor: Google
  url: https://huggingface.co/google/medgemma-1.5-4b-it
  license: Health AI Developer Foundations
  last_reviewed: 2026-07-15
  blurb: Google's open medical variants of Gemma, trained for medical text and image comprehension across radiology, pathology, dermatology, and medical records. Downloading requires accepting Google's Health AI Developer Foundations terms, which permit research and commercial use.

# Auto-verified 2026-07-21: license apache-2.0 from the Hugging Face card tag; repository chosen from search results against the news evidence.
- name: Bonsai 27B
  vendor: PrismML
  url: https://huggingface.co/prism-ml/Bonsai-27B-gguf
  license: Apache 2.0
  last_reviewed: 2026-07-21
  blurb: Bonsai 27B is PrismML's 27B-parameter open-weight model, built on Qwen3.6 27B and compressed via ternary and 1-bit quantization to run locally on phones and laptops with a 262K-token context, released under the Apache 2.0 license.

# Auto-verified 2026-07-21: license apache-2.0 from the Hugging Face card tag; repository chosen from search results against the news evidence.
- name: Inkling
  vendor: Thinking Machines Lab
  url: https://huggingface.co/thinkingmachines/Inkling
  license: Apache 2.0
  last_reviewed: 2026-07-21
  blurb: Inkling is Thinking Machines Lab's first open-weights model, a Mixture-of-Experts transformer with 975B total parameters (41B active) and up to a 1M token context window, released under the Apache 2.0 license.

# Verified 2026-07-28 (content-watch issue #28, owner approved): the HF
# card tag is "other" with license_name mit; there is no LICENSE file in
# the repo, and the actual text at
# https://www.domyn.com/legal/software-licenses/domyn-small was read in
# full the same day. It is an MIT-pattern grant naming the model:
# commercial use, modification, redistribution, and sale allowed, notice
# preservation the only condition, no acceptable-use or field-of-use
# limits. Label the license from that read, not from the "other" tag.
- name: Domyn-Small
  vendor: Domyn (formerly iGenius)
  url: https://huggingface.co/domyn/Domyn-Small-v1.0
  license: MIT-style (text on domyn.com)
  last_reviewed: 2026-07-28
  blurb: European 10 billion parameter reasoning model from the Milan company Domyn, with a dual thinking mode toggleable from the system prompt, a 32K native context extensible to 128K, and coverage optimized for English, Italian, Spanish, French, and German. Its MIT-style license permits commercial use.

# Verified 2026-08-11 (content-watch issue #39, owner approved): license
# apache-2.0 read from the Hugging Face card tag on
# meta-models/Muse-Glimmer-30B; meta-models is Meta Inc.'s verified org
# (distinct from meta-llama), with official GGUF and ExecuTorch
# variants published alongside and the card's pipeline tag
# image-text-to-text. Meta's first release under plain Apache 2.0
# rather than the Llama community license.
- name: Muse Glimmer
  vendor: Meta
  url: https://huggingface.co/meta-models/Muse-Glimmer-30B
  license: Apache 2.0
  last_reviewed: 2026-08-11
  blurb: Meta's 30 billion parameter open-weight model, accepting image and text input and optimized for agentic task completion and local use, with official GGUF and on-device variants. Notably Meta's first release under plain Apache 2.0 rather than the Llama community license.

# Verified 2026-08-18 (content-watch issue #40, owner approved): repos
# under NVIDIA's official org since 2026-08-01 (BF16 and NVFP4
# variants); the "other" license tag resolves to license_name
# openmdw-1.1, the Linux Foundation's Open Model, Data and Weights
