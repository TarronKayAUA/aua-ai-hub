# Added 2026-09-29 (tool discovery issue #52, owner approved). The Hugging
# Face card tag (read via the API that day) is "other" with license_name
# health-ai-developer-foundations, linked to
# developers.google.com/health-ai-developer-foundations/terms: the same
# terms and label as the MedGemma entry, so it is named the same way. These
# are Google's terms of use, not an open-source license. The repo is gated
# (auto), so facts come from Google's public model card, read the same day:
# Conformer architecture, 105M parameters, version 1.0.0 created December
# 18, 2025, about 5,000 hours of de-identified physician dictation, "All
# training data is in English", most speakers had English as a first
# language and were raised in the United States, and outputs "may include
# transcription errors and are not intended to directly inform clinical
# diagnosis".
- name: MedASR
  vendor: Google
  url: https://huggingface.co/google/medasr
  license: Health AI Developer Foundations
  modality: audio
  last_reviewed: 2026-09-29
  blurb: Google's open-weight speech recognition model for medical dictation, which turns recorded speech into text. It has 105 million parameters and was trained on about 5,000 hours of de-identified physician dictation in radiology, internal medicine, family medicine, and other specialties. English only, and most training speakers were native English speakers raised in the United States, so accuracy may be lower for other accents. Downloading requires accepting Google's Health AI Developer Foundations terms, and its model card says outputs may contain transcription errors and are not intended to directly inform clinical decisions.

# Added 2026-09-29 (tool discovery issue #52, owner approved). License
# apache-2.0 read via the Hugging Face API that day from the
# hexgrad/Kokoro-82M card tag (base model yl4579/StyleTTS2-LJSpeech); the
# GitHub repo hexgrad/kokoro is also Apache-2.0. The card's release table
# gives v1.0, published 2025 Jan 27, "8 & 54" languages and voices, and it
# is still the current release (the only later hexgrad repo is the
# Chinese-focused Kokoro-82M-v1.1-zh of 2025-02-27). VOICES.md lists 28 of
# the 54 voices as American or British English and says "Support for
# non-English languages may be absent or thin". Training data per the card:
# "exclusively on permissive/non-copyrighted audio data" (public domain,
# permissively licensed, and synthetic audio). This site's news narration
# runs on Kokoro (feeds.yaml narration block); that is recorded here for
# transparency only and is deliberately absent from the blurb, so the
# listing reads like any other and is not an endorsement.
- name: Kokoro
  vendor: hexgrad (independent developer)
  url: https://huggingface.co/hexgrad/Kokoro-82M
  license: Apache 2.0
  modality: audio
  last_reviewed: 2026-09-29
  blurb: A small text-to-speech model, 82 million parameters, that reads text aloud in 54 preset voices across eight languages and is small enough to run on a personal computer, under Apache 2.0. More than half of its voices are American or British English, and its voice list notes that support for other languages may be thin. Version 1.0, from January 2025, is the current release; its developer says it was trained only on public domain, permissively licensed, or synthetic audio.

