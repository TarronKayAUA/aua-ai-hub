# License first verified 2026-07-15 from the LTX-2 model card tag
# (ltx-2-community-license-agreement). Updated 2026-09-29 (tool discovery
# issue #52, owner approved), all read that day via the Hugging Face API and
# the Lightricks/LTX-2 GitHub repo. Link moved from Lightricks/LTX-2 to
# Lightricks/LTX-2.3 (created 2026-03-04, ungated; the LTX-2 card's own
# new_version field points to it). The 2.3 card tag is unchanged: license
# other, license_name ltx-2-community-license-agreement, linked to
# LICENSE-2 (dated January 5, 2026), so the license field stays. The repo's
# LICENSE index says that license covers "all LTX-2 versions released since
# January 5, 2026, including LTX-2.3 until August 11, 2026". LTX-2.5
# (created 2026-07-23, the current flagship) was NOT linked: its card tag is
# a different license, ltx-2.x-community-license-agreement (LICENSE-2_x,
# dated August 11, 2026), and it is gated behind a Hugging Face sign-in
# whose "Agree and Access" text includes consent to offers and personalized
# advertising. The old "free for academic use" was wrong: neither license
# mentions academic or educational use. LICENSE-2 section 2: "Entities with
# annual revenues of at least $10,000,000 ... are required to obtain a paid
# commercial use license", with revenue counted across subsidiaries and
# affiliates. LICENSE-2_x keeps the threshold but lets larger organizations
# use it unpaid "solely for a Non-Commercial Purpose" (testing, evaluation,
# or non-commercial research in a non-production environment). The 22B
# size is from the 2.3 checkpoint names (ltx-2.3-22b-dev); the LTX-Video
# sentence was dropped because a 22B model does not fit "modest hardware".
- name: LTX-2
  vendor: Lightricks
  url: https://huggingface.co/Lightricks/LTX-2.3
  license: LTX-2 Community License
  modality: video
  last_reviewed: 2026-09-29
  blurb: Lightricks' open-weight family that generates video with synchronized sound in a single model; the version linked, LTX-2.3, has 22 billion parameters and runs locally in ComfyUI. Free under its community license for organizations with annual revenue under US$10 million, counted together with affiliated companies; larger organizations need a paid license from Lightricks, and the license makes no exception for academic use. The newer LTX-2.5 uses a separate license with the same revenue threshold and requires signing in to Hugging Face to download.

