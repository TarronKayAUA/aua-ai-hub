# Open-weights model families. Rendered into the "Open-weights models"
# section of docs/tools/index.md at build time by scripts/render_data.py.
# Edit this file only; never the rendered page.
#
# These are model families, not hosted services, so entries carry a license
# instead of a cost and governance badge. Blurbs may name current flagship
# releases; refresh them (and last_reviewed) when a family moves on.
#
# modality: language (default when absent) | image | video | audio | data.
# The section renders one subsection per modality. License names follow the
# Hugging Face model card license tag, verified at authoring.

- name: gpt-oss
  vendor: OpenAI
  url: https://openai.com/index/introducing-gpt-oss/
  license: Apache 2.0
  last_reviewed: 2026-06-10
  blurb: OpenAI's open-weight pair. gpt-oss-120b runs on a single 80 gigabyte graphics card with reasoning performance near the company's o4-mini, and gpt-oss-20b runs on machines with 16 gigabytes of memory.

# Added 2026-09-01 (content watch, owner approved). Apache 2.0 read from
# the ibm-granite/granite-4.2-8b card 2026-09-01; published 2026-08-13 in
# 3B, 8B, and 30B sizes. IBM was not previously on this roster.
- name: Granite 4.2
  vendor: IBM
  url: https://huggingface.co/ibm-granite
  license: Apache 2.0
  last_reviewed: 2026-09-01
  blurb: IBM's open-weight family, built for tool calling and agent work at sizes that run on ordinary hardware. The 4.2 release comes in 3 billion, 8 billion, and 30 billion parameter versions under Apache 2.0, with quantized builds published alongside for lower-memory machines.

- name: Llama 4
  vendor: Meta
  url: https://www.llama.com
  license: Llama Community License
  last_reviewed: 2026-06-10
  blurb: Meta's open-weight family and the most widely deployed. Llama 4 Scout and Maverick handle text and images natively, and Scout offers a context window of up to 10 million tokens.

- name: Gemma 4
  vendor: Google
  url: https://deepmind.google/models/gemma/
  license: Apache 2.0
  last_reviewed: 2026-06-10
  blurb: Google's open model family, released April 2026, from 2 billion parameter on-device variants to a 31 billion parameter model, with vision and audio input and support for over 140 languages.

# Refreshed 2026-08-13 for the Qwen3.8 release (content watch had
# proposed this twice while the weights were still unpublished; the
# repos landed under the official Qwen org between 08-05 and 08-13).
# Licenses read from each card: Qwen3.8-27B is tagged apache-2.0 like
# the rest of the line, but the 2.4T flagship carries license "other"
# with license_name qwen3.8-max, whose text (read in full the same
# day) is an MIT-style grant with two conditions that bite only at
# scale: attribution on the interface for products above 100M monthly
# users or US$20M monthly revenue, and a separate Qwen license for
# model-as-a-service or AI work-assistant businesses above US$50M
# annual revenue. Neither reaches an institution running the model for
# teaching or research, but the family license line stays honest about
# the split rather than calling the whole line Apache.
- name: Qwen3
  vendor: Alibaba
  url: https://huggingface.co/Qwen
  license: Apache 2.0 (Qwen3.8-Max license on the 2.4T flagship; Qwen Community License 1.0 on Flash-Next)
  last_reviewed: 2026-09-01
  blurb: Alibaba's open-weight line, offered in the widest range of sizes, from models small enough for a laptop to flagship scale, with broad multilingual coverage. The August 2026 Qwen3.8 release opened a Max-class flagship for the first time (2.4 trillion parameters with 95 billion active, data-center hardware only) alongside a 27 billion parameter vision-language model that runs on a workstation, both with a 262,000 token context extensible to about 1 million. Qwen3.8-Flash-Next, published later that month as a preview of the next architecture, is multimodal and carries a third license.

- name: DeepSeek
  vendor: DeepSeek
  url: https://huggingface.co/deepseek-ai
  license: MIT
  last_reviewed: 2026-06-10
  blurb: DeepSeek publishes the weights of its flagship chat and reasoning models, including the V4 series, under the permissive MIT license.

- name: Kimi
  vendor: Moonshot AI
  url: https://huggingface.co/moonshotai
  # K3 weights published; license read from the Kimi-K3 card's LICENSE
  # file 2026-08-25 (license_name kimi-k3): MIT-style grant with
  # conditions only at very large scale (model-as-a-service businesses
  # over 20 million dollars in 12-month revenue need a separate
  # agreement; products over 100 million monthly users or 20 million
  # dollars monthly revenue must display "Kimi K3"). Same structure as
  # the K2 line's modified MIT, so the label below still fits.
  license: Modified MIT
  last_reviewed: 2026-08-25
  blurb: Moonshot AI's open-weight family, among the strongest published models on coding and agentic benchmarks. The flagship K3, at 2.8 trillion total parameters with a 1 million token context window, now has published weights under an MIT-style license whose extra conditions apply only to very large commercial deployments; a model that size needs data-center hardware, not a consumer graphics card.

- name: Mistral
  vendor: Mistral AI
  url: https://mistral.ai/models
  license: Apache 2.0
  last_reviewed: 2026-06-10
  blurb: French lab Mistral's open-weight range, from the small Ministral models to Mistral Large 3, with most flagship releases under Apache 2.0.

# The next three were added 2026-07-02 via content-watch issue #6 (owner
# approved). Licenses verified from each Hugging Face model card.

# GLM 5.3 published 2026-08-25 (zai-org/GLM-5.3). The license changed with
# it and the version bump alone would have carried a wrong license field
# forward: 5.2 was MIT, 5.3 ships a custom "GLM-5.3 License" read from the
# repo's LICENSE file 2026-09-01. It is an MIT-style grant (use, modify,
# distribute, sell, fine-tune, all permitted) with one condition, which no
# university triggers: a Model-as-a-Service business whose group revenue
# exceeds 10 billion US dollars over any 12 months must pass a Z.AI
# security review before commercial use.
- name: GLM 5.3
  vendor: Z.ai (Zhipu AI)
  url: https://huggingface.co/zai-org/GLM-5.3
  license: GLM-5.3 License
  last_reviewed: 2026-09-01
  blurb: The current flagship of the GLM open-weight family behind the Z.ai assistant, a mixture-of-experts model that keeps the 5.2 base model and gains its improvements from post-training, with the largest gains in complex coding. Supported by local toolchains including llama.cpp. Published under a custom license that permits use, modification, and redistribution, with conditions that apply only to very large commercial providers.

- name: LongCat 2.0
  vendor: Meituan
  url: https://huggingface.co/meituan-longcat/LongCat-2.0
  license: MIT
  last_reviewed: 2026-07-02
  blurb: A very large open-weight mixture-of-experts model from Chinese company Meituan, 1.6 trillion total parameters with about 48 billion active per token and a 1 million token context window, under MIT.

- name: openPangu 2.0 Flash
  vendor: Huawei
  url: https://huggingface.co/openpangu/openPangu-2.0-Flash
  license: OpenPangu license
  last_reviewed: 2026-07-02
  blurb: Huawei's open-weight mixture-of-experts model, 92 billion total parameters with 6 billion active and a 512k context window, trained on Huawei's own accelerators under a custom license.

# Verified 2026-07-07: license apache-2.0 from the Hugging Face card tag;
# Succeeded by Hy4 preview, published 2026-08-27. Specifications read
# from the model card 2026-09-01: 770B total, 49B activated per token,
# 1M context, Apache 2.0 confirmed from the card's own license field.
# Hy3 was 295B total / 21B active / 256k context.
- name: Hy4 Preview
  vendor: Tencent
  url: https://huggingface.co/tencent/Hy4-preview
  license: Apache 2.0
  last_reviewed: 2026-09-01
  blurb: A very large open-weight mixture-of-experts model from Chinese company Tencent, 770 billion total parameters with 49 billion active per token and a 1 million token context window, under Apache 2.0. Data-center hardware only. It succeeds Hy3, which was roughly a third the size.

# Verified 2026-07-07: license tag "other" resolves to
# tabfm-non-commercial-v1.0 on the Hugging Face card; named verbatim.
- name: TabFM
  vendor: Google Research
  url: https://huggingface.co/google/tabfm-1.0.0-pytorch
  license: TabFM Non-Commercial v1.0
  modality: data
  last_reviewed: 2026-07-07
  blurb: Google Research's open-weight foundation model for tabular data, making zero-shot predictions on spreadsheet-style datasets without task-specific training. Relevant to research data analysis; weights are licensed for non-commercial use.

# --- Image generation (owner approved 2026-06-12) ---------------------------

# License verified 2026-07-15 from the FLUX.2-dev model card tag
# (flux-non-commercial-license). The smaller klein variant's repo is
# gated, so its license is not asserted here.
- name: FLUX.2
  vendor: Black Forest Labs
  url: https://huggingface.co/black-forest-labs/FLUX.2-dev
  license: FLUX Non-Commercial (dev)
  modality: image
  last_reviewed: 2026-07-15
  blurb: The most capable open-weight image family. FLUX.2 dev (32 billion parameters) generates and edits images under a non-commercial license, with a smaller klein variant for lighter hardware. Runs locally in ComfyUI.

- name: Stable Diffusion 3.5
  vendor: Stability AI
  url: https://huggingface.co/stabilityai/stable-diffusion-3.5-large
  license: Community License
  modality: image
  last_reviewed: 2026-06-12
  blurb: The widely supported image generation line with the largest ecosystem of community fine-tunes and tooling. Free for individuals and small organizations under Stability's community license.

- name: Qwen-Image
  vendor: Alibaba
  url: https://huggingface.co/Qwen/Qwen-Image
  license: Apache 2.0
  modality: image
  last_reviewed: 2026-06-12
  blurb: Image generation and editing model under a fully permissive license, notably strong at rendering legible text inside images.

