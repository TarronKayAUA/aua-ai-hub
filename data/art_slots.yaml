# Island Night vignettes: the places on reading pages where a small scene fills
# a space nothing useful fits (owner direction, 2026-09-27). Owner-owned: a
# place is listed only once the owner has approved it. scripts/layout_art.py
# reads this file, puts an empty, decorative <figure> at the end of the named
# section, and fails the build if a page or section here no longer exists.
# docs/assets/art/island-vignettes.js draws each scene from Island Night's own
# data and palette (docs/assets/art/island-core.js, the --isl-* tokens in
# docs/stylesheets/layout-art.css), only where the space exists (from 68.75em).
#
# The order of preference for any empty space stays: rearrange what is there,
# then something functional from the data, and art only where neither fits.
#
# Each entry:
#   page     the page's source path under docs/
#   section  the id of the h2 whose section the scene sits beside, or _head
#            for a landing page's head (the scene beside the title and lede),
#            or [first, last] for sections stacked beside it, where first may
#            be _title to start the stack at the page's title (the About page)
#   piece    the subject drawn (a key in island-vignettes.js)
#   kind     the page's kind (data/section_map.yaml `kinds:`), whose hue is
#            the scene's one small accent; leave it out on a page with no
#            kind (a hub), and the accent takes Island Night's own warm light
#   aspect   optional: height / width of the picture (a wide head slot);
#            without it the picture is as tall as the window allows
#   fit      optional: `text` makes the picture exactly as tall as the text
#            beside it, so the head keeps the height it had
#   caption  optional: what the picture shows, in sentence case, with no
#            final period. It is shown under the picture as one quiet line,
#            followed by the time of day the picture is drawn at (the
#            `captions` block below), so write it to read well before "at
#            dusk" or "by day". Give one only where it names something
#            specific: a picture that is not of a particular place (the
#            guides' steps, the Learn telescope) has none, since its caption
#            would only describe what is already evident (owner, 2026-09-29).

# Captions (owner, 2026-09-29: "beneath the picture is fine as long as it
# doesn't take too much space and displace other elements"; "a time of day
# addition is a great idea"): every picture says what it shows, then the time
# of day it is drawn at, which follows the visitor's clock with the picture.
# The picture gives up exactly the caption's height, so its top stays level
# with the title and nothing below it moves. The time words link to the
# write-up that explains the five versions (`about`, a docs page and its
# heading's id; the build fails if either is gone), and hovering them shows
# `hover` (owner: "About the pictures shows on hover"). The home page's hero
# has no caption.
#
# The captions' facts were checked 2026-09-29, twice, independently: Shirley
# Heights overlooks both harbours (visitantiguabarbuda.com), but the view runs
# west-northwest to northwest (measured bearings 283 to 313 degrees), so the
# caption gives no compass word; Montserrat is in view from Curtain Bluff
# (curtainbluff.com/about) and lies southwest of it, not west; one of Betty's
# Hope's two mills is restored (antiguamuseums.net/bettys-hope-trust); the
# Museum of Antigua and Barbuda occupies the former courthouse, which sources
# date to 1747 or 1750, so the caption gives no date
# (antiguamuseums.net/portfolios/about-the-museum); Fort James stands at the
# harbour's entrance with its walls and guns (discoverantiguabarbuda.com/
# forts-of-antigua). Antigua Sailing Week races by day, so its picture is
# captioned by the place, which stays true at every hour.
captions:
  times:
    dawn: at dawn
    day: by day
    sunset: at sunset
    dusk: at dusk
    night: at night
  about: worked-examples/redesign.md#the-same-place-at-five-times-of-day
  hover: About the pictures

slots:
  # Owner's review, 2026-09-28: the campus moved to the homepage hero (drawn by
  # island-core.js, no slot here) and the Curtain Bluff view to For Faculty &
  # Staff were approved. The pieces staged for News & Events (st-johns-harbour),
  # the guides index (pillars-of-hercules) and the Lecture Outline
  # (nelsons-dockyard) were not: news and the guides should have art about
  # what they are, and art on one example page but not the others reads oddly.
  # St John's Harbour later took the About page. The other two were retired on
  # 2026-09-29 (owner: the Pillars "probably not quite up to the same level of
  # quality"; "retire both"), since every page with art downloads the drawings.
  #
  # Art round 7 (owner, 2026-09-29): pictures for the pages with an empty space
  # beside the title, each tied to the page's title at a glance ("I want someone
  # to look at the image and immediately be able to tie it to the title of the
  # page"); not necessarily Antigua or a real place, and "fantastical or sci-fi"
  # where that fits better; still in five times of day wherever sky shows.

  # The For Students landing's head, where the frame was empty beside the
  # title (800x320 at 1920, the top of the page): Shirley Heights at dusk,
  # from the owner's photographs (art round 2, 2026-09-27).
  - page: students.md
    section: _head
    piece: shirley-heights
    caption: "Shirley Heights, looking over English Harbour and Falmouth Harbour"
    aspect: 0.42

  # The For Faculty & Staff landing's head (800x304 at 1920): the Curtain
  # Bluff view that was the homepage's until the campus took its place (the
  # owner asked for it to move to another page), the partner of Shirley
  # Heights on For Students (art round 3, 2026-09-27).
  - page: faculty.md
    section: _head
    piece: curtain-bluff
    caption: "The view from Curtain Bluff, with Montserrat on the horizon"
    aspect: 0.42

  # The News & Events landing's head: Antigua Sailing Week, the island's
  # signature event (the owner chose it, 2026-09-28).
  - page: news-and-events.md
    section: _head
    piece: sailing-week
    caption: "Yachts under sail off English Harbour"
    kind: news
    aspect: 0.42

  # The Step-by-Step Guides index's head: lamp-lit stone steps up to a
  # lookout, lighting one by one (the owner chose it, 2026-09-28).
  - page: playbooks/index.md
    section: _head
    piece: lamp-steps
    kind: guide
    aspect: 0.42

  # The main pages that had no Island Night art (owner, 2026-09-28): each
  # picture fits the height of the text beside it, so nothing below moves.
  # Learn: the AUA library's study hall (owner, 2026-09-29: art that relates
  # to Antigua and AUA, drawn from AUA's photographs of the library; the
  # telescope it replaced is kept in island-vignettes.js to be placed
  # elsewhere). The neuron plate that was here earlier moved to Module 1.
  - page: pathway/index.md
    section: _head
    piece: library
    caption: "The library at the American University of Antigua"
    kind: lesson
    fit: text

  # Courses and Resources: the telescope at a hilltop lookout, learning as
  # looking further, which stood at the head of Learn until the library took
  # that place; it replaces the section banner (archived in graphics/archive/),
  # as the Old Court House replaced Governance's (owner, 2026-09-29: "I
  # actually want to place it somewhere now because it is beautiful"). No
  # caption: it is not a particular place.
  - page: learning/index.md
    section: _head
    piece: telescope
    kind: lesson
    fit: text

  # The Tool Directory's head: the tool wall, a workshop's shadow board with every tool in its painted
  # outline (owner, 2026-09-29: art that ties to the page's title at a glance; "it doesn't have to be a
  # location"). Not a particular place, so no caption.
  - page: tools/index.md
    section: _head
    piece: tool-wall
    kind: tool
    fit: text

  # Learning to Prompt's head: the prompting desk, a notebook's handwriting lifting off the page as a
  # ribbon of light into a speech bubble, answered by a glowing orb (owner, 2026-09-29: art tied to the
  # title at a glance, "fantastical or sci-fi" where it fits better). Not a place, so no caption.
  - page: prompts/learning.md
    section: _head
    piece: prompt-desk
    kind: prompt
    fit: text

  # The Announcements page's head: the bell tower, its bell mid-swing and rings of sound spreading, a
  # notice board of pinned notes at its foot (owner, 2026-09-29: art tied to the title at a glance).
  # Not a particular place, so no caption.
  - page: announcements/index.md
    section: _head
    piece: bell-tower
    kind: news
    fit: text

  # Tools & Prompts: the Betty's Hope sugar mill, a tool that turns wind
  # into work ("just fit it in to the small section of text at the top").
  - page: tools-and-prompts.md
    section: _head
    piece: bettys-hope
    caption: "The restored sugar mill at Betty's Hope"
    fit: text

  # Governance: the Old Court House in St John's (1750), where the court sat
  # and the Legislative Council met; replaces the old banner (archived in
  # graphics/archive/).
  - page: governance/index.md
    section: _head
    piece: court-house
    caption: "The former courthouse in St John's, now the Museum of Antigua and Barbuda"
    kind: governance
    fit: text

  # About: the title, Contact and Purpose stacked in one column, St John's
  # harbour from Fort James beside them, its top level with the title as on
  # the landings (owner, 2026-09-29).
  - page: about.md
    section: [_title, purpose]
    piece: st-johns-harbour
    caption: "The harbor at St John's, from the walls of Fort James"
    fit: text
