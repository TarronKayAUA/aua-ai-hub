# Island Night vignettes: the places on reading pages where a small scene fills
# a space nothing useful fits (owner direction, 2026-09-27). Owner-owned: a
# place is listed only once the owner has approved it. scripts/layout_art.py
# reads this file, puts an empty, decorative <figure> at the end of the named
# section, and fails the build if a page or section here no longer exists.
# docs/assets/art/island-vignettes.js draws each scene from Island Night's own
# data and palette (docs/assets/art/island-core.js, the --isl-* tokens in
# docs/stylesheets/layout-art.css), only where the space exists (from 68.75em).
#
# The order of preference for any empty space stays: rearrange what is there,
# then something functional from the data, and art only where neither fits.
#
# Each entry:
#   page     the page's source path under docs/
#   section  the id of the h2 whose section the scene sits beside, or _head
#            for a landing page's head (the scene beside the title and lede),
#            or [first, last] for sections stacked beside it, where first may
#            be _title to start the stack at the page's title (the About page)
#   piece    the subject drawn (a key in island-vignettes.js)
#   kind     the page's kind (data/section_map.yaml `kinds:`), whose hue is
#            the scene's one small accent; leave it out on a page with no
#            kind (a hub), and the accent takes Island Night's own warm light
#   aspect   optional: height / width of the picture (a wide head slot);
#            without it the picture is as tall as the window allows

slots:
  # Owner's review, 2026-09-28: the campus moved to the homepage hero (drawn by
  # island-core.js, no slot here) and the Curtain Bluff view to For Faculty &
  # Staff were approved. The pieces staged for News & Events (st-johns-harbour),
  # the guides index (pillars-of-hercules) and the Lecture Outline
  # (nelsons-dockyard) were not: news and the guides should have art about
  # what they are, and art on one example page but not the others reads oddly.
  # Those three drawings are kept in island-vignettes.js, unplaced, for later.

  # The For Students landing's head, where the frame was empty beside the
  # title (800x320 at 1920, the top of the page): Shirley Heights at dusk,
  # from the owner's photographs (art round 2, 2026-09-27).
  - page: students.md
    section: _head
    piece: shirley-heights
    aspect: 0.42

  # The For Faculty & Staff landing's head (800x304 at 1920): the Curtain
  # Bluff view that was the homepage's until the campus took its place (the
  # owner asked for it to move to another page), the partner of Shirley
  # Heights on For Students (art round 3, 2026-09-27).
  - page: faculty.md
    section: _head
    piece: curtain-bluff
    aspect: 0.42

  # The News & Events landing's head: Antigua Sailing Week, the island's
  # signature event (the owner chose it, 2026-09-28).
  - page: news-and-events.md
    section: _head
    piece: sailing-week
    kind: news
    aspect: 0.42

  # The Step-by-Step Guides index's head: lamp-lit stone steps up to a
  # lookout, lighting one by one (the owner chose it, 2026-09-28).
  - page: playbooks/index.md
    section: _head
    piece: lamp-steps
    kind: guide
    aspect: 0.42

  # The main pages that had no Island Night art (owner, 2026-09-28): each
  # picture fits the height of the text beside it, so nothing below moves.
  # Learn: a telescope at a hilltop lookout under the Moon and the Milky Way
  # (the neuron plate that was here moved to Module 1, How AI Works).
  - page: pathway/index.md
    section: _head
    piece: telescope
    kind: lesson
    fit: text

  # Tools & Prompts: the Betty's Hope sugar mill, a tool that turns wind
  # into work ("just fit it in to the small section of text at the top").
  - page: tools-and-prompts.md
    section: _head
    piece: bettys-hope
    fit: text

  # Governance: the Old Court House in St John's (1750), where the court sat
  # and the Legislative Council met; replaces the old banner (archived in
  # graphics/archive/).
  - page: governance/index.md
    section: _head
    piece: court-house
    kind: governance
    fit: text

  # About: the title, Contact and Purpose stacked in one column, St John's
  # harbour from Fort James beside them, its top level with the title as on
  # the landings (owner, 2026-09-29).
  - page: about.md
    section: [_title, purpose]
    piece: st-johns-harbour
    fit: text
