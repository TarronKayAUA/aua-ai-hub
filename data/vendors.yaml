# Company pages (Tools & Prompts > By Company). Rendered into docs/tools/company/<page>.md
# by scripts/render_vendors.py, called from the render_data hook. Owner-owned: started
# 2026-10-09 at the owner's request ("in-depth ... a discussion of the harnesses and tools
# as well as / commands", with "a small visual worked example" for the commands).
#
# Every company gets the same sections, in the same order, so none is favoured. Every
# item carries `source`, the official page it was read from, and each company a
# `checked` date: the day its facts were last read from those sources. Facts came from
# a read-only research run on 2026-10-09 (archive "2026-10-09 Vendor pages research":
# two researchers and a fact-checker per company), re-read where they changed text.
#
# Pages are named by company (anthropic.md, openai.md), never by product: on Windows,
# whose file names ignore case, a page called claude.md IS a CLAUDE.md, the instruction
# file Claude Code loads for any agent working in that folder (found 2026-10-09).
#
# Fields, per company:
#   id, page        the key the page's markers use, and its file under docs/
#   name, company   the product and the company, as they spell them
#   checked         YYYY-MM-DD, when the facts below were last read
#   pricing_url     the company's own pricing page (prices are linked, never copied)
#   plans           name, for (who it is for), adds (what it adds, plain language)
#   models          name, released, best_for, where (plans and apps), source
#   surfaces        name, what, source (the apps and places you use it)
#   features        name, what, plans, status (beta or available), source
#   harnesses       the company's agents: id, name, what, runs (where it runs), plans,
#                   acts (how it works), modes (name, what), instructions, skills,
#                   hooks, subagents, connectors, sandbox, source
#   commands        harness, command, what, group, example (situation, typed, shown
#                   lines, note, why), source. `shown` is what the documentation describes
#                   or shows the user seeing; it is drawn as an illustration, never a
#                   screenshot, and the figure says so. Lines in square brackets describe
#                   the screen rather than quote it; lines starting "option: " are the
#                   choices of a menu, in the documentation's own words. `note` (optional)
#                   is an explanation, drawn under the terminal, not inside it.
#   command_groups  the order and titles of the command groups
#   shortcuts       harness, keys, what, source
#   symbols         harness, syntax, what, source (@ mentions, ! shell, keywords)
#   full_lists      the company's own complete references
#   privacy         title, url, covers (linked, never restated)
#   changes         date, change, source (recent dated changes, newest first)

vendors:
  - id: anthropic
    page: tools/company/anthropic.md
    name: Claude
    company: Anthropic
    checked: 2026-10-09
    pricing_url: https://claude.com/pricing
    plans:
      - name: Free
        for: Anyone trying Claude
        adds: Chat on the web, desktop and phone apps; web search, file creation and running code; memory; connectors and skills; Docs, Slides and Design; up to five projects. Sonnet and Haiku models only.
        source: https://claude.com/pricing
      - name: Pro
        for: Individuals for everyday work
        adds: More usage than Free; Opus models; handing over whole tasks (Cowork in any conversation, rolling out); Claude Code; Research; Claude in Chrome and in Microsoft 365; unlimited projects.
        source: https://claude.com/pricing
      - name: Max
        for: People who use Claude all day
        adds: Five or twenty times Pro's usage, higher output limits, priority at busy times, Fable 5.1 for up to half of weekly usage, and monthly credits for Anthropic's developer platform.
        source: https://support.claude.com/en/articles/11049741-what-is-the-max-plan
      - name: Team
        for: Groups of 2 to 150
        adds: Claude Code and Cowork; shared projects; @Claude in Slack (beta); Claude Motion (beta); single sign-on and admin controls; no training on your content by default.
        source: https://claude.com/pricing
      - name: Enterprise
        for: Large organizations
        adds: Everything in Team, plus spend limits, role-based access, audit logs, custom data retention, and a HIPAA-ready configuration.
        source: https://claude.com/pricing
      - name: Claude for Education
        for: A whole university, students, faculty and staff
        adds: Institution-wide access at education pricing, learning mode (Claude asks guiding questions rather than giving answers), and accounts the university manages.
        source: https://claude.com/pricing
    models:
      - name: Claude Opus 5.5
        released: 2026-09-22
        best_for: Anthropic's recommended starting point for most work, and Claude Code's default
        where: Pro, Max, Team and Enterprise; not Free
        source: https://www.anthropic.com/claude/opus
      - name: Claude Fable 5.1
        released: 2026-09-01
        best_for: The most demanding reasoning and long-running agent work
        where: Paid plans, chosen explicitly (on Pro from usage credits; on Max up to half of weekly usage); not Free
        source: https://www.anthropic.com/claude-fable-and-mythos-5-1
      - name: Claude Sonnet 5.5
        released: 2026-09-28
        best_for: Faster, lower-cost everyday work, including documents, slides and spreadsheets
        where: Every plan, including Free
        source: https://www.anthropic.com/claude-sonnet-5-5
      - name: Claude Haiku 5.5
        released: 2026-10-07
        best_for: The fastest and lowest-cost tier, for quick, high-volume tasks
        where: Every plan, including Free
        source: https://www.anthropic.com/claude/haiku
    surfaces:
      - name: Claude on the web
        what: The main app at claude.ai, with conversations, projects, artifacts, memory, connectors and research.
        source: https://claude.com/pricing
      - name: Claude Desktop
        what: The app for Windows, macOS and Linux, plus local abilities such as working in a folder you choose, a built-in browser, computer use (beta on Pro and Max), and the Code tab for Claude Code.
        source: https://claude.com/download
      - name: Phone apps
        what: Chat and voice on iOS and Android, plus checking on and steering tasks started at a desk.
        source: https://claude.com/download
      - name: Claude in Chrome
        what: A browser agent that navigates, clicks and fills forms, asking before financial, personal or work-critical actions.
        source: https://support.claude.com/en/articles/12012173-getting-started-with-claude-in-chrome
      - name: Claude in Microsoft 365 and Google Workspace
        what: Claude inside Word, Excel, PowerPoint and Outlook (Outlook in beta), and a sidebar in Google Docs, Sheets and Slides (public beta, paid plans).
        source: https://claude.com/claude-for-microsoft-365
      - name: '@Claude in Slack'
        what: Tag Claude in a Slack thread or channel to hand it a task (beta, Team and Enterprise).
        source: https://www.anthropic.com/news/introducing-claude-tag
      - name: Claude Science
        what: A research workbench app (public beta, paid plans) for scientific analysis, using the models your plan includes.
        source: https://claude.com/science
    features:
      - name: Artifacts
        what: Anything Claude makes for you to show someone (a document, deck, design or small tool) opens beside the conversation, stays in the Artifacts tab, and can be edited and shared.
        plans: Every plan
        status: Available
        source: https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them
      - name: Claude Docs, Slides and Design
        what: Documents written with Claude and your colleagues; decks exported to PowerPoint, PDF or Google Slides; one-pagers, mockups and prototypes.
        plans: Every plan, including Free
        status: Available since October 8, 2026
        source: https://claude.com/resources/articles/dashboards-and-motion
      - name: Cowork in every conversation
        what: Ask a quick question or hand over a whole task in the same conversation; long tasks keep running in the cloud and finished files come back.
        plans: Rolling out to Pro and Max; others to follow
        status: Rolling out since September 16, 2026
        source: https://claude.com/resources/articles/cowork-is-now-claude
      - name: Projects
        what: Workspaces with their own chats, uploaded knowledge, instructions and separate memory.
        plans: Every plan (five on Free)
        status: Available
        source: https://support.claude.com/en/articles/9517075-what-are-projects
      - name: Memory and chat search
        what: Claude keeps a list of remembered topics you can read, edit or delete under Settings, Memory; sensitive topics such as health are left out unless you turn them on.
        plans: On by default for Free, Pro and Max; off for Team and Enterprise members until they turn it on
        status: Available
        source: https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context
      - name: Incognito chats
        what: A chat that is not saved to your history or searched later (on Team and Enterprise, the organization's retention still applies).
        plans: Every plan
        status: Available
        source: https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context
      - name: Research
        what: Multi-step research that returns a cited answer in minutes.
        plans: Pro and higher
        status: Available
        source: https://support.claude.com/en/articles/11088861-use-research-on-claude
      - name: Model and effort menu
        what: Next to the send button, choose a model and how hard it thinks (Low to Max).
        plans: Every plan; the models offered vary by plan
        status: Available
        source: https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings
      - name: Connectors, skills and plugins
        what: Connect apps such as Google Drive or Microsoft 365 so Claude can draw on them; skills teach it how you like a task done; plugins bundle both.
        plans: Every plan; administrators decide on Team and Enterprise
        status: Available
        source: https://support.claude.com/en/articles/12512180-use-skills-in-claude
      - name: Claude Dashboards
        what: Live dashboards from a company data platform such as BigQuery, Snowflake or Salesforce.
        plans: Paid plans
        status: Beta since October 8, 2026
        source: https://claude.com/resources/articles/dashboards-and-motion
      - name: Claude Motion
        what: Short animated explainers built as editable code from your text and charts, downloaded as an MP4 video.
        plans: Team and Enterprise
        status: Beta since October 8, 2026
        source: https://claude.com/resources/articles/dashboards-and-motion
    harnesses:
      - id: claude-code
        name: Claude Code
        what: Anthropic's agent for work that lives in files. It reads a folder you open for it, edits files in place, and runs commands, with a permission system between its requests and your machine. Despite the name, it is not only for code.
        runs: The terminal (Windows, macOS, Linux), the Code tab of Claude Desktop, VS Code and JetBrains editors, the web at claude.ai/code, and the phone app for cloud sessions.
        plans: Pro, Max, Team and Enterprise; not Free.
        acts: It works in a loop of tool calls (read, search, edit, run, fetch a web page), saving a checkpoint of your files before each turn so you can roll back. Plan mode has it research and propose before touching anything.
        modes:
          - name: Manual
            what: Reads freely; asks before most edits, commands and network access.
          - name: Plan
            what: Researches and proposes a plan; changes nothing until you approve it.
          - name: Accept edits
            what: Edits files and runs common file commands (making folders, moving and copying files) without asking; asks for other commands.
          - name: Auto
            what: A second model reviews each action in your place and blocks ones that go beyond your request. The starting mode in the terminal and VS Code.
          - name: Bypass permissions
            what: No prompts at all. Anthropic's documentation recommends it only for isolated containers or virtual machines.
        instructions: A file named CLAUDE.md in the folder (and one in your home folder for all projects) is read at the start of every session; /init drafts one. It can read a folder's AGENTS.md instead, the file Codex uses.
        skills: Folders containing a SKILL.md file of instructions, used when relevant or run as /skill-name.
        hooks: Your own commands that run at fixed points, such as before a file is edited, for checks that must not depend on the model's judgment.
        subagents: Helpers that take a side task in their own context window and report back; their work counts toward the same usage limits.
        connectors: Connections to outside tools and data through MCP (Model Context Protocol), managed with /mcp.
        sandbox: An optional sandbox limits which files and websites its commands can reach. It is off by default, and on Windows it works only inside WSL2 (the Windows Subsystem for Linux); on plain Windows, commands run unsandboxed.
        source: https://code.claude.com/docs/en/permission-modes
      - id: cowork
        name: Cowork
        what: Anthropic's agent for finished office work. Hand it a task and it returns documents, spreadsheets and decks rather than instructions. It is becoming part of every Claude conversation on Pro and Max.
        runs: Claude on the web, desktop and phone; long tasks run in the cloud, and the desktop app can let it work in folders on your computer.
        plans: Paid plans; the merged "one Claude" experience is rolling out to Pro and Max first.
        acts: It plans the task, divides complex work among helpers working in parallel, uses connectors and Claude in Chrome where you allow it, and asks before acting by default.
        modes:
          - name: Ask before acting
            what: The default; further modes appear only when they are enabled for your account.
        instructions: Projects hold instructions, folders and context so each session starts with the right setup; it does not read Claude Code's own settings folder.
        skills: The skills enabled in your Claude account.
        hooks: ''
        subagents: Complex work is divided into parallel workstreams.
        connectors: The connectors and plugins enabled in your Claude account.
        sandbox: Work runs inside a virtual machine on your computer, or on Anthropic's machines for cloud sessions.
        source: https://claude.com/docs/cowork/overview
    command_groups:
      - id: start
        title: Getting Started
      - id: control
        title: Staying in Control
      - id: check
        title: Checking the Work
      - id: context
        title: Managing Context
      - id: model
        title: Model, Effort, and Usage
      - id: extend
        title: Folders, Skills, and Connections
      - id: long
        title: Long Jobs and Troubleshooting
    commands:
      - harness: claude-code
        group: start
        command: /help
        what: Shows help and the commands available to you.
        example:
          situation: A first-year student opens Claude Code in a folder of anatomy lecture notes and is not sure what to type.
          typed: /help
          shown:
            - '[A help view lists the commands available on this computer and plan]'
          note: Typing / on its own opens the same list, and letters typed after it filter it.
          why: The quickest way to see what this installation offers, since commands vary by platform and plan.
        source: https://code.claude.com/docs/en/commands
      - harness: claude-code
        group: start
        command: /init
        what: Drafts a CLAUDE.md brief for the folder, or suggests improvements to an existing one.
        example:
          situation: A course director keeps a pharmacology module folder (syllabus, weekly slides, question bank) and wants Claude to know its layout every session.
          typed: /init
          shown:
            - '[Claude reads the folder and writes CLAUDE.md, describing its structure and conventions]'
          note: If a CLAUDE.md already exists, it suggests improvements rather than overwriting it.
          why: Turns explanations you would repeat into a brief Claude reads at the start of every session.
        source: https://code.claude.com/docs/en/memory
      - harness: claude-code
        group: start
        command: /memory
        what: Opens your CLAUDE.md files for editing and shows what Claude has remembered on its own.
        example:
          situation: Claude keeps writing exam items in British spelling, and the faculty member wants to see what it has remembered and add a standing preference.
          typed: /memory
          shown:
            - '[A picker of CLAUDE.md files to edit]'
            - '[An auto memory switch, and the entries Claude has saved]'
          why: You can see and correct what shapes every later session.
        source: https://code.claude.com/docs/en/commands
      - harness: claude-code
        group: control
        command: /plan
        what: Enters plan mode, so Claude researches and proposes before changing anything.
        example:
          situation: A clerkship coordinator wants 120 OSCE station files reorganized into weekly folders, but wants to see the plan first.
          typed: /plan reorganize the OSCE station files into one folder per week
          shown:
            - ⏸ plan mode on
            - '[Claude reads the files and presents its plan, then asks how to proceed]'
            - 'option: Yes, and use auto mode'
            - 'option: Yes, manually approve edits'
            - 'option: No, keep planning'
          note: Ctrl+G opens the plan in your text editor, so you can change it before approving.
          why: Nothing is touched until you approve, which suits unfamiliar folders and work that matters.
        source: https://code.claude.com/docs/en/permission-modes
      - harness: claude-code
        group: control
        command: /permissions
        what: Opens the rules for what Claude may do without asking, must ask about, or may never do.
        example:
          situation: A faculty member wants Claude never to open the folder of student grade exports kept beside the course files.
          typed: /permissions
          shown:
            - '[A dialog of allow, ask and deny rules, by scope]'
          note: A deny rule added here applies in every mode, including bypass.
          why: A hard limit that does not depend on the model's judgment.
        source: https://code.claude.com/docs/en/commands
      - harness: claude-code
        group: control
        command: /rewind
        what: Rolls files, the conversation, or both back to an earlier point (also Esc twice on an empty prompt).
        example:
          situation: Claude reformatted a reading list across several files in the wrong citation style.
          typed: /rewind
          shown:
            - '[A list of the prompts you sent this session; after you pick one]'
            - 'option: Restore code and conversation'
            - 'option: Restore conversation'
            - 'option: Restore code'
            - 'option: Summarize from here'
            - 'option: Summarize up to here'
            - 'option: Never mind'
          why: An undo for an agent's file edits, without needing version control.
        source: https://code.claude.com/docs/en/checkpointing
      - harness: claude-code
        group: check
        command: /diff
        what: Shows what changed in your files, including Claude's edits, turn by turn.
        example:
          situation: Before sharing an updated module handbook with colleagues, a faculty member checks exactly what Claude changed.
          typed: /diff
          shown:
            - '[A list of changed files with lines added and removed]'
          note: Enter opens a file's changes, and each turn's edits can be viewed separately.
          why: You review the output yourself before anyone else sees it.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        group: check
        command: /btw
        what: Asks a side question without adding it to the conversation.
        example:
          situation: Mid-task, a course director forgets which file held the 2026 learning objectives.
          typed: /btw which file had the 2026 learning objectives?
          shown:
            - '[The answer appears in a panel you dismiss; it never enters the conversation]'
          why: A quick check that does not interrupt the running task or clutter it.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        group: check
        command: /export
        what: Saves the whole conversation as a text file, or copies it.
        example:
          situation: A faculty member wants a record of how an exam blueprint was built, for the curriculum committee's file.
          typed: /export blueprint-session.txt
          shown:
            - '[The conversation is written to blueprint-session.txt]'
          why: Keeps a record of how AI-assisted work was done.
        source: https://code.claude.com/docs/en/commands
      - harness: claude-code
        group: context
        command: /context
        what: Shows what is filling Claude's working memory, as a colored grid with suggestions.
        example:
          situation: After Claude has read a dozen long journal articles, its answers start to drift.
          typed: /context
          shown:
            - '[A colored grid of how full the context window is, and with what]'
            - '[Suggestions for freeing space, and a warning when it is nearly full]'
          why: It tells you when to compact the conversation or start fresh.
        source: https://code.claude.com/docs/en/commands
      - harness: claude-code
        group: context
        command: /compact
        what: Summarizes the conversation so far to free space, optionally keeping what you name.
        example:
          situation: A long session building renal physiology questions is nearly full, but the agreed item-writing rules must survive.
          typed: /compact keep the item-writing rules and the list of approved stems
          shown:
            - Conversation compacted
            - '[Claude re-reads CLAUDE.md and the files it was working on]'
          why: A long session keeps going without losing the decisions that matter.
        source: https://code.claude.com/docs/en/context-window
      - harness: claude-code
        group: context
        command: /clear
        what: Starts a fresh conversation, keeping the folder's CLAUDE.md (also /new).
        example:
          situation: A student finishes a cardiology study guide and moves on to an unrelated microbiology task.
          typed: /clear cardio-study-guide
          shown:
            - '[A fresh conversation; the old one is saved under that name]'
          why: Unrelated work gets a clean start, and better answers.
        source: https://code.claude.com/docs/en/commands
      - harness: claude-code
        group: model
        command: /model
        what: Switches the model, with effort adjusted in the same picker.
        example:
          situation: A researcher wants a lower-cost model for a quick reformatting of a reference list.
          typed: /model
          shown:
            - '[A picker of models; the arrow keys adjust effort]'
          note: Enter makes the choice your default; pressing s switches for this session only.
          why: Match cost and capability to the task in front of you.
        source: https://code.claude.com/docs/en/commands
      - harness: claude-code
        group: model
        command: /effort
        what: Sets how hard the model reasons, from low to max, and turns ultracode on or off.
        example:
          situation: A teaching assistant is renaming 40 lecture PDFs to a fixed pattern, a job that needs no judgment.
          typed: /effort low
          shown:
            - '[Effort set to low, kept for later sessions]'
          why: Lower effort is faster and cheaper for mechanical work; Opus, Sonnet and Haiku 5.5 start at medium.
        source: https://code.claude.com/docs/en/model-config
      - harness: claude-code
        group: model
        command: /usage
        what: Shows how much of your plan's usage you have used, and your recent activity.
        example:
          situation: A student on a Pro plan wonders how much of the week's allowance a big literature task used.
          typed: /usage
          shown:
            - '[Bars for the current session and the week, with activity stats]'
          why: You see a limit coming before it interrupts important work.
        source: https://code.claude.com/docs/en/costs
      - harness: claude-code
        group: extend
        command: /add-dir
        what: Gives Claude access to one more folder for this session.
        example:
          situation: While writing new questions, Claude needs to check them against a shared question bank in another folder.
          typed: /add-dir ../shared-question-bank
          shown:
            - '[Folder suggestions appear as you type; Tab accepts one]'
          why: Access widens one folder at a time, on purpose, rather than to a whole drive.
        source: https://code.claude.com/docs/en/commands
      - harness: claude-code
        group: extend
        command: /skills
        what: Lists the skills installed, and how much of the context each one uses.
        example:
          situation: A faculty member wants to know which skills Claude Code already has before adding any.
          typed: /skills
          shown:
            - '[A filterable list of skills; t sorts them by size]'
          why: Check what is there, and what it costs in context, before adding more.
        source: https://code.claude.com/docs/en/commands
      - harness: claude-code
        group: extend
        command: /mcp
        what: Shows the outside tools Claude is connected to, and repairs their sign-ins.
        example:
          situation: A researcher's reference-manager connection has stopped responding.
          typed: /mcp
          shown:
            - '[A list of connected servers and their status]'
          note: /mcp reconnect all retries every connection that failed, without opening the list.
          why: See, and fix, which outside tools Claude can reach.
        source: https://code.claude.com/docs/en/commands
      - harness: claude-code
        group: long
        command: /resume
        what: Returns to an earlier conversation with its full history.
        example:
          situation: Yesterday's session drafting a small-group case on sepsis needs to continue.
          typed: /resume
          shown:
            - '[A list of earlier sessions to pick from]'
          why: You pick up where you left off instead of explaining it all again.
        source: https://code.claude.com/docs/en/sessions
      - harness: claude-code
        group: long
        command: /goal
        what: Sets an end state; Claude keeps working turn after turn until a check says it is met.
        example:
          situation: Every lecture PDF in a module folder needs a one-page summary beside it.
          typed: /goal every PDF in this folder has a one-page summary file next to it
          shown:
            - '[Claude works through the files without new prompts]'
          note: After each turn, a model checks whether the goal is met; /goal clear stops it early.
          why: Suits long jobs with a checkable end, and you still review the result.
        source: https://code.claude.com/docs/en/goal
      - harness: claude-code
        group: long
        command: /doctor
        what: Runs a checkup of the installation and proposes fixes it applies after you confirm.
        example:
          situation: Claude Code behaves oddly after an update on a faculty laptop.
          typed: /doctor
          shown:
            - '[A checkup of installation, settings and CLAUDE.md problems]'
            - '[Proposed fixes, each applied only after you confirm]'
          why: The first step before asking IT for help.
        source: https://code.claude.com/docs/en/commands
    shortcuts:
      - harness: claude-code
        keys: Shift+Tab
        what: Cycle permission modes (Manual, Accept edits, Plan, and Auto or Bypass where available).
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        keys: Esc
        what: Stop Claude mid-turn; its work so far is kept.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        keys: Esc Esc
        what: On an empty prompt, open the rewind menu.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        keys: Ctrl+G
        what: Open your prompt, or a proposed plan, in your text editor.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        keys: Ctrl+R
        what: Search your earlier prompts.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        keys: Ctrl+O
        what: Show the detailed transcript of what Claude did.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        keys: Ctrl+B
        what: Send a long-running command or helper to the background.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        keys: Ctrl+T
        what: Show or hide Claude's to-do list.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        keys: Shift+Enter
        what: Start a new line without sending.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        keys: '?'
        what: On an empty prompt, show the shortcut help.
        source: https://code.claude.com/docs/en/interactive-mode
    symbols:
      - harness: claude-code
        syntax: '@'
        what: Mentions a file so it is added to the conversation, with path completion.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        syntax: '!'
        what: At the start of a message, runs a shell command yourself and shows Claude the output.
        source: https://code.claude.com/docs/en/interactive-mode
      - harness: claude-code
        syntax: ultrathink
        what: In a prompt, asks for deeper reasoning on that one turn.
        source: https://code.claude.com/docs/en/model-config
      - harness: claude-code
        syntax: ultracode
        what: In a prompt, runs that task as a planned multi-agent workflow; /effort ultracode turns it on for the session.
        source: https://code.claude.com/docs/en/model-config
