# Decoration for the section navigator (scripts/layout_nav.py): the floating
# "Browse <section>" and "On this page" controls on every inner page, the
# section map at each page's foot, the Tools & Prompts landing, and the
# colored link rows on the landing pages.
#
# WHICH pages appear, their order, their titles and their grouping all come
# from the nav in mkdocs.yml, never from here: a subsection is a group, and a
# run of pages that sit directly in a tab is a group named by `loose:` below
# (in order; the tab's own title when there are more runs than names). A
# subsection holding one page is folded into such a run, unless it is named
# under `groups:` here (Tools & Prompts' "Find a tool" is a group of one).
# This file only gives a tab, a group or a page its icon (a Material Design
# icon name, checked at build time), a short line of text, and a kind.
#
# `{tools}` and `{prompts}` in a line are counted from data/tools.yaml and
# data/prompts.yaml at build time, so a number here never goes stale.
# Plain language, no em dashes, and no unexpanded acronyms: these lines
# appear on every page of their section.

# --- Kinds: color by meaning (owner decision, 2026-09-26) ----------------------
# Each color means one kind of page everywhere on the site, never a position
# or a section. `token` names a hue in the palette block at the top of
# docs/stylesheets/layout-nav.css (--hue-<token>, -tint and -line, in both
# schemes); the build fails on a token the palette does not define. A page's
# kind is derived: a tab's `kind:` covers every page in the tab, a group's
# covers the group, and a page's own `kind:` below is only for a page that
# differs. A page outside the nav (a prompt page, a weekly digest) takes the
# kind of the nav page it belongs to. A link is colored by the kind of the
# page it opens; a page with no kind (the hubs, About) stays uncolored.
# `label` is the word in the color key shown wherever the colors appear.
# Rose is defined in the palette and held in reserve.
kinds:
  tool:
    label: Tool
    token: blue
    description: The Tool Directory and its task views
  prompt:
    label: Prompt
    token: teal
    description: The Prompt Library, each prompt's page, Learning to Prompt and the Prompt Exchange
  guide:
    label: Guide
    token: amber
    description: Step-by-step guides, tool guides, agent guides and worked examples
  lesson:
    label: Lesson
    token: green
    description: The seven modules, the quick reference pages, and Courses and Resources
  benchmark:
    label: Benchmark
    token: violet
    description: The three leaderboard pages
  news:
    label: News and events
    token: coral
    description: News, the archive, conferences, opportunities and announcements
  governance:
    label: Governance
    token: navy
    description: The policy, the AI Committee, its work, and how tools are reviewed

tabs:
  "For Students":
    icon: account-school
    loose: ["Guides for students"]
  "For Faculty & Staff":
    icon: human-male-board
  "Learn":
    icon: school-outline
    kind: lesson
    loose: ["The seven modules", "When you finish"]
  "Tools & Prompts":
    icon: toolbox
  "News & Events":
    icon: newspaper-variant
    kind: news
    loose: ["Announcements"]
  "Governance":
    icon: scale-balance
    kind: governance
    loose: ["Policy and committee"]
  "About & Contact":
    icon: information-outline
    loose: ["This site"]

# Groups. `blurb` is the group's one line on the Tools & Prompts landing;
# `tag` is a short qualifier shown beside the group's name wherever the
# group is drawn; `module` links the group to a lesson in Learn (the lesson's
# page foot links back to the group); `steps` numbers that many guides after
# the group's first page, which is its overview. `noun` names what the
# group's badge counts ("5 guides"; "pages" when left out), so a count is
# always literal. `anchor` is the id of the group's place on its tab's
# landing page, where the breadcrumb of a group with no overview page of its
# own leads (the Tools & Prompts groups get one from their titles; the build
# checks every anchor exists).
groups:
  "Guides for students": {icon: account-school, kind: guide, noun: guides}
  "Step-by-Step Guides": {icon: format-list-numbered, kind: guide}
  "The seven modules": {icon: map-marker-path, route: true, noun: modules}
  "Quick Reference": {icon: book-open-variant, anchor: the-reference-shelf}
  "When you finish": {icon: flag-checkered}
  "Find a tool":
    icon: magnify
    kind: tool
    blurb: Search the directory by task, and see where AUA stands with each tool.
  "Use a prompt":
    icon: text-box-multiple-outline
    kind: prompt
    blurb: Copy a ready-made prompt, learn the craft, or see what colleagues share.
  "Work with sources":
    icon: file-document-multiple-outline
    kind: guide
    noun: guides
    blurb: Ask questions of your own documents and of the published literature.
  "Work with agents":
    icon: robot-outline
    kind: guide
    noun: guides
    tag: Optional, after the basics
    blurb: Hand a whole task to an assistant that plans, acts, and reports back.
    module: pathway/working-with-agents.md
    steps: 2
  "Run models locally":
    icon: laptop
    kind: guide
    noun: guides
    blurb: Run a model on your own computer, so what you type stays on it.
  "Compare models":
    icon: podium
    kind: benchmark
    noun: leaderboards
    blurb: Independent leaderboards, read with their limits in mind.
  "News": {icon: newspaper-variant-outline, anchor: more-news-and-events}
  "Events": {icon: calendar-star, anchor: coming-up}
  "Announcements": {icon: bullhorn-outline}
  "Policy and committee": {icon: scale-balance}
  "This site": {icon: information-outline}
  "Project Write-ups": {icon: notebook-edit-outline}

