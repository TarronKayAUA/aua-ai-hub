# Decoration for the section navigator (scripts/layout_nav.py): the floating
# map on every inner page, the map at each page's foot, and the Tools &
# Prompts landing page, which is the same map drawn full page.
#
# WHICH pages appear, their order, their titles and their grouping all come
# from the nav in mkdocs.yml, never from here: a subsection is a group, and a
# run of pages that sit directly in a tab is a group named by `loose:` below
# (in order; the tab's own title when there are more runs than names). This
# file only gives a tab, a group or a page its icon (a Material Design icon
# name, checked at build time) and a short line of text.
#
# `{tools}` and `{prompts}` in a line are counted from data/tools.yaml and
# data/prompts.yaml at build time, so a number here never goes stale.
# Plain language, no em dashes, and no unexpanded acronyms: these lines
# appear on every page of their section.

tabs:
  "For Students":
    icon: account-school
    loose: ["Guides for students"]
  "For Faculty & Staff":
    icon: human-male-board
  "Learn":
    icon: school-outline
    loose: ["The seven modules", "When you finish"]
  "Tools & Prompts":
    icon: toolbox
    loose: ["Find a tool"]
  "News & Events":
    icon: newspaper-variant
    loose: ["Announcements"]
  "Governance":
    icon: scale-balance
    loose: ["Policy and committee"]
  "About & Contact":
    icon: information-outline
    loose: ["This site"]

groups:
  "Guides for students": {icon: account-school}
  "Step-by-Step Guides": {icon: format-list-numbered}
  "The seven modules": {icon: map-marker-path, route: true}
  "Quick Reference": {icon: book-open-variant}
  "When you finish": {icon: flag-checkered}
  "Find a tool":
    icon: magnify
    blurb: Search the directory by task, or go deep on two tools that come up often.
  "Prompt Library":
    icon: text-box-multiple-outline
    blurb: Copy a ready-made prompt, learn the craft, or see what colleagues share.
  "Local and Open Models":
    icon: laptop
    blurb: Run a model on your own computer, so what you type never leaves it.
  "Agents and Setups (Advanced)":
    icon: robot-outline
    blurb: Assistants that act for you. Read the four in order the first time.
  "Benchmarks":
    icon: podium
    blurb: How models compare, from independent leaderboards refreshed nightly.
  "News": {icon: newspaper-variant-outline}
  "Events": {icon: calendar-star}
  "Announcements": {icon: bullhorn-outline}
  "Policy and committee": {icon: scale-balance}
  "This site": {icon: information-outline}
  "Project Write-ups": {icon: notebook-edit-outline}

