# Gemini (Google). Field guide: _fields.yaml in this folder.
id: google
page: tools/company/google.md
name: Gemini
company: Google
checked: 2026-10-09
pricing_url: https://gemini.google/subscriptions/
plans:
  - name: Free
    for: Anyone with a personal Google Account
    adds: The Gemini app with 3.6 Flash and varying access to 3.1 Pro; image generation and editing, Deep Research, Gemini Live, Canvas and Gems; Gemini Notebook; 15 GB of storage. No Gemini in Gmail or Docs.
    source: https://gemini.google/subscriptions/
  - name: Google AI Plus
    for: Individuals who want more than Free
    adds: Twice the Free usage limits, video generation, Gemini in Gmail, Vids and more, more Gemini Notebook Audio Overviews and notebooks, and 400 GB of storage.
    source: https://gemini.google/subscriptions/
  - name: Google AI Plus student offer
    for: Eligible college students aged 18 or over
    adds: Google AI Plus for one year at no cost, with eligibility checked each year. Redeem by December 31, 2026; a payment method is required, and it renews as a paid plan unless canceled.
    source: https://gemini.google/students/
  - name: Google AI Pro
    for: Individuals aged 18 or over who use Gemini heavily for work or study
    adds: Four times the Free usage limits, more access to 3.1 Pro, a 1-million-token context window (how much it can read at once), Gemini in Gmail, Docs, Vids and more, entry-level limits in Google Antigravity, and 5 TB of storage.
    source: https://gemini.google/subscriptions/
  - name: Google AI Ultra
    for: The heaviest individual users
    adds: Five or twenty times Pro's limits (two price tiers), first access to Deep Think and Gemini Spark, higher limits in Google Antigravity (the highest on the larger tier), the highest Gemini Notebook limits, Project Genie, and 20 TB or more of storage.
    source: https://gemini.google/subscriptions/
  - name: Google Workspace business and enterprise editions
    for: Organizations on Google Workspace (work accounts need users aged 18 or over)
    adds: From Business Starter up, the Gemini app with enterprise-grade protections, so chats are not reviewed by people or used to train models. Business and Enterprise Standard and Plus add Pro access (up to 25 Pro prompts per 4 hours, 1-million-token context); the AI Expanded Access and AI Ultra Access add-ons raise this to 200 and 500 Pro prompts a day.
    source: https://support.google.com/gemini/answer/14620100?hl=en
  - name: Gemini for Education
    for: Schools and universities, including those whose main office suite is not Google's
    adds: The Gemini app and Gemini Notebook, included free of charge in every Google Workspace for Education edition; a separate experience with extra safeguards for students under 18; data not reviewed by people or used to train models.
    source: https://edu.google.com/ai/gemini-for-education/
  - name: Google AI Pro for Education
    for: Institutions that buy the add-on, for users aged 18 or over
    adds: Priority access in the Gemini app, a 1-million-token context window (32,000 without it), 20 Deep Research reports a day (5 a month without it), up to 3 videos a day, and scheduled actions.
    source: https://support.google.com/gemini/answer/14620100?hl=en&co=DASHER._Family%3DEducation
models:
  - name: Gemini 3.1 Pro
    released: 2026-02-19
    best_for: Complex reasoning, math and coding; the Pro model in the Gemini app
    where: Every plan, with varying access on Free and more on paid plans; choose Pro in the model menu
    source: https://gemini.google/release-notes/
  - name: Gemini 3.8 Flash
    released: 2026-09-02
    best_for: Coding, agent tasks and multi-step reasoning; Google's newest Flash model
    where: The Gemini app on Google AI Pro and Ultra, Gemini in Google Sheets, Google Antigravity on every plan (one of several models you can choose there), and the Gemini API (Google's application programming interface for developers)
    source: https://blog.google/innovation-and-ai/models-and-research/gemini-models/3-8-flash-and-3-8-flash-cyber/
  - name: Gemini 3.6 Flash
    released: 2026-07-21
    best_for: Everyday tasks, such as analyzing several documents or building a working prototype in Canvas
    where: Every plan, including Free; choose 3.6 Flash in the model menu
    source: https://gemini.google/release-notes/
  - name: Gemini 3 Deep Think
    released: 2026-02-12
    best_for: Hard problems in science, research and engineering; answers usually take a few minutes
    where: Google AI Ultra only; choose Deep Think in the prompt bar
    source: https://gemini.google/release-notes/
  - name: Gemini 3.8 Live and 3.8 Live Extended Thinking
    released: 2026-09-15
    best_for: Spoken conversation, with tools and tasks carried on in the background while you talk; Extended Thinking reasons more deeply as it speaks
    where: Extended Thinking in Gemini Live in the Gemini app, in Gmail and Keep for Google AI subscribers, and in Docs on Pro and Ultra; 3.8 Live in Search Live; both in the Gemini API
    source: https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-3-8-live-gemini-3-8-live-extended-thinking/
  - name: Gemini Omni
    released: 2026-05-19
    best_for: Making and editing videos with sound from text, photos and video, in conversation
    where: Every Google AI plan, for users aged 18 or over
    source: https://gemini.google/release-notes/
surfaces:
  - name: Gemini web app
    what: The main app at gemini.google.com, in more than 70 languages and over 230 countries and territories, Antigua and Barbuda among them.
    source: https://support.google.com/gemini/answer/13575153?hl=en
  - name: Gemini phone apps
    what: Android and iOS apps, where Gemini Live (talking with Gemini, or showing it your camera) now sits inside the ordinary chat.
    source: https://gemini.google/release-notes/
  - name: Gemini desktop apps
    what: Windows 10 or later (Alt+Space opens Gemini over any app) and Apple silicon Macs with macOS 15 (Option+Space). Screen sharing, dictation and Gemini Spark with local files are on the Mac first.
    source: https://gemini.google/desktop/
  - name: Gemini Notebook
    what: Formerly NotebookLM. A research assistant that answers from the sources you add, with inline citations, and turns them into study guides, Audio Overviews, mind maps and more. On Workspace for Education accounts it is open to all ages.
    source: https://support.google.com/gemininotebook/answer/16164461?hl=en
  - name: Google Antigravity
    what: Google's agent platform. The Antigravity 2.0 desktop app, the Antigravity IDE (integrated development environment, a code editor), the Antigravity CLI and a Python software development kit all run one shared agent; see The Agents below.
    source: https://antigravity.google/docs/home
features:
  - name: Skills
    what: Saved instructions for a kind of task, written by you, drafted by Gemini from a chat, or uploaded as a SKILL.md file. Type / and the skill's name in any chat, or let Gemini apply a relevant one itself; several can be combined. They are replacing Gems.
    plans: Personal accounts, 18 or over, with Keep Activity on; web, phone and Mac apps only. Not yet in the Windows app or on work or school accounts.
    status: Rolling out since September 30, 2026
    source: https://support.google.com/gemini/answer/17094296?hl=en
  - name: Gems (being retired)
    what: Custom versions of Gemini with their own instructions and files. Google will turn existing Gems into skills automatically; Opal and Gems by Google Labs end at the same time.
    plans: Every plan for now. Removed from personal accounts in November 2026, Workspace business, enterprise and nonprofit accounts in March 2027, and Workspace education accounts in June 2027.
    status: Being retired
    source: https://support.google.com/gemini/answer/18560919?hl=en
  - name: Deep Research
    what: Gemini drafts a research plan you can edit, searches the web (and your Gmail and Drive if you add them), and writes a multi-page report, usually in 5 to 10 minutes.
    plans: Every plan, for users 18 or over; higher limits and the Pro model on Pro and Ultra; charts and interactive simulators in Ultra reports
    status: Available
    source: https://support.google.com/gemini/answer/15719111?hl=en
  - name: Canvas
    what: Draft and refine writing, or describe an idea and get working code, such as an app, game or quiz; a Deep Research report opened in Canvas can become a web page, infographic, quiz or Audio Overview.
    plans: Every plan; Pro and Ultra get a larger, 1-million-token context window
    status: Available
    source: https://gemini.google/overview/canvas/
  - name: Notebooks in Gemini
    what: Project spaces that remember their sources, instructions and chats, kept in sync with Gemini Notebook.
    plans: Every plan (up to 600 sources, depending on plan); web, phone and Mac apps; several functions need Keep Activity on
    status: Rolling out gradually
    source: https://support.google.com/gemini/answer/16972047?hl=en
  - name: Gemini in Gmail and Docs (personal accounts)
    what: Gemini inside Gmail, Docs and other Google apps, to draft, summarize and organize where you work.
    plans: Not on Free; Gmail, Vids and more on AI Plus; Gmail, Docs, Vids and more on AI Pro and Ultra. Personal plans need users aged 18 or over.
    status: Available in select languages
    source: https://gemini.google/subscriptions/
  - name: Gemini in Gmail and Docs (Workspace accounts)
    what: The Gemini assistant in Workspace apps, set by edition.
    plans: Gemini in Gmail and Vids on Business Starter; Gmail, Docs, Sheets, Meet and more from Business Standard up
    status: Available
    source: https://workspace.google.com/pricing
  - name: Image generation (Nano Banana)
    what: Create and edit images from a prompt or an upload. Images carry a SynthID digital watermark and a visible one, and you can upload an image to ask whether Google AI made it.
    plans: Nano Banana 2 on Free; Nano Banana 2.1 with any Google AI plan, which can also redo an image with Nano Banana Pro
    status: Available
    source: https://gemini.google/overview/image-generation/
  - name: Video generation (Gemini Omni)
    what: Make and edit videos from text, photos or video, refining them over several turns; Gemini can also generate audio for a video when you ask.
    plans: Any Google AI plan, or a qualifying Workspace license; 18 or over
    status: Available since May 19, 2026
    source: https://support.google.com/gemini/answer/16126339?hl=en
  - name: Model and thinking menu
    what: Choose Flash-Lite, Flash or Pro, and a thinking level (Standard, Extended, or Deep Think on Ultra). Limits are based on how much computing you use, refresh every 5 hours, and stop at a weekly limit.
    plans: Every plan; limits are 2 times Free on AI Plus, 4 times on AI Pro, and 5 or 20 times Pro on AI Ultra
    status: Available
    source: https://support.google.com/gemini/answer/16275805?hl=en
  - name: Gemini Live
    what: Talk with Gemini, or show it your camera, inside the same chat; while you talk it can show maps and cards and use your connected apps.
    plans: Android and iOS phone apps
    status: Part of chat since May 19, 2026
    source: https://gemini.google/release-notes/
  - name: Connected Apps
    what: With your permission, Gemini draws on and acts in other apps, such as summarizing email in Gmail or adding events to Calendar.
    plans: Personal accounts (work and school accounts differ)
    status: Available
    source: https://support.google.com/gemini/answer/13695044?hl=en
harnesses:
  - id: antigravity-cli
    name: Antigravity CLI
    what: Google's agent for the terminal, started by typing agy, and since June 2026 the replacement for Gemini CLI for individual users. It reads the folder you start it in, edits files and runs commands, asking first according to your mode and permission rules. It shares one agent, and synced settings, with the Antigravity 2.0 app, which Google describes as being for knowledge work as well as coding.
    runs: Windows, macOS, Linux and Googlebook (installed on Windows with one PowerShell command). A conversation can move to the Antigravity 2.0 app, and the reverse.
    plans: Every plan, including Free. Without Google AI Pro or Ultra the quota refreshes weekly; Pro refreshes every five hours up to a weekly limit; Ultra is highest. /boost and /teamwork-preview need a paid plan. For personal Google Accounts, aged 18 or over, in listed countries (Antigua and Barbuda is one); organizations use it through Gemini Enterprise.
    acts: It works in a loop of reading, searching, editing, running commands and browsing, and produces artifacts to review, such as an Implementation Plan and a walkthrough of what it did. In the default mode every file change is shown as a diff to accept or reject first.
    modes:
      - name: default
        what: Shows each file change as a diff and waits for y (accept), n (reject) or f (full-screen diff) before saving it. The starting mode.
      - name: accept-edits
        what: Saves file edits and new files without asking; helpers it starts inherit this. Commands still follow your permission rules.
      - name: plan
        what: Investigates with read-only tools and presents a plan for your approval before writing anything.
      - name: always-proceed (setting)
        what: A settings preset that never prompts, listed beside request-review (the default), proceed-in-sandbox and strict (asks before anything that is not a read).
    instructions: Rules files are read automatically. An AGENTS.md or GEMINI.md file (or a .agents/rules folder) in any folder applies when the agent works there, and ~/.gemini/GEMINI.md applies to every project. /learn turns your corrections into rules.
    skills: Folders containing a SKILL.md file (an open standard), kept in a project's .agents/skills folder or in your home folder. Each becomes a slash command of its own name; /skills lists them.
    hooks: Your own scripts that run just before or after the agent acts, set in a hooks.json file; /hooks lists them.
    subagents: The main agent hands side tasks (research, builds, a browser) to helpers that run in parallel; /agents shows them, and Alt+J jumps to one waiting for your approval.
    connectors: MCP (Model Context Protocol) servers, which connect outside tools and data, managed with /mcp, and plugins that bundle skills, rules, servers and hooks, managed with /plugin.
    sandbox: An optional terminal sandbox, off by default in the CLI's settings, uses the operating system's own isolation on Windows, macOS and Linux to keep commands to your project and temporary folders, block sensitive files, and limit network access to sites you have approved.
    source: https://antigravity.google/docs/cli/overview
  - id: antigravity-app
    name: Antigravity 2.0 and the Antigravity IDE
    what: The desktop app and the code editor built on the same agent as the CLI. Antigravity 2.0 is a stand-alone command center where you start agents inside projects (sets of folders you choose), watch them work, review their plans and changes, and schedule tasks, called Automations since October 7, 2026. The Antigravity IDE is a full code editor with the agent in a side panel and Tab completion.
    runs: Windows, macOS and Linux, plus a Remote Control web page for following and approving work from another device. Extensions also bring the agent into other code editors, such as Visual Studio Code and Visual Studio. The stand-alone IDE is not offered to enterprise customers, who can use Antigravity 2.0, the CLI or the extensions.
    plans: The same plans and quotas as the Antigravity CLI; settings, permissions and plugins sync between Antigravity 2.0 and the CLI.
    acts: Each conversation works in your folders directly or in a separate copy (a Git worktree). The agent drafts an Implementation Plan you can comment on and approve with Proceed, then a walkthrough of what it did, with screenshots for browser work.
    modes:
      - name: Default (macOS and Linux)
        what: Commands run without asking inside the sandbox, which has no network access; running outside it needs your approval. The agent reads and writes the project and temporary folders and asks for anything else.
      - name: Request Review (macOS and Linux)
        what: The sandbox is off and every terminal command needs your approval. The agent reads and writes the project and asks for anything else.
      - name: Turbo (macOS and Linux)
        what: Every command runs without asking, with no isolation, and the agent can read and write your whole computer.
      - name: Windows (earlier system)
        what: Request Review, Proceed in Sandbox or Always Proceed for terminal commands, plus a sandbox mode labeled Preview; by default the agent reaches only your project folders.
    instructions: The same rules files as the CLI, managed under Customizations, Rules. In the IDE, saved workflows run as /workflow-name stop working on October 19, 2026; Google suggests moving them to skills.
    skills: The same skill folders; type /skill-name to run one.
    hooks: Under Settings, Customizations, Hooks.
    subagents: Helpers shown in a subagent panel, including a browser helper that works in a separate Chrome profile.
    connectors: An MCP store under Settings, Customizations, and plugins from a Marketplace.
    sandbox: On macOS and Linux the Default preset runs commands in a sandbox; on Windows, file and network sandboxing arrived on September 19, 2026 and is switched on in Settings.
    source: https://antigravity.google/docs/agent-settings
  - id: spark
    name: Gemini Spark
    what: Google's personal agent inside the Gemini app. Describe a goal and when it should happen, and it works through the steps on its own, using your connected apps, skills, files and the web, once or on a schedule.
    runs: The Gemini web app, the phone apps and the Mac app (not the Windows app); on a Mac it can organize and summarize local files.
    plans: Google AI Pro or Ultra on a personal account, 18 or over, with Keep Activity on. Not on work or school accounts, and not in the European Economic Area, Nigeria, Switzerland or the United Kingdom.
    acts: It plans and carries out multi-step tasks, browsing either through your own Chrome, where it can reach the sites you are signed in to, or through a separate remote browser. A work panel shows its progress, the files it read or changed, and its schedules.
    modes:
      - name: Asks before browsing
        what: Chrome asks once to connect to Spark; after that, every task that browses the web asks for your confirmation first.
      - name: Hands control back
        what: At a sign-in page it asks you to confirm Sign in with Google or to take over and sign in yourself; you can take over its browser at any time.
      - name: Stop at any time
        what: Stop browsing or cancel a task whenever you like. A scheduled task can run while you are offline, so Google suggests not scheduling tasks you find sensitive.
    instructions: Your skills, chosen by typing / in a task, and the files or notebooks you attach.
    skills: The skills in your Gemini account.
    connectors: Connected Apps such as Gmail, Calendar and Drive, and custom connected apps.
    sandbox: Remote browsing and code run on Google's computers; Google's help page asks you not to type sign-in or payment details into a task thread.
    source: https://support.google.com/gemini/answer/17094507?hl=en
  - id: gemini-cli
    name: Gemini CLI
    what: Google's earlier open-source terminal agent, which also powers agent mode in Gemini Code Assist for VS Code. On June 18, 2026 both stopped serving free individual accounts and Google AI Pro and Ultra subscribers, who move to the Antigravity CLI.
    runs: The terminal, and agent mode in Gemini Code Assist for VS Code.
    plans: Organizations with a Gemini Code Assist Standard or Enterprise license, and anyone using a paid Gemini API key. Google stopped selling new Code Assist subscriptions on October 9, 2026; existing ones renew through 2026.
    acts: It reasons and acts in a loop with its built-in tools and connected MCP servers.
    modes:
      - name: default
        what: Asks before each file edit and shell command.
      - name: auto_edit
        what: Approves file edits automatically.
      - name: plan
        what: Read-only; researches and writes a plan for approval.
      - name: yolo
        what: Approves every action automatically.
    instructions: GEMINI.md files in the project and in your home folder, which the Antigravity CLI also reads.
    source: https://developers.googleblog.com/an-important-update-transitioning-gemini-cli-to-antigravity-cli/
  - id: jules
    name: Jules
    what: Google's coding agent for GitHub repositories. It works on its own in a cloud virtual machine (copying the code, installing what it needs and editing files) and returns its work through GitHub, so you can leave while it runs. Its documentation still labels it experimental, and the newest changelog entry is dated March 9, 2026.
    runs: The web at jules.google.com, signed in with a Google Account and connected to GitHub.
    plans: Free with a Google Account (15 tasks a day); 100 a day with Google AI Pro and 300 with Ultra, which for now apply only to personal Gmail accounts.
    acts: After setting up, it presents a plan you can read, question and approve before it writes any code; it can also fix failed automated checks on pull requests it opened.
    modes:
      - name: Plan review
        what: You read the plan, ask for changes in the chat, and click approve plan to let it start.
      - name: Timed auto-approval
        what: If you leave the page, Jules approves its own plan after a timer, so review promptly when approval matters.
    instructions: An AGENTS.md file at the root of the repository.
    connectors: MCP servers for a hand-picked list of services, added in Settings with an API key.
    sandbox: Each task runs in a cloud virtual machine, not on your computer.
    source: https://jules.google/docs/review-plan/
command_groups:
  - id: start
    title: Getting Started, Settings, and Help
  - id: control
    title: Staying in Control
  - id: check
    title: Checking the Work
  - id: context
    title: Managing Conversations
  - id: model
    title: Model, Usage, and Account
