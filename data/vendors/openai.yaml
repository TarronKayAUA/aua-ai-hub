commands:
  # Starting and Ending a Session
  - harness: codex
    group: start
    command: codex
    what: Starts Codex in the terminal, in the folder you are in; the first run asks you to sign in.
    example:
      situation: A faculty member has installed the Codex CLI and wants help tidying a copy of a folder of microbiology lecture notes.
      typed: codex
      shown:
        - '[The first time, a choice of sign-in methods that includes Sign in with ChatGPT]'
        - '[The Codex composer, ready for a first request such as: Tell me about this project]'
      note: OpenAI suggests a Git checkpoint before and after a task, so changes can be undone; working on a copy of the notes keeps the originals untouched.
      why: Codex works on the folder you start it in, so where you launch it decides what it can see.
    source: https://learn.chatgpt.com/docs/codex/cli
  - harness: codex
    group: start
    command: /init
    what: Drafts an AGENTS.md file, the standing instructions Codex reads before any work in that folder.
    example:
      situation: "A block director keeps a folder of cardiovascular study guides and wants every session to follow the same house rules: US English, objectives that start with a measurable verb, Word formatting left alone."
      typed: /init
      shown:
        - '[Codex writes an AGENTS.md scaffold in the current folder]'
      note: Review the draft and add your own rules; Codex reads the file at the start of each session.
      why: Rules written once in AGENTS.md save repeating them in every request.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: start
    command: /status
    what: Shows the session's model, approval policy, writable folders and context use (in the desktop app, the chat ID, context use and rate limits).
    example:
      situation: Before asking Codex to rename files in a copied anatomy lab folder, a faculty member checks which folders it can write to.
      typed: /status
      shown:
        - '[A summary of the active model, the approval policy, the folders Codex can write to, and current token usage]'
      note: Run it again after /model or /permissions to confirm the change took effect.
      why: It confirms Codex is working where you expect before anything changes.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: start
    command: /app
    what: Moves the current terminal session into the ChatGPT desktop app on Windows or macOS (CLI).
    example:
      situation: A course coordinator started reorganizing a reading list in the terminal and would rather review the results in the desktop app.
      typed: /app
      shown:
        - '[The desktop app opens the same saved chat, ready to continue]'
      note: If the app is not installed or running, Codex shows an error asking you to install or launch it; codex app, typed in the terminal, opens the app or its installer.
      why: You keep the same conversation while moving to the view that suits the task.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: start
    command: /logout
    what: Signs out of Codex and clears the saved sign-in on this computer (CLI).
    example:
      situation: A student used Codex on a shared computer in a library study room and is about to leave.
      typed: /logout
      shown:
        - '[Codex clears the local credentials for this user]'
      note: From the terminal, codex logout does the same.
      why: The next person at the computer cannot use your account or your plan's allowance.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: start
    command: /quit
    what: Leaves Codex (also /exit, or Ctrl+C; CLI).
    example:
      situation: A faculty member has finished drafting tutorial questions with Codex and wants to close the terminal.
      typed: /quit
      shown:
        - '[Codex exits immediately]'
      note: OpenAI's reference advises saving or committing important work first.
      why: The session is saved, so /resume can reopen it later.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  # Staying in Control
  - harness: codex
    group: control
    command: /permissions
    what: Sets what Codex may do without asking first, such as switching between Auto and Read Only (CLI; the desktop app and editors use the control below the composer).
    example:
      situation: A course director opens Codex in a folder of exam-item drafts and wants it to read and report, changing nothing yet.
      typed: /permissions
      shown:
        - '[A picker of approval presets, such as Auto and Read Only, plus any custom permission profiles]'
        - '[Codex announces the updated policy; later actions follow it until you change it]'
      note: In the desktop app and editors, the same choice is the permissions control below the composer, with Ask for approval, Approve for me and Full access.
      why: Read Only lets an agent survey a folder before you trust it with edits.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: control
    command: /plan
    what: Switches the chat into plan mode, so Codex proposes a plan before doing anything; you can add your first request on the same line.
    example:
      situation: A pathology course coordinator wants 40 renal case files sorted into weekly folders, but wants to see the plan first.
      typed: /plan Propose how to sort the renal case files into weekly folders without changing any file's contents
      shown:
        - '[Codex enters plan mode and treats the text as the first planning request]'
      note: /plan is unavailable while Codex is already working. In the desktop app, /plan turns plan mode on or off.
      why: You see and correct the plan before any file moves.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: control
    command: /approve
    what: Retries, once, an action that automatic review recently denied.
    example:
      situation: With automatic review on, a faculty member asked Codex to download a public dataset of vaccination schedules, and the reviewer blocked the download.
      typed: /approve
      shown:
        - '[Codex shows the denied action and asks you to confirm the retry]'
        - '[Codex retries that action once, under the current session policy]'
      note: Automatic review is the Approve for me mode (Auto-review in the CLI), in which a reviewer checks requests in your place within the same boundary.
      why: You stay the final judge when the automatic reviewer is overcautious.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: control
    command: /setup-default-sandbox
    what: On Windows, sets up the elevated sandbox when Codex is using the degraded one it falls back to (CLI).
    example:
      situation: On a faculty member's Windows laptop, Codex reports that it is using a degraded sandbox and offers the elevated setup.
      typed: /setup-default-sandbox
      shown:
        - '[An administrator setup flow for the elevated Windows sandbox]'
        - '[Codex configures it and selects the matching automatic approval preset]'
      note: The command appears only on Windows, when Codex is using the degraded restricted-token sandbox. OpenAI says the elevated sandbox needs administrator-approved setup, so on a university-managed laptop IT may need to approve it.
      why: The sandbox is what keeps Codex's commands inside the folder you chose.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: control
    command: /sandbox-add-read-dir
    what: On Windows, lets the sandbox read one more folder, given as its full path (CLI).
    example:
      situation: Codex, working in a pharmacology course folder on Windows, cannot read the department's shared formulary folder that the task needs.
      typed: '/sandbox-add-read-dir D:\Shared\Formulary'
      shown:
        - '[Codex refreshes the Windows sandbox policy and grants read access to that folder for later commands]'
      note: Give the full path of a folder that exists. This grants reading only. The command is available when Codex runs natively on Windows, not in WSL2.
      why: Access widens one folder at a time, on purpose, rather than to a whole drive.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: control
    command: /delete
    what: Permanently deletes the current session's transcript, and any sessions spawned from it, then exits (CLI).
    example:
      situation: A faculty member ran a one-off session on a borrowed skills-lab computer and does not want its transcript left there.
      typed: /delete
      shown:
        - '[Codex asks you to confirm deleting the current session and exiting]'
        - '[The transcript is deleted and Codex closes]'
      note: /archive hides a session and keeps its transcript instead. From the terminal, codex delete removes a saved session by name or ID.
      why: It removes a transcript from the computer for good, when archiving is not enough.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  # Checking the Work
  - harness: codex
    group: check
    command: /diff
    what: Shows the folder's uncommitted Git changes, including new files Git is not yet tracking (CLI).
    example:
      situation: A course coordinator keeps the module handbook in a Git-tracked folder, as OpenAI suggests, and checks exactly what Codex changed before sharing it.
      typed: /diff
      shown:
        - '[Staged changes, unstaged changes and new untracked files, which you scroll through in the terminal]'
      note: In the desktop app, the review pane (Ctrl+Shift+G on Windows) shows the folder's Git changes, opening on the unstaged ones.
      why: You review every change yourself before anyone else sees it.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: check
    command: /review
    what: Asks Codex to review changes in a Git folder and report problems without changing any file (in the desktop app and editors, uncommitted changes or a base branch).
    example:
      situation: A question-bank maintainer keeps items in a Git repository and has just had Codex revise 30 of them; they want a second look before committing.
      typed: /review
      shown:
        - '[A menu of review presets]'
        - 'option: Review against a base branch'
        - 'option: Review uncommitted changes'
        - 'option: Review a commit'
        - 'option: Custom review instructions'
        - '[Codex reads the selected changes and reports prioritized findings in the transcript, without changing the files]'
      note: Review uncommitted changes covers staged, unstaged and new files. Custom review instructions focuses the review on criteria you give, such as the department's item-writing rules; read each change with /diff as well.
      why: A separate review pass catches unintended edits before they are kept.
    source: https://learn.chatgpt.com/docs/code-review?surface=cli
  - harness: codex
    group: check
    command: /copy
    what: Copies Codex's latest finished response to the clipboard (CLI; Ctrl+O does the same).
    example:
      situation: Codex has summarized its changes to the year-two assessment folder, and the faculty member wants to paste the summary into an email to the curriculum committee.
      typed: /copy
      shown:
        - '[The latest completed Codex output is copied to the clipboard]'
      note: If a turn is still running, it copies the last completed output instead.
      why: No need to select long terminal output by hand.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  # Managing Context
  - harness: codex
    group: context
    command: /compact
    what: Summarizes the chat so far to free space in a long session.
    example:
      situation: After two hours restructuring a clinical skills handbook, a faculty member wants to keep going in the same chat.
      typed: /compact
      shown:
        - '[Codex offers to summarize the chat so far, and you confirm]'
        - '[Earlier turns are replaced with a concise summary that keeps the critical details]'
      why: A long session keeps going without starting over.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: context
    command: /new
    what: Starts a fresh chat in the same session and folder, optionally named.
    example:
      situation: Having finished editing anatomy quiz items, a student wants a clean start on pharmacology flashcards in the same folder.
      typed: /new pharmacology flashcards
      shown:
        - '[A fresh chat starts in the same session, named by the text you typed]'
      note: Unlike /clear, /new leaves the terminal view as it is.
      why: Unrelated tasks do not share context, which keeps answers focused.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: context
    command: /clear
    what: Clears the terminal and starts a fresh chat (CLI).
    example:
      situation: A teaching assistant's terminal is full of output from a long file-renaming job, and the next task is unrelated.
      typed: /clear
      shown:
        - '[The terminal clears, the visible transcript resets, and a fresh chat starts in the same session]'
      note: Ctrl+L only clears the view and keeps the current chat. Codex disables both while a task is in progress.
      why: A clean screen and a clean context for the next job.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: context
    command: /side
    what: Opens a temporary side chat for a quick question without disturbing the main chat (also /btw in the CLI).
    example:
      situation: While Codex rewrites a module's learning objectives, a faculty member wants a quick check on one of them.
      typed: '/side Does "understand the renin-angiotensin system" use a measurable verb?'
      shown:
        - '[A side chat opens, with a transcript separate from the main chat]'
        - '[The main chat''s status stays visible, so you can see whether it is still running]'
      why: Quick questions stay out of the main task's context.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: context
    command: /fork
    what: Copies the current chat into a new one (in the desktop app, optionally into a Git worktree), so you can try another approach and keep the original.
    example:
      situation: Codex has proposed a plan for a case library organized by organ system, and the instructor wants to explore a plan organized by presenting complaint without losing the first.
      typed: /fork
      shown:
        - '[Codex copies the chat into a new chat with a fresh ID, leaving the original transcript untouched]'
      note: To fork an earlier saved session instead, run codex fork in the terminal.
      why: Two approaches can be compared without losing either.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: context
    command: /memories
    what: Sets whether this chat can use Codex's saved memories, and whether it can add to them.
    example:
      situation: A faculty member has Codex memories turned on and is about to try an unusual layout for a single handout that should not shape later sessions.
      typed: /memories
      shown:
        - '[Choices for whether this chat can use existing memories, and whether it can feed future ones]'
      note: Codex memories are off until you turn them on (in the desktop app, Settings, Personalization). The choice applies to this chat and leaves your overall setting alone.
      why: You decide which work shapes later sessions; OpenAI advises keeping rules that must always apply in AGENTS.md.
    source: https://learn.chatgpt.com/docs/customization/memories
  # Finding and Organizing Chats
  - harness: codex
    group: chats
    command: /resume
    what: Reopens a saved chat from your session list (CLI).
    example:
      situation: Yesterday a faculty member started reorganizing an OSCE (objective structured clinical examination) station folder; today they want to continue.
      typed: /resume
      shown:
        - '[A picker of saved sessions]'
        - '[Codex reloads the chosen chat''s transcript, with its history intact]'
      note: From the terminal, codex resume --last reopens the most recent chat in the current folder.
      why: You pick up where you left off instead of explaining it all again.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: chats
    command: /rename
    what: Renames the current chat.
    example:
      situation: A course director has several Codex chats with similar names and wants this one easy to find next week.
      typed: /rename Year 2 renal block question review
      shown:
        - '[Codex updates the saved chat name without changing the transcript]'
      why: A clear name makes the chat easy to find later.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: chats
    command: /pin
    what: Pins or unpins the current chat, where available (desktop app).
    example:
      situation: In the desktop app, a clerkship coordinator returns to the same rotation-schedule chat every week.
      typed: /pin
      shown:
        - '[The chat is pinned, or unpinned if it already was]'
      note: Pinning changes only where the chat appears in the sidebar, not what Codex can reach. Ctrl+Alt+P does the same on Windows.
      why: A chat you use every week stays easy to reach.
    source: https://learn.chatgpt.com/docs/reference/slash-commands
  - harness: codex
    group: chats
    command: /project
    what: Chooses the project that new chats start in (desktop app and editors).
    example:
      situation: A faculty member keeps a separate project for each course and is about to start work on the neuroscience block.
      typed: /project
      shown:
        - '[A picker of projects; new chats start in the one you choose]'
      note: Ctrl+Alt+Shift+O opens the same project picker in the desktop app on Windows.
      why: Each new chat starts with the right course folder and its context.
    source: https://learn.chatgpt.com/docs/reference/slash-commands
  - harness: codex
    group: chats
    command: /chat
    what: Starts the next new chat without a project (desktop app).
    example:
      situation: In the middle of course work, a faculty member has a quick, unrelated question that should not sit inside the course project.
      typed: /chat
      shown:
        - '[The next new chat is set to start without a project]'
      note: OpenAI suggests this for self-contained work that needs no shared project files, instructions or folder access.
      why: Unrelated questions stay out of a course project's history.
    source: https://learn.chatgpt.com/docs/reference/slash-commands
  - harness: codex
    group: chats
    command: /archive
    what: Archives the current chat and keeps its transcript (in the CLI, it also exits).
    example:
      situation: At the end of the semester, a course director wants last term's Codex chats out of the session list without losing them.
      typed: /archive
      shown:
        - '[In the CLI, Codex asks you to confirm archiving the session and exiting]'
        - '[The session leaves the active list; its transcript stays on the computer]'
      note: To bring it back in the CLI, run codex unarchive with the session's name or ID (codex archive works from the terminal too); in the desktop app, restore it from Settings, Archived chats.
      why: The list stays short, and nothing is lost.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  # Model, Effort, and Usage
  - harness: codex
    group: model
    command: /model
    what: Chooses the model for the current chat (in the CLI, its reasoning effort too).
    example:
      situation: A student wants a quick, low-cost model to reformat a reference list for a pharmacology assignment.
      typed: /model
      shown:
        - '[A picker listing only the models available to your account, such as gpt-6-luna or gpt-6.1-sol]'
        - '[Codex confirms the new model in the transcript]'
      note: In the CLI, More reasoning… in the picker shows a model's Max or Ultra options. Run /status to confirm the change.
      why: Matching the model to the task saves allowance; OpenAI suggests Luna for clear, repeatable tasks.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: model
    command: /reasoning
    what: Chooses how hard the model reasons in the current chat (desktop app and editors).
    example:
      situation: In the desktop app, a curriculum lead asks Codex to reconcile two versions of the year-one curriculum map and wants more careful reasoning than usual.
      typed: /reasoning
      shown:
        - '[A choice of reasoning efforts for this chat, from Light to Extra High, with Max or Ultra where your model and settings allow]'
      note: Beneath the composer, the Power setting offers presets of model and effort; move toward Smarter or Faster, or open Advanced to choose a model, effort or speed. Ultra splits a task across helpers working in parallel; GPT-6 Luna goes up to Max, not Ultra.
      why: OpenAI advises starting at the default and raising effort only for work that needs more planning or checking.
    source: https://learn.chatgpt.com/docs/models
  - harness: codex
    group: model
    command: /fast
    what: Turns the current model's Fast speed on or off, when the model offers one.
    example:
      situation: A staff member needs Codex to reformat a long event schedule before a meeting starts and wants quicker replies.
      typed: /fast
      shown:
        - '[Codex turns the Fast tier on and saves the choice; /fast again turns it off]'
      note: Fast draws on your allowance faster than Standard speed (2.5 times, by OpenAI's pricing page). If the model has no Fast tier, /fast does not appear.
      why: Useful when waiting matters more than allowance.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: model
    command: /usage
    what: Shows your account's token use (daily, weekly or overall) or redeems an earned reset; in the desktop app, it opens usage and billing settings.
    example:
      situation: A student on Plus wants to know how much of this week's allowance is left before starting a big reorganization of study notes.
      typed: /usage weekly
      shown:
        - '[Your account''s token activity for the week]'
      note: Plain /usage opens a menu to show activity or redeem an available earned reset.
      why: Checking first avoids running out partway through a large task.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: model
    command: /personality
    what: "Chooses how Codex communicates: friendly, pragmatic or none (CLI and editors)."
    example:
      situation: A first-year student finds Codex's replies terse and would like more explanation while learning to use it.
      typed: /personality
      shown:
        - '[A picker of styles]'
        - 'option: friendly'
        - 'option: pragmatic'
        - 'option: none'
        - '[Codex confirms the new style and uses it for later replies in the chat]'
      note: If the current model does not support personalities, the command is hidden.
      why: It changes the tone without rewriting your instructions.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: model
    command: codex update
    what: Checks for a newer Codex CLI and installs it, when your installed release supports updating itself (typed in the terminal).
    example:
      situation: GPT-6 Astra is missing from a faculty member's model picker, and OpenAI's help says Astra needs Codex CLI 0.153.0 or newer.
      typed: codex update
      shown:
        - '[Codex checks for an update and applies it]'
      note: Running the installer you first used again (the PowerShell installer on Windows, or npm) also updates Codex.
      why: New models and fixes often need the latest release.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  # Files, Skills, and Connections
  - harness: codex
    group: extend
    command: /mention
    what: Attaches a file or folder to the chat so follow-up requests refer to it directly (CLI; typing @ does the same).
    example:
      situation: A course director wants Codex to check one syllabus against the block calendar.
      typed: /mention syllabus/MED201-syllabus.docx
      shown:
        - '[A popup of matching paths, from which you select the file]'
        - '[Codex adds the file to the chat, so follow-up turns refer to it directly]'
      why: Pointing at the exact file saves Codex guessing which document you mean.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: extend
    command: /import
    what: Brings a Claude Code or Cursor setup, project files and recent chats into Codex (CLI).
    example:
      situation: A faculty member has used Claude Code for a semester, with a file of course rules, and is trying Codex on the same folder.
      typed: /import
      shown:
        - '[An import picker]'
        - 'option: Claude Code'
        - 'option: Cursor'
        - '[You select the setup, project files or recent chats to bring over, and Codex imports them into its own configuration and files]'
      note: It looks back at up to 50 chats from the last 30 days, and is unavailable while a task is running.
      why: Rules you already wrote carry over instead of being rewritten.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: extend
    command: /skills
    what: Lists skills and applies one to your next request (CLI; in the desktop app, skills appear in the slash list and on the Skills page).
    example:
      situation: A department has written a skill that formats new exam items in its house style (a hypothetical skill, for illustration).
      typed: /skills
      shown:
        - '[A list of skills to choose from]'
        - '[Codex inserts the chosen skill''s context, so the next request follows its instructions]'
      note: Typing $ and the skill's name before a request does the same. OpenAI bundles a few skills, such as skill-creator for writing your own.
      why: A skill applies a repeatable process the same way every time.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: extend
    command: /apps
    what: Browses connected apps and inserts one into your request as a $ mention (CLI).
    example:
      situation: A course coordinator wants Codex to work from the current timetable in a connected Google Drive before updating a schedule.
      typed: /apps
      shown:
        - '[A list of apps]'
        - '[Codex inserts the chosen app into the composer as $ and its name, ready for your request]'
      why: Naming the app tells Codex exactly where to look.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: extend
    command: /plugins
    what: Browses installed and available plugins (CLI).
    example:
      situation: Before starting a course-materials task, a faculty member wants to see which plugins are installed and what each one can do.
      typed: /plugins
      shown:
        - '[The plugin browser, with installed plugins, plugins your configuration lets you discover, and each one''s state]'
      note: Press Space on an installed plugin to turn it on or off.
      why: You see what Codex can reach before relying on it.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: extend
    command: /mcp
    what: Lists the outside tools (MCP servers) Codex can call in this session; in the desktop app and editors, it opens MCP status.
    example:
      situation: An instructor's IT team has connected a documentation server, and the instructor wants to confirm Codex can use it.
      typed: /mcp
      shown:
        - '[The configured MCP servers and tools Codex can call in this session]'
      note: /mcp verbose adds detailed diagnostics for each server.
      why: Before relying on a connection, confirm it is there.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  # Long Jobs and Troubleshooting
  - harness: codex
    group: long
    command: /goal
    what: Sets a goal Codex keeps working toward across turns; you can view, edit, pause, resume or clear it.
    example:
      situation: A faculty member wants all twelve weekly study guides moved onto the new departmental template, with a list of any guide that has no learning objectives.
      typed: /goal Convert all 12 weekly study guides to the new template and list any guide with no learning objectives
      shown:
        - '[Codex keeps the goal attached to the chat while the work continues]'
      note: In the desktop app, goal progress appears above the composer, with buttons to pause, resume, edit or clear it. A goal can be up to 4,000 characters; for longer instructions, point it at a file.
      why: A goal keeps a long, many-file job on track across turns, and you still review the result.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: long
    command: /agent
    what: Switches between Codex's helper (subagent) threads so you can inspect or continue one (also /subagents; CLI).
    example:
      situation: A faculty member asked Codex to split a check of 200 practice questions across helpers, one per organ system, and wants to see how the cardiology helper is doing.
      typed: /agent
      shown:
        - '[A picker of agent threads]'
        - '[Codex switches to the chosen thread, showing that helper''s work]'
      note: Helpers use more of your allowance than a single agent, since each does its own work.
      why: You can check a helper's work before its summary reaches the main chat.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: long
    command: /ps
    what: Shows the commands Codex is running in the background, with their latest output (CLI).
    example:
      situation: Codex started a long conversion of lecture slides to PDF in the background, and the faculty member wants to know how far it has got.
      typed: /ps
      shown:
        - '[Each background terminal''s command, with up to three recent lines of its output]'
      note: The list may be empty, depending on how Codex runs commands on your computer.
      why: You can check progress without interrupting the main chat.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: long
    command: /stop
    what: Stops every background command started in this session (also /clean; CLI).
    example:
      situation: The slide conversion is no longer needed, because a colleague has already sent the PDFs.
      typed: /stop
      shown:
        - '[Codex may ask you to confirm, then stops all background terminals for this session]'
      why: It cancels unneeded work without ending the session.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: long
    command: /feedback
    what: Sends feedback, and optionally logs, to the Codex team at OpenAI (in the desktop app and editors, through a feedback dialog).
    example:
      situation: Codex keeps failing at the same step on a faculty member's laptop, and they want to report it.
      typed: /feedback
      shown:
        - '[Prompts to describe the problem and to choose whether to include logs or diagnostics]'
        - '[Codex collects what you chose and submits it]'
      why: The report reaches the team with the details they need to investigate.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: long
    command: codex doctor
    what: Writes a diagnostic report on the Codex installation, settings, sign-in and connections (typed in the terminal).
    example:
      situation: After a Windows update, Codex will not start properly on a faculty laptop.
      typed: codex doctor
      shown:
        - '[A local report checking installation, configuration, sign-in, runtime, Git, the terminal and other parts]'
      note: OpenAI's help suggests it on Windows for startup, connection and performance problems.
      why: The first step before asking IT for help or filing a support request.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
