# ChatGPT (OpenAI). Field guide: _fields.yaml in this folder.
id: openai
page: tools/company/openai.md
name: ChatGPT
company: OpenAI
checked: 2026-10-09
pricing_url: https://chatgpt.com/pricing
plans:
  - name: Free
    for: Anyone trying ChatGPT
    adds: Unlimited everyday text chats with GPT-6 (within abuse safeguards); limited uploads, images, voice, deep research and memory; projects, search, study mode and plugins; limited Codex, and limited ChatGPT Work in the desktop app only.
    source: https://chatgpt.com/pricing
  - name: Go
    for: Individuals who want longer conversations at low cost
    adds: More messages with tools, uploads, images and voice than Free; longer memory; voice with video; scheduled tasks; creating and sharing plugins. ChatGPT Work and Codex stay limited and in the desktop app. The plan may include ads.
    source: https://chatgpt.com/pricing
  - name: Plus
    for: Individuals doing advanced work
    adds: GPT-6 with Medium and High thinking; GPT-6 Astra (limited), GPT-6.1 Sol and GPT-6 Sol in Work and Codex; expanded deep research, memory and context; projects, scheduled tasks and custom GPTs; ChatGPT Work on desktop, web and phone; Codex in the terminal, code editors and Codex Cloud; Sites.
    source: https://chatgpt.com/pricing
  - name: Pro
    for: Heavy individual use, in three tiers (Pro 100, Pro 200 and Pro 500)
    adds: Everything in Plus, with Extra High thinking and Pro reasoning powered by GPT-6 Astra; longer Codex and Work sessions; dots, OpenAI's always-on agents; maximum deep research, memory and context; Ultrafast speed on Pro 500 only.
    source: https://help.openai.com/en/articles/9793128
  - name: Business
    for: Teams and organizations, from 2 seats
    adds: ChatGPT, ChatGPT Work and Codex on every seat; Standard or Premium seats, with Premium giving five times Standard's usage and no five-hour limit; projects, apps, company knowledge and deep research; admin controls and central billing; no training on the workspace's data.
    source: https://help.openai.com/en/articles/8792828-what-is-chatgpt-business
  - name: Enterprise
    for: Large organizations (through OpenAI's sales team)
    adds: Everything in Business, plus encryption, retention and compliance controls, audit visibility through a Compliance API (application programming interface), and administrator control over who can use agents, connected tools and actions. Business data is not used for training by default.
    source: https://chatgpt.com/business/enterprise/
  - name: Edu
    for: Universities, for students, faculty, researchers and campus operations
    adds: Expanded access to GPT-6 with much higher message limits than Free; data analysis, web browsing and file tools; custom GPTs shared within the university; no data or conversations used for training; single sign-on, custom retention windows and an admin console.
    source: https://chatgpt.com/business/education/
models:
  - name: GPT-6 (in Chat)
    released: 2026-10-07
    best_for: Everyday questions in the Chat tab, with Intelligent UI and a choice of how hard it thinks
    where: Every plan. Powered by GPT-6 Sol on Plus, Pro, Business and Enterprise, and by GPT-6 Luna on Free and Go (rolling out from October 8); Enterprise depends on admin settings
    source: https://openai.com/index/gpt-6-for-everyone/
  - name: GPT-6 Astra
    released: 2026-09-03
    best_for: OpenAI's most capable model, for the hardest end-to-end work across documents, apps, research and code
    where: In Chat as the Pro option (GPT-6 Pro) on Pro 100, Pro 200, Business and Enterprise; in Work and Codex on Plus (limited), Pro, Business and Enterprise; it also powers dots
    source: https://help.openai.com/en/articles/20001354
  - name: GPT-6.1 Sol
    released: 2026-09-29
    best_for: Results close to Astra's at a lower cost, for repeated, long-running work across documents, apps and code
    where: Work and Codex only, not Chat. Plus, Pro, Business, Enterprise and Edu (Enterprise and Edu once an administrator turns it on); not Free or Go
    source: https://openai.com/index/introducing-gpt-6-1-sol/
  - name: GPT-6 Sol
    released: 2026-09-22
    best_for: The middle GPT-6 tier in Work and Codex, and the replacement OpenAI names for GPT-5.5, which retires from ChatGPT, Work and Codex on October 14, 2026
    where: Work and Codex on Plus, Pro, Business, Enterprise and Edu; it also powers GPT-6 in Chat on Plus, Pro, Business and Enterprise
    source: https://learn.chatgpt.com/docs/models
  - name: GPT-6 Luna
    released: 2026-09-22
    best_for: OpenAI's most efficient model, for focused, high-volume tasks such as summarizing and extracting
    where: Work and Codex on paid plans; Free and Go in the desktop app, as it rolls out; it also powers GPT-6 in Chat on Free and Go
    source: https://openai.com/index/introducing-gpt-6-sol-and-luna/
  - name: GPT-5.6 Terra
    released: 2026-07-09
    best_for: A balanced model for everyday work, in OpenAI's words, alongside the flagship GPT-5.6 Sol and the most cost-efficient GPT-5.6 Luna
    where: Work and Codex on paid plans; on Free and Go, the model for limited Work and Codex use in the desktop app
    source: https://openai.com/index/gpt-5-6/
surfaces:
  - name: ChatGPT on the web
    what: The main app at chatgpt.com, with Chat for questions and Work for longer tasks, plus projects, memory, deep research, images and voice. Work on the web runs in the cloud.
    source: https://help.openai.com/en/articles/20001275
  - name: ChatGPT desktop app
    what: One app for Windows and macOS (Linux in public preview) that brings Chat, Work and Codex together; Work and Codex can use local folders, desktop apps and a built-in browser with your permission. The previous app may remain as ChatGPT Classic, which does not get Work, Codex or Intelligent UI.
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - name: Phone apps
    what: ChatGPT for iOS and Android, with Chat, Work (Plus and higher), voice, Codex Cloud tasks, and a Remote tab for reaching Codex chats running on your desktop.
    source: https://help.openai.com/en/articles/20001275
  - name: Codex in the terminal
    what: The Codex command-line interface (CLI), for Windows, macOS and Linux. It works on the folder you start it in.
    source: https://learn.chatgpt.com/docs/codex/cli
  - name: Codex in code editors
    what: An extension for VS Code, Cursor and Windsurf; Xcode and JetBrains editors have their own Codex integrations.
    source: https://learn.chatgpt.com/docs/codex/ide
  - name: ChatGPT for Word, Excel and PowerPoint
    what: A ChatGPT sidebar in Microsoft Word, Excel and PowerPoint, through one add-in, for drafting, summarizing and revising beside your document. Word is available on every plan, including Free.
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - name: ChatGPT browser extension
    what: For Chrome, Edge, Brave, Opera and Vivaldi. Mention open tabs as context, or let Work and Codex in the desktop app complete a task in your browser.
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - name: ChatGPT in Slack and Microsoft Teams
    what: In workspaces that set it up, ChatGPT takes requests in approved Slack and Teams conversations, using the deployment's connected tools.
    source: https://learn.chatgpt.com/docs/whats-new/devday-2026
  - name: ChatGPT Atlas (retired)
    what: OpenAI's former web browser stopped working on August 9, 2026; its browser features moved into the desktop app and the browser extension.
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
features:
  - name: Intelligent UI
    what: GPT-6 answers in Chat can mix text with charts, diagrams, buttons, forms and small tools such as calculators, or stay plain text when that works best. No special prompt is needed; on the web, turning off Layout and visuals in Settings reduces the visual elements.
    plans: Plus, Pro, Business and Enterprise, and Free and Go from October 8 (OpenAI's launch post), in Chat from Instant to Extra High; not with the Pro option, and not in the older ChatGPT Classic desktop app
    status: Rolling out since October 7, 2026
    source: https://help.openai.com/en/articles/20001354
  - name: Thinking slider and Think button
    what: In Chat, the model menu shows GPT-6 with a Thinking slider (Instant, Medium, High, Extra High, Pro). Asking ChatGPT to "think harder" does not change the level, so choose one; Free and Go have a Think button instead.
    plans: "Plus: Medium and High. Pro, Business and Enterprise: also Extra High and Pro. Free and Go: Think"
    status: Available; GPT-6 replaced Latest in the menu on October 7, 2026
    source: https://help.openai.com/en/articles/20001354
  - name: Projects
    what: Workspaces that keep related chats, files and instructions together; project instructions override your general custom instructions. Project-only memory keeps a project's chats and memory apart from the rest of ChatGPT; shared projects always use it, and ChatGPT Work is not available in those projects.
    plans: Every plan, including shared projects
    status: Available; the memory setting can be changed since August 14, 2026
    source: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
  - name: Memory
    what: ChatGPT can draw on past chats, saved memories and other sources to personalize answers. Settings, Personalization lets you review, correct or delete what it remembers; turning memory off does not delete your chats.
    plans: Free limited; Go and higher fuller (Plus and Pro expanded); varies by workspace on Business, Enterprise and Edu
    status: Available
    source: https://help.openai.com/en/articles/8590148-memory-faq
  - name: Temporary chat
    what: A chat kept out of your history that creates no new memories. By default it does not use memory, custom instructions or plugins either; OpenAI may keep it for up to 30 days for safety.
    plans: Every plan
    status: Available; optional personalization since August 27, 2026
    source: https://help.openai.com/en/articles/7730893-data-controls-faq
  - name: Deep research
    what: Multi-step research that returns a cited report. It may ask clarifying questions first, shows a plan you can edit, can be limited to sites you choose, and only reads connected apps. Start it by typing /Deepresearch, from the + menu or from the sidebar; reports download as Markdown, Word or PDF.
    plans: "Free and Go: limited. Plus: more. Pro: the most. Enterprise and Edu: set by administrators"
    status: Available
    source: https://help.openai.com/en/articles/10500283
  - name: Study mode, quizzes and flashcards
    what: Study mode asks questions to learn your goals and level, then works toward the answer with you. You can also ask for an interactive quiz, or for flashcards from a topic or your notes, which are saved to your library.
    plans: "Study mode: Free, Go, Plus and Pro. Quizzes: consumer plans and Edu. Flashcards: every plan"
    status: Available; flashcards since September 22, 2026
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - name: ChatGPT Images
    what: Create an image in the conversation, or edit one you upload, describing the change or selecting the part to change; templates give starting points such as a poster.
    plans: Every plan (Free limited); images with thinking on Plus, Pro and Business
    status: ChatGPT Images 2.5 since September 8, 2026
    source: https://help.openai.com/en/articles/11084440-images-in-chatgpt
  - name: Voice
    what: Spoken conversation with ChatGPT. The Live option can use web search, memory and plugins; an action that needs approval is approved on screen, not by voice.
    plans: Every plan, with daily limits; voice with video on Go and higher
    status: Available; plugins in Voice since September 23, 2026
    source: https://help.openai.com/en/articles/20001274-chatgpt-voice
  - name: Plugins, apps and skills
    what: Plugins bundle skills (instructions for a task) and apps that connect services such as Google Drive or Slack. ChatGPT uses them when relevant, or you choose one with @. OpenAI notes that its Verified badge does not replace an organization's own privacy, security or vendor review.
    plans: Directory on every plan; creating and sharing plugins from Go; apps that reach internal tools on Plus and higher; administrators decide in workspaces
    status: Available; the Plugin Directory replaced the App Directory on July 9, 2026
    source: https://help.openai.com/en/articles/20001256-plugins-in-chatgpt-and-codex
  - name: Education plugins
    what: College Student (study guides, practice quizzes, flashcards and visual explanations from your own course materials) and College Educator (syllabi, course materials, assessments and content for a learning management system) plugins for ChatGPT Work and Codex; a third is for K-12 teachers.
    plans: ChatGPT Edu and ChatGPT for Teachers deployments; the institution controls which tools and permissions are available
    status: Available since August 4, 2026
    source: https://openai.com/index/learn-teach-chatgpt-work-codex/
  - name: Scheduled tasks
    what: Tasks that run once or on a schedule, such as a reminder or a recurring update; in Work they can also start when something happens in a connected app, such as a new email. Tasks can be shared.
    plans: Go and higher on OpenAI's pricing page (the August 25 release notes also allow up to three on Free); app-triggered tasks on Plus and higher
    status: Available
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - name: Sites
    what: Turn work into an interactive website or small app, then preview, publish or share it.
    plans: Plus and higher; not Free or Go, and not in the European Economic Area, Switzerland or the United Kingdom
    status: Public beta since July 9, 2026
    source: https://help.openai.com/en/articles/11369540
  - name: Space and Pages
    what: Space gathers Pages (documents you write with ChatGPT and colleagues, with comments) and saved files. Sharing a Page does not give other people your private chats or memory.
    plans: Eligible Pro, Business and Enterprise (Enterprise sharing is an opt-in preview)
    status: Introduced September 29, 2026
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - name: Health
    what: A tab for health information you connect, such as Apple Health and supported medical records from hospital systems in the United States. Since September 2026, new Health connections follow your general plugin permission, by default Allow low-risk actions, so ChatGPT uses the data when relevant without asking each time, except for sensitive actions.
    plans: Free, Go, Plus and Pro, for users 18 or older in the United States, on the web and iOS
    status: Rolling out since July 23, 2026
    source: https://help.openai.com/en/articles/20001036-health-in-chatgpt
  - name: Custom GPTs (retiring)
    what: Custom versions of ChatGPT for a course or task. OpenAI plans to retire them in favor of plugins, with a migration path; existing GPTs keep working until the date that applies to your plan.
    plans: Created on Plus and higher, including workspace plans
    status: Retirement announced September 11, 2026
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
harnesses:
  - id: codex
    name: Codex
    what: OpenAI's agent for software and technical work. It reads a folder you open for it, edits files and runs commands there, inside a sandbox that keeps its commands to that folder unless you approve more. OpenAI points to ChatGPT Work for everyday documents, though Codex can do non-coding work in a folder too.
    runs: The terminal (the Codex CLI), the Codex view of the ChatGPT desktop app, code editors, and Codex Cloud, which runs tasks on OpenAI's computers from a prepared copy of a GitHub project, so work continues while your computer sleeps. The phone app's Remote tab reaches Codex chats running on your desktop.
    plans: Every plan. Free and Go get limited use in the desktop app; Plus and higher add the terminal, code editors and more usage. Codex Cloud needs Plus or higher (Edu included), not Free or Go. Codex shares one allowance with ChatGPT Work.
    acts: It works in a loop of reading, searching, editing and running commands, and every command it starts stays inside the sandbox. Web search uses a cached index unless you allow live browsing. On launch it recommends Auto for a folder under version control (Git) and Read Only for one that is not. Plan mode (/plan) has it propose before changing anything, and OpenAI suggests a Git checkpoint before and after each task so changes can be undone.
    modes:
      - name: Auto (CLI)
        what: The terminal's default preset. Reads, edits and runs commands inside the folder without asking; asks before working outside it or using the network.
      - name: Read Only (CLI)
        what: Reads files and runs commands in a read-only sandbox; asks before anything beyond it. Recommended at launch for a folder that is not under version control.
      - name: Ask for approval (desktop app and editors)
        what: OpenAI's recommended start. Works within the open folder and pauses before reaching beyond it, for example to use the internet or change files elsewhere.
      - name: Approve for me (Auto-review in the CLI)
        what: The same boundary, but requests to cross it go to an automatic reviewer instead of you; /approve retries one denied action. Changing who reviews does not widen the sandbox.
      - name: Full access
        what: No sandbox and no approvals (--yolo in the terminal). OpenAI marks it not recommended and advises it only inside a dedicated sandbox virtual machine.
    instructions: AGENTS.md files. Codex reads one in your Codex home folder for all projects, then one per folder from the project's top folder down to where you are working, joined so the nearest file wins; it reads them before doing any work, and /init drafts one.
    skills: Folders containing a SKILL.md file, following the open Agent Skills standard. Codex uses a skill when it is relevant, when you type $ and its name, or when you pick it with /skills; OpenAI bundles a few, such as skill-creator for writing your own.
    hooks: Your own scripts that run at fixed points, such as before a tool is used or when a session starts, set in hooks.json or config.toml. Codex asks you to review and trust a hook before it runs (/hooks).
    subagents: On by default. Codex delegates to helpers when you ask, or when AGENTS.md or a skill says to, and the Ultra reasoning level splits work across them; helpers use more of your allowance than a single agent.
    connectors: Outside tools through MCP (Model Context Protocol) servers and plugins, shared by the terminal, desktop app and editor extension on the same computer; /mcp lists them and /apps inserts a connected app.
    sandbox: On by default and enforced by the operating system. On Windows, Codex has its own sandbox in PowerShell and uses the Linux one in WSL2 (the Windows Subsystem for Linux); macOS and Linux use Seatbelt and bubblewrap. By default, commands can write only inside the open folder and have no network access. Codex Cloud tasks run in OpenAI-managed containers that cannot reach your computer.
    source: https://learn.chatgpt.com/docs/agent-approvals-security
  - id: work
    name: ChatGPT Work
    what: OpenAI's agent for finished deliverables, such as a brief, deck, spreadsheet, analysis, Site or recurring update. Chat answers questions; Work completes a task and returns files you can review.
    runs: ChatGPT on the web and phones, where it runs in the cloud, and the ChatGPT desktop app, where it can also use local folders, desktop apps and a built-in browser with your permission. Where a workspace turns on Local computer access with Work Cloud, a task started on desktop can continue from the web or a phone.
    plans: "Free and Go: limited, in the desktop app only. Plus, Pro, Business, and eligible Enterprise and Edu workspaces: desktop, web and phone. Work shares one allowance with Codex."
    acts: You describe an outcome; it plans, works in steps with your files, plugins and approved tools, and returns a file. You can follow its progress, answer questions, change direction and approve important actions as it works. A task can pause for a safety review.
    modes:
      - name: Ask for approval, Approve for me, Full access (desktop app)
        what: Local Work in the desktop app uses the same permission modes and sandbox as Codex.
      - name: On-screen approvals (web and phone)
        what: An action that needs approval waits until you approve or decline it on screen; spoken approval is not supported.
    instructions: Projects hold chats, files and instructions, and a Work chat started from a project uses the project's context; Work is not available in projects that use project-only memory.
    skills: Skills and plugins from the directory shared with Codex; mention one with @, for example @skill-creator.
    hooks: Only through plugins, which can include lifecycle hooks.
    subagents: Ask it to delegate independent parts of a task to helpers, which run in ChatGPT's hosted environment; at the Ultra level it can delegate on its own.
    connectors: Plugins connect it to tools such as Slack, Google Drive, SharePoint, email and calendars (Customize, then Plugins); type @ and a plugin's name to point it at one.
    sandbox: Cloud Work runs in OpenAI-managed containers; local Work in the desktop app uses the same sandbox as Codex. Workspace administrators control cloud work, local work, browser use and network access separately.
    source: https://learn.chatgpt.com/docs/get-started-with-work
  - id: dots
    name: Dots
    what: Always-on agents, introduced at OpenAI's DevDay on September 29, 2026. You give your dot an ongoing responsibility, such as updating a study's summary as new results arrive; it keeps working between conversations on its own cloud computer and browser, and comes back with results or decisions that need you. Dots are powered by GPT-6 Astra and can hand tasks to ChatGPT Work or Codex.
    runs: Created in the ChatGPT desktop app or ChatGPT in a desktop browser, then reached in ChatGPT on desktop, in the phone app (with the supporting update), in Slack and Microsoft Teams, or by voice call. Mobile web is not supported.
    plans: "Rolling out gradually to Pro 100, Pro 200 and Pro 500 (users over 18, outside the European Economic Area, the United Kingdom and Switzerland), Business Premium, and Enterprise (off until an administrator turns it on). Not on Free, Go or Plus; Edu is not listed. Conversations with a dot do not count toward ChatGPT usage limits; Work and Codex tasks it starts do."
    acts: It tracks progress, decides when to pause and pick work up again, runs background agents in parallel, and researches connected apps to suggest next steps (that research is read-only). Before an action affects your accounts or shares information, a review decides whether your dot can go ahead, needs your approval, or must hand the step to you.
    modes:
      - name: Built-in safeguards and approval checks
        what: Apply from the start; a review decides whether an action can proceed, needs your approval, or must be handed to you.
      - name: Your instructions and custom rules
        what: Add boundaries, such as showing you drafts before sending them; neither overrides the built-in safety requirements.
      - name: Take over
        what: Open its computer and select Take over to do a step yourself, then Return control.
      - name: Pause
        what: Stops your dot's current main task; delegated tasks are stopped in Activity and recurring ones in Scheduled.
    instructions: Your instructions and optional custom rules; it keeps its own notes on your preferences and decisions, alongside relevant ChatGPT memory.
    skills: Supported plugins enabled for your account; local skills need a connected computer.
    hooks: ''
    subagents: Background agents work on several things in parallel, and it can start ChatGPT Work or Codex tasks.
    connectors: Messaging channels (ChatGPT, Slack, Teams, calls), connected apps and plugins within their existing permissions, and one personal computer you choose to connect; each connection is separate.
    sandbox: Its own computer and browser in the cloud, separate from your devices and their signed-in sessions. It uses your computer only if you connect it, and only while it is online with the ChatGPT app open.
    source: https://learn.chatgpt.com/docs/dots
