    url: https://learn.chatgpt.com/docs/permission-modes
privacy:
  - title: Data controls in ChatGPT
    url: https://help.openai.com/en/articles/7730893-data-controls-faq
    covers: Whether your chats, and Codex tasks on personal plans, are used to train OpenAI's models and how to choose; temporary chats; exporting your data.
  - title: Memory in ChatGPT
    url: https://help.openai.com/en/articles/8590148-memory-faq
    covers: What ChatGPT remembers and how to review, correct or delete it.
  - title: Privacy Center in ChatGPT
    url: https://help.openai.com/en/articles/20001488
    covers: The in-app guide to privacy settings, rolling out on Free, Go, Plus, Pro and Business (not Enterprise or Edu).
  - title: Enterprise privacy at OpenAI
    url: https://openai.com/enterprise-privacy/
    covers: OpenAI's commitments for business data in Business, Enterprise and Edu workspaces, including training and retention.
  - title: OpenAI Privacy Policy
    url: https://openai.com/policies/privacy-policy/
    covers: The full privacy policy for OpenAI's consumer services.
changes:
  - date: 2026-10-08
    change: Faster steering began rolling out in Codex in the desktop app; a follow-up message can change a running task sooner (Settings, General, Follow-up behavior).
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - date: 2026-10-07
    change: GPT-6 with Intelligent UI began rolling out in Chat (GPT-6 Sol on Plus, Pro, Business and Enterprise), reaching Free and Go (GPT-6 Luna) from October 8; the Work and Codex models did not change.
    source: https://openai.com/index/gpt-6-for-everyone/
  - date: 2026-10-06
    change: Audio uploads arrived on paid plans, for transcripts and summaries of recordings such as lectures.
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - date: 2026-09-29
    change: DevDay brought dots, GPT-6.1 Sol in Work and Codex, Codex Cloud, ChatGPT Space and Pages, and the Pro 500 plan.
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - date: 2026-09-22
    change: GPT-6 Sol and GPT-6 Luna arrived in ChatGPT Work and Codex, with GPT-6 Luna for Free and Go in the desktop app.
    source: https://openai.com/index/introducing-gpt-6-sol-and-luna/
  - date: 2026-09-14
    change: On Plus and Pro, Instant stopped switching to deeper thinking on its own; new Health connections began defaulting to Allow low-risk actions.
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - date: 2026-09-11
    change: OpenAI announced plans to retire custom GPTs, with a migration path to plugins.
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
  - date: 2026-09-03
    change: GPT-6 Astra was introduced, first to a limited set of organizations.
    source: https://help.openai.com/en/articles/6825453-chatgpt-release-notes
