    source: https://learn.chatgpt.com/docs/reference/slash-commands
  - harness: codex
    group: dev
    command: /hooks
    what: Shows lifecycle hooks, and trusts, turns off or turns back on the ones you manage (CLI).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: /debug-config
    what: Prints the configuration layers and policy requirements, to explain why a setting differs from your configuration file (CLI).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: /experimental
    what: Turns experimental features on or off, such as Network proxy or Prevent sleep while running (CLI).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: /keymap
    what: Remaps the terminal interface's keyboard shortcuts and saves them (CLI).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: /vim
    what: Turns Vim-style editing in the composer on or off (CLI).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: /raw
    what: Turns raw scrollback on or off, for plainer selecting and copying of long output; Alt+R does the same (CLI).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: /theme
    what: Chooses a syntax-highlighting theme for code and diffs in the terminal (CLI).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: /statusline
    what: Chooses and orders the items in the terminal's footer, such as model, context, limits and Git branch (CLI).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: /title
    what: Chooses the items shown in the terminal window or tab title (CLI).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: /pets
    what: Chooses or hides a terminal pet (also /pet; in the desktop app, /pet wakes or tucks away the desktop pet).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex login
    what: Signs in from the terminal with a ChatGPT account, a device code, an API key or an access token; Codex also asks you to sign in on first run.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex exec
    what: Runs a task without interaction, for scripts and automated pipelines (short form codex e).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex review
    what: Runs a code review without interaction, against uncommitted changes, a base branch, a commit or your own instructions.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex cloud
    what: Browses or starts Codex Cloud tasks from the terminal (codex cloud exec submits one, codex cloud list lists recent ones; also codex cloud-tasks); experimental.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex apply
    what: Applies the latest changes from a Codex Cloud task to your local working copy (short form codex a).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex mcp
    what: Lists, adds, removes and signs in to MCP servers in Codex's configuration file.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex plugin
    what: Installs, lists and removes plugins; codex plugin marketplace manages the sources they come from.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex sandbox
    what: Runs any command inside the same sandbox Codex uses, on macOS, Linux or Windows.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex execpolicy
    what: Checks command-rule files and shows whether a command would be allowed, prompted or blocked (experimental).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex features
    what: Lists feature flags and turns them on or off in Codex's configuration file.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex completion
    what: Generates tab-completion scripts for Bash, the Z shell, Fish or PowerShell.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex app-server
    what: Starts Codex's app server, for local development and debugging (experimental).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex remote-control
    what: Runs or manages remote control for the local app server, or creates a short-lived pairing code (experimental).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: codex debug
    what: Debugging tools that send a test message through the app server, print the model catalog Codex sees, or show the exact input the model receives (experimental).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    group: dev
    command: chatgpt.newChat
    what: In VS Code and similar editors, starts a new Codex chat (Ctrl+N on Windows); chatgpt.openSidebar, chatgpt.newCodexPanel and chatgpt.openCommandMenu open the sidebar, a new panel or the command menu.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=ide
  - harness: codex
    group: dev
    command: chatgpt.addToThread
    what: In VS Code and similar editors, adds the selected text to the current Codex chat; chatgpt.addFileToThread adds the whole file.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=ide
shortcuts:
  - harness: codex
    keys: Enter
    what: While Codex is working in the CLI, sends new instructions into the current turn.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    keys: Tab
    what: While Codex is working in the CLI, queues a message, slash command or shell command for the next turn.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    keys: Esc Esc
    what: On an empty prompt in the CLI, edits your previous message and forks the chat from that point.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    keys: Ctrl+R
    what: Searches your earlier prompts in the CLI.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    keys: Ctrl+O
    what: Copies the latest finished response in the CLI (same as /copy).
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    keys: Ctrl+G
    what: Opens your text editor for writing a long prompt in the CLI.
    source: https://learn.chatgpt.com/docs/cli-customization
  - harness: codex
    keys: Ctrl+L
    what: Clears the terminal view in the CLI but keeps the current chat.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: work
    keys: Alt+1, Alt+2, Alt+3
    what: In the desktop app on Windows, switches to Chat, Work or Codex (Control+1 to 3 on a Mac).
    source: https://learn.chatgpt.com/docs/reference/commands
  - harness: work
    keys: Enter or Esc
    what: In the desktop app, approves or declines an open approval request.
    source: https://learn.chatgpt.com/docs/reference/commands
  - harness: work
    keys: Ctrl+Shift+N
    what: In the desktop app, starts a temporary chat (Command+Shift+N on a Mac).
    source: https://learn.chatgpt.com/docs/reference/commands
  - harness: work
    keys: Ctrl+Alt+N
    what: In the desktop app, opens a quick chat for a short question (Command+Option+N on a Mac).
    source: https://learn.chatgpt.com/docs/reference/commands
  - harness: work
    keys: Ctrl+Shift+M
    what: In the desktop app, opens the model picker (Control+Shift+M on a Mac).
    source: https://learn.chatgpt.com/docs/reference/commands
  - harness: codex
    keys: Ctrl+Shift+G
    what: In the desktop app, opens Codex's review tab to inspect changes (Control+Shift+G on a Mac).
    source: https://learn.chatgpt.com/docs/reference/commands
  - harness: work
    keys: Ctrl+K
    what: In the desktop app, opens the command menu (Command+K on a Mac).
    source: https://learn.chatgpt.com/docs/reference/commands
  - harness: work
    keys: Ctrl+/
    what: In the desktop app, lists the keyboard shortcuts (Command+/ on a Mac); change them under Settings, Keyboard Shortcuts.
    source: https://learn.chatgpt.com/docs/reference/commands
symbols:
  - harness: codex
    syntax: '@'
    what: In the Codex CLI, searches for a file in the folder and adds its path to your request.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    syntax: '!'
    what: At the start of a line in the Codex CLI, runs a shell command yourself, under the current approval and sandbox settings.
    source: https://learn.chatgpt.com/docs/developer-commands?surface=cli
  - harness: codex
    syntax: $
    what: In Codex, names a skill to use, such as $skill-creator; /apps inserts apps the same way.
    source: https://learn.chatgpt.com/docs/skills-and-plugins
  - harness: work
    syntax: '@'
    what: In ChatGPT Chat and Work, points to a plugin or skill, such as @Google Drive or @skill-creator.
    source: https://learn.chatgpt.com/docs/skills-and-plugins
  - harness: work
    syntax: /Deepresearch
    what: Typed in a ChatGPT message, starts a deep research task.
    source: https://help.openai.com/en/articles/10500283
