# Claude (Anthropic). Field guide: _fields.yaml in this folder.
id: anthropic
page: tools/company/anthropic.md
name: Claude
company: Anthropic
checked: 2026-10-09
pricing_url: https://claude.com/pricing
plans:
- name: Free
  for: Anyone trying Claude
  adds: Chat on the web, desktop and phone apps; web search, file creation and running code; memory; connectors and skills; Docs, Slides and Design; up to five projects. Sonnet and Haiku models only.
  source: https://claude.com/pricing
- name: Pro
  for: Individuals for everyday work
  adds: More usage than Free; Opus models; handing over whole tasks (Cowork in any conversation, rolling out); Claude Code; Research; Claude in Chrome and in Microsoft 365; unlimited projects.
  source: https://claude.com/pricing
- name: Max
  for: People who use Claude all day
  adds: Five or twenty times Pro's usage, higher output limits, priority at busy times, Fable 5.1 for up to half of weekly usage, and monthly credits for Anthropic's developer platform.
  source: https://support.claude.com/en/articles/11049741-what-is-the-max-plan
- name: Team
  for: Groups of 2 to 150
  adds: Claude Code and Cowork; shared projects; @Claude in Slack (beta); Claude Motion (beta); single sign-on and admin controls; no training on your content by default.
  source: https://claude.com/pricing
- name: Enterprise
  for: Large organizations
  adds: Everything in Team, plus spend limits, role-based access, audit logs, custom data retention, and a HIPAA-ready configuration.
  source: https://claude.com/pricing
- name: Claude for Education
  for: A whole university, students, faculty and staff
  adds: Institution-wide access at education pricing, learning mode (Claude asks guiding questions rather than giving answers), and accounts the university manages.
  source: https://claude.com/pricing
models:
- name: Claude Opus 5.5
  released: 2026-09-22
  best_for: Anthropic's recommended starting point for most work, and Claude Code's default
  where: Pro, Max, Team and Enterprise; not Free
  source: https://www.anthropic.com/claude/opus
- name: Claude Fable 5.1
  released: 2026-09-01
  best_for: The most demanding reasoning and long-running agent work
  where: Paid plans, chosen explicitly (on Pro from usage credits; on Max up to half of weekly usage); not Free
  source: https://www.anthropic.com/claude-fable-and-mythos-5-1
- name: Claude Sonnet 5.5
  released: 2026-09-28
  best_for: Faster, lower-cost everyday work, including documents, slides and spreadsheets
  where: Every plan, including Free
  source: https://www.anthropic.com/claude-sonnet-5-5
- name: Claude Haiku 5.5
  released: 2026-10-07
  best_for: The fastest and lowest-cost tier, for quick, high-volume tasks
  where: Every plan, including Free
  source: https://www.anthropic.com/claude/haiku
surfaces:
- name: Claude on the web
  what: The main app at claude.ai, with conversations, projects, artifacts, memory, connectors and research.
  source: https://claude.com/pricing
- name: Claude Desktop
  what: The app for Windows, macOS and Linux, plus local abilities such as working in a folder you choose, a built-in browser, computer use (beta on Pro and Max), and the Code tab for Claude Code.
  source: https://claude.com/download
- name: Phone apps
  what: Chat and voice on iOS and Android, plus checking on and steering tasks started at a desk.
  source: https://claude.com/download
- name: Claude in Chrome
  what: A browser agent that navigates, clicks and fills forms, asking before financial, personal or work-critical actions.
  source: https://support.claude.com/en/articles/12012173-getting-started-with-claude-in-chrome
- name: Claude in Microsoft 365 and Google Workspace
  what: Claude inside Word, Excel, PowerPoint and Outlook (Outlook in beta), and a sidebar in Google Docs, Sheets and Slides (public beta, paid plans).
  source: https://claude.com/claude-for-microsoft-365
- name: '@Claude in Slack'
  what: Tag Claude in a Slack thread or channel to hand it a task (beta, Team and Enterprise).
  source: https://www.anthropic.com/news/introducing-claude-tag
- name: Claude Science
  what: A research workbench app (public beta, paid plans) for scientific analysis, using the models your plan includes.
  source: https://claude.com/science
features:
- name: Artifacts
  what: Anything Claude makes for you to show someone (a document, deck, design or small tool) opens beside the conversation, stays in the Artifacts tab, and can be edited and shared.
  plans: Every plan
  status: Available
  source: https://support.claude.com/en/articles/17153992-what-are-artifacts-and-how-do-i-use-them
- name: Claude Docs, Slides and Design
  what: Documents written with Claude and your colleagues; decks exported to PowerPoint, PDF or Google Slides; one-pagers, mockups and prototypes.
  plans: Every plan, including Free
  status: Available since October 8, 2026
  source: https://claude.com/resources/articles/dashboards-and-motion
- name: Cowork in every conversation
  what: Ask a quick question or hand over a whole task in the same conversation; long tasks keep running in the cloud and finished files come back.
  plans: Rolling out to Pro and Max; others to follow
  status: Rolling out since September 16, 2026
  source: https://claude.com/resources/articles/cowork-is-now-claude
- name: Projects
  what: Workspaces with their own chats, uploaded knowledge, instructions and separate memory.
  plans: Every plan (five on Free)
  status: Available
  source: https://support.claude.com/en/articles/9517075-what-are-projects
- name: Memory and chat search
  what: Claude keeps a list of remembered topics you can read, edit or delete under Settings, Memory; sensitive topics such as health are left out unless you turn them on.
  plans: On by default for Free, Pro and Max; off for Team and Enterprise members until they turn it on
  status: Available
  source: https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context
- name: Incognito chats
  what: A chat that is not saved to your history or searched later (on Team and Enterprise, the organization's retention still applies).
  plans: Every plan
  status: Available
  source: https://support.claude.com/en/articles/11817273-use-claude-s-chat-search-and-memory-to-build-on-previous-context
- name: Research
  what: Multi-step research that returns a cited answer in minutes.
  plans: Pro and higher
  status: Available
  source: https://support.claude.com/en/articles/11088861-use-research-on-claude
- name: Model and effort menu
  what: Next to the send button, choose a model and how hard it thinks (Low to Max).
  plans: Every plan; the models offered vary by plan
  status: Available
  source: https://support.claude.com/en/articles/8664678-change-the-model-effort-and-thinking-settings
- name: Connectors, skills and plugins
  what: Connect apps such as Google Drive or Microsoft 365 so Claude can draw on them; skills teach it how you like a task done; plugins bundle both.
  plans: Every plan; administrators decide on Team and Enterprise
  status: Available
  source: https://support.claude.com/en/articles/12512180-use-skills-in-claude
- name: Claude Dashboards
  what: Live dashboards from a company data platform such as BigQuery, Snowflake or Salesforce.
  plans: Paid plans
  status: Beta since October 8, 2026
  source: https://claude.com/resources/articles/dashboards-and-motion
- name: Claude Motion
  what: Short animated explainers built as editable code from your text and charts, downloaded as an MP4 video.
  plans: Team and Enterprise
  status: Beta since October 8, 2026
  source: https://claude.com/resources/articles/dashboards-and-motion
harnesses:
- id: claude-code
  name: Claude Code
  what: Anthropic's agent for work that lives in files. It reads a folder you open for it, edits files in place, and runs commands, with a permission system between its requests and your machine. Despite the name, it is not only for code.
  runs: The terminal (Windows, macOS, Linux), the Code tab of Claude Desktop, VS Code and JetBrains editors, the web at claude.ai/code, and the phone app for cloud sessions.
  plans: Pro, Max, Team and Enterprise; not Free.
  acts: It works in a loop of tool calls (read, search, edit, run, fetch a web page), saving a checkpoint of your files before each turn so you can roll back. Plan mode has it research and propose before touching anything.
  modes:
  - name: Manual
    what: Reads freely; asks before most edits, commands and network access.
  - name: Plan
    what: Researches and proposes a plan; changes nothing until you approve it.
  - name: Accept edits
    what: Edits files and runs common file commands (making folders, moving and copying files) without asking; asks for other commands.
  - name: Auto
    what: A second model reviews each action in your place and blocks ones that go beyond your request. The starting mode in the terminal and VS Code.
  - name: Bypass permissions
    what: No prompts at all. Anthropic's documentation recommends it only for isolated containers or virtual machines.
  instructions: A file named CLAUDE.md in the folder (and one in your home folder for all projects) is read at the start of every session; /init drafts one. It can read a folder's AGENTS.md instead, the file Codex uses.
  skills: Folders containing a SKILL.md file of instructions, used when relevant or run as /skill-name.
  hooks: Your own commands that run at fixed points, such as before a file is edited, for checks that must not depend on the model's judgment.
  subagents: Helpers that take a side task in their own context window and report back; their work counts toward the same usage limits.
  connectors: Connections to outside tools and data through MCP (Model Context Protocol), managed with /mcp.
  sandbox: An optional sandbox limits which files and websites its commands can reach. It is off by default, and on Windows it works only inside WSL2 (the Windows Subsystem for Linux); on plain Windows, commands run unsandboxed.
  source: https://code.claude.com/docs/en/permission-modes
- id: cowork
  name: Cowork
  what: Anthropic's agent for finished office work. Hand it a task and it returns documents, spreadsheets and decks rather than instructions. It is becoming part of every Claude conversation on Pro and Max.
  runs: Claude on the web, desktop and phone; long tasks run in the cloud, and the desktop app can let it work in folders on your computer.
  plans: Paid plans; the merged "one Claude" experience is rolling out to Pro and Max first.
  acts: It plans the task, divides complex work among helpers working in parallel, uses connectors and Claude in Chrome where you allow it, and asks before acting by default.
  modes:
  - name: Ask before acting
    what: The default; further modes appear only when they are enabled for your account.
  instructions: Projects hold instructions, folders and context so each session starts with the right setup; it does not read Claude Code's own settings folder.
  skills: The skills enabled in your Claude account.
  hooks: ''
  subagents: Complex work is divided into parallel workstreams.
  connectors: The connectors and plugins enabled in your Claude account.
  sandbox: Work runs inside a virtual machine on your computer, or on Anthropic's machines for cloud sessions.
  source: https://claude.com/docs/cowork/overview
