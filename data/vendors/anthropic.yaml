commands:
- harness: claude-code
  group: start
  command: /help
  what: Shows help and the commands available to you.
  example:
    situation: A first-year student opens Claude Code in a folder of anatomy lecture notes and is not sure what to type.
    typed: /help
    shown:
    - '[A help view lists the commands available on this computer and plan]'
    note: Typing / on its own opens the same list, and letters typed after it filter it.
    why: The quickest way to see what this installation offers, since commands vary by platform and plan.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: start
  command: /init
  what: Drafts a CLAUDE.md brief for the folder, or suggests improvements to an existing one.
  example:
    situation: A course director keeps a pharmacology module folder (syllabus, weekly slides, question bank) and wants Claude to know its layout every session.
    typed: /init
    shown:
    - '[Claude reads the folder and writes CLAUDE.md, describing its structure and conventions]'
    note: If a CLAUDE.md already exists, it suggests improvements rather than overwriting it.
    why: Turns explanations you would repeat into a brief Claude reads at the start of every session.
  source: https://code.claude.com/docs/en/memory
- harness: claude-code
  group: start
  command: /memory
  what: Opens your CLAUDE.md files for editing and shows what Claude has remembered on its own.
  example:
    situation: Claude keeps writing exam items in British spelling, and the faculty member wants to see what it has remembered and add a standing preference.
    typed: /memory
    shown:
    - '[A picker of CLAUDE.md files to edit]'
    - '[An auto memory switch, and the entries Claude has saved]'
    why: You can see and correct what shapes every later session.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: start
  command: /powerup
  what: Opens short interactive lessons, with animated demos, on Claude Code's features.
  example:
    situation: A student new to Claude Code wants a guided tour before starting real work.
    typed: /powerup
    shown:
    - '[A menu of quick lessons, each with an animated demo of one feature]'
    why: A built-in way to learn the tool by doing, at your own pace.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: start
  command: /status
  what: Shows the version, model, account and connection in use.
  example:
    situation: A staff member is unsure whether the laptop is signed in to the university's account or a personal one.
    typed: /status
    shown:
    - '[Settings opens on the Status tab: version, model, account and connectivity]'
    why: Settles which account and model you are actually using before work that matters.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: start
  command: /login
  what: Signs in to your Anthropic account (and /logout signs out).
  example:
    situation: A faculty member switches from a personal Pro account to the department's Team account.
    typed: /login
    shown:
    - '[A sign-in flow for your Anthropic account]'
    note: /logout signs out of the current account first.
    why: Keeps work under the right account and plan.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: control
  command: /plan
  what: Enters plan mode, so Claude researches and proposes before changing anything.
  example:
    situation: A clerkship coordinator wants 120 OSCE station files reorganized into weekly folders, but wants to see the plan first.
    typed: /plan reorganize the OSCE station files into one folder per week
    shown:
    - ⏸ plan mode on
    - '[Claude reads the files and presents its plan, then asks how to proceed]'
    - 'option: Yes, and use auto mode'
    - 'option: Yes, manually approve edits'
    - 'option: No, keep planning'
    note: Ctrl+G opens the plan in your text editor, so you can change it before approving.
    why: Nothing is touched until you approve, which suits unfamiliar folders and work that matters.
  source: https://code.claude.com/docs/en/permission-modes
- harness: claude-code
  group: control
  command: /permissions
  what: Opens the rules for what Claude may do without asking, must ask about, or may never do.
  example:
    situation: A faculty member wants Claude never to open the folder of student grade exports kept beside the course files.
    typed: /permissions
    shown:
    - '[A dialog of allow, ask and deny rules, by scope]'
    note: A deny rule added here applies in every mode, including bypass.
    why: A hard limit that does not depend on the model's judgment.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: control
  command: /rewind
  what: Rolls files, the conversation, or both back to an earlier point (also Esc twice on an empty prompt).
  example:
    situation: Claude reformatted a reading list across several files in the wrong citation style.
    typed: /rewind
    shown:
    - '[A list of the prompts you sent this session; after you pick one]'
    - 'option: Restore code and conversation'
    - 'option: Restore conversation'
    - 'option: Restore code'
    - 'option: Summarize from here'
    - 'option: Summarize up to here'
    - 'option: Never mind'
    why: An undo for an agent's file edits, without needing version control.
  source: https://code.claude.com/docs/en/checkpointing
- harness: claude-code
  group: control
  command: /sandbox
  what: Turns the sandbox on or off, limiting which files and websites Claude's commands can reach.
  example:
    situation: A researcher on a Mac wants Claude's commands kept inside the project folder while it processes a dataset.
    typed: /sandbox
    shown:
    - '[The sandbox panel, with its modes and any missing requirements]'
    note: Available on macOS, Linux and WSL2; on plain Windows, commands run unsandboxed.
    why: A boundary enforced by the computer, not by the model's judgment.
  source: https://code.claude.com/docs/en/sandboxing
- harness: claude-code
  group: control
  command: /privacy-settings
  what: Views and changes your privacy settings (Pro and Max plans).
  example:
    situation: A student on a Pro plan wants to check whether their conversations may be used to improve Anthropic's models.
    typed: /privacy-settings
    shown:
    - '[Your current privacy settings, which you can change here]'
    why: You decide, and can check, how your conversations are used.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: control
  command: /branch
  what: Starts a branch of the conversation here, to try another direction without losing the original.
  example:
    situation: Halfway through drafting a case vignette, a course director wants to try a different patient age without losing the first draft.
    typed: /branch older-patient
    shown:
    - '[You are now in the branch; the original conversation is kept]'
    note: /resume returns to the original conversation.
    why: Trying an alternative costs nothing, since the original is still there.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: check
  command: /diff
  what: Shows what changed in your files, including Claude's edits, turn by turn.
  example:
    situation: Before sharing an updated module handbook with colleagues, a faculty member checks exactly what Claude changed.
    typed: /diff
    shown:
    - '[A list of changed files with lines added and removed]'
    note: Enter opens a file's changes, and each turn's edits can be viewed separately.
    why: You review the output yourself before anyone else sees it.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  group: check
  command: /btw
  what: Asks a side question without adding it to the conversation.
  example:
    situation: Mid-task, a course director forgets which file held the 2026 learning objectives.
    typed: /btw which file had the 2026 learning objectives?
    shown:
    - '[The answer appears in a panel you dismiss; it never enters the conversation]'
    why: A quick check that does not interrupt the running task or clutter it.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  group: check
  command: /export
  what: Saves the whole conversation as a text file, or copies it.
  example:
    situation: A faculty member wants a record of how an exam blueprint was built, for the curriculum committee's file.
    typed: /export blueprint-session.txt
    shown:
    - '[The conversation is written to blueprint-session.txt]'
    why: Keeps a record of how AI-assisted work was done.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: check
  command: /copy
  what: Copies Claude's last response to the clipboard, with a picker when it contains code blocks.
  example:
    situation: Claude has written a summary table of antibiotic classes that a student wants to paste into their notes.
    typed: /copy
    shown:
    - '[The last response is copied; with code blocks, a picker offers each block or the whole response]'
    note: /copy 2 copies the second-to-last response; w in the picker writes the selection to a file.
    why: A clean copy of the text, without the terminal's line wrapping.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: check
  command: /recap
  what: Writes a one-line summary of the current session.
  example:
    situation: Back from a meeting, a faculty member wants a reminder of where a long session had got to.
    typed: /recap
    shown:
    - '[A one-line summary of the session so far]'
    why: Picks up the thread without rereading the whole conversation.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: check
  command: /insights
  what: 'Writes a report on your recent sessions: what you work on, how you use Claude Code, and where things go wrong.'
  example:
    situation: At the end of term, a faculty member wants to see how they actually used Claude Code and what to try next.
    typed: /insights
    shown:
    - '[An HTML report on your recent sessions on this computer]'
    note: Not available in cloud sessions.
    why: Shows your own patterns and the features worth trying.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: context
  command: /context
  what: Shows what is filling Claude's working memory, as a colored grid with suggestions.
  example:
    situation: After Claude has read a dozen long journal articles, its answers start to drift.
    typed: /context
    shown:
    - '[A colored grid of how full the context window is, and with what]'
    - '[Suggestions for freeing space, and a warning when it is nearly full]'
    why: It tells you when to compact the conversation or start fresh.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: context
  command: /compact
  what: Summarizes the conversation so far to free space, optionally keeping what you name.
  example:
    situation: A long session building renal physiology questions is nearly full, but the agreed item-writing rules must survive.
    typed: /compact keep the item-writing rules and the list of approved stems
    shown:
    - Conversation compacted
    - '[Claude re-reads CLAUDE.md and the files it was working on]'
    why: A long session keeps going without losing the decisions that matter.
  source: https://code.claude.com/docs/en/context-window
- harness: claude-code
  group: context
  command: /clear
  what: Starts a fresh conversation, keeping the folder's CLAUDE.md (also /new).
  example:
    situation: A student finishes a cardiology study guide and moves on to an unrelated microbiology task.
    typed: /clear cardio-study-guide
    shown:
    - '[A fresh conversation; the old one is saved under that name]'
    why: Unrelated work gets a clean start, and better answers.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: context
  command: /resume
  what: Returns to an earlier conversation with its full history.
  example:
    situation: Yesterday's session drafting a small-group case on sepsis needs to continue.
    typed: /resume
    shown:
    - '[A list of earlier sessions to pick from]'
    why: You pick up where you left off instead of explaining it all again.
  source: https://code.claude.com/docs/en/sessions
- harness: claude-code
  group: context
  command: /rename
  what: Renames the session, so it is easy to find later.
  example:
    situation: A course director has several sessions open and wants the one about the renal block easy to find.
    typed: /rename renal-block-questions
    shown:
    - '[The new name appears on the prompt bar]'
    note: With no name, Claude suggests one from the conversation.
    why: Named sessions are easy to find again with /resume.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: context
  command: /exit
  what: Leaves Claude Code (also /quit).
  example:
    situation: A student has finished for the day.
    typed: /exit
    shown:
    - '[Claude Code closes; the session can be resumed later]'
    why: Ends the session cleanly; nothing is lost, and /resume brings it back.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: model
  command: /model
  what: Switches the model, with effort adjusted in the same picker.
  example:
    situation: A researcher wants a lower-cost model for a quick reformatting of a reference list.
    typed: /model
    shown:
    - '[A picker of models; the arrow keys adjust effort]'
    note: Enter makes the choice your default; pressing s switches for this session only.
    why: Match cost and capability to the task in front of you.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: model
  command: /effort
  what: Sets how hard the model reasons, from low to max, and turns ultracode on or off.
  example:
    situation: A teaching assistant is renaming 40 lecture PDFs to a fixed pattern, a job that needs no judgment.
    typed: /effort low
    shown:
    - '[Effort set to low, kept for later sessions]'
    why: Lower effort is faster and cheaper for mechanical work; Opus, Sonnet and Haiku 5.5 start at medium.
  source: https://code.claude.com/docs/en/model-config
- harness: claude-code
  group: model
  command: /usage
  what: Shows how much of your plan's usage you have used, and your recent activity.
  example:
    situation: A student on a Pro plan wonders how much of the week's allowance a big literature task used.
    typed: /usage
    shown:
    - '[Bars for the current session and the week, with activity stats]'
    why: You see a limit coming before it interrupts important work.
  source: https://code.claude.com/docs/en/costs
- harness: claude-code
  group: model
  command: /fast
  what: 'Turns fast mode on or off: Opus up to 2.5 times faster, at a higher cost per token.'
  example:
    situation: A faculty member is iterating quickly on wording with Claude and is waiting on every reply.
    typed: /fast on
    shown:
    - '[Fast mode on; replies from Opus come faster]'
    note: On subscription plans it is billed to usage credits, and it works with Opus models only.
    why: Worth it when you are waiting on each reply; turn it off for long tasks you are not watching.
  source: https://code.claude.com/docs/en/fast-mode
- harness: claude-code
  group: model
  command: /rate-limit-options
  what: Shows your options when a usage limit stops a request.
  example:
    situation: A student hits their plan's limit in the middle of a long study-guide task.
    typed: /rate-limit-options
    shown:
    - '[Options: wait and continue when the limit resets, add usage credits, or upgrade the plan]'
    why: Lays out the choices instead of leaving the task stuck.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: model
  command: /usage-credits
  what: Sets up usage credits, or asks your administrator for them, when you hit a limit.
  example:
    situation: A staff member on the university's Team plan reaches the limit before an important deadline.
    typed: /usage-credits
    shown:
    - '[Billing settings open in the browser, or, without billing access, a request goes to your administrator]'
    why: The quickest route to more usage when it matters.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: make
  command: /goal
  what: Sets an end state; Claude keeps working turn after turn until a check says it is met.
  example:
    situation: Every lecture PDF in a module folder needs a one-page summary beside it.
    typed: /goal every PDF in this folder has a one-page summary file next to it
    shown:
    - '[Claude works through the files without new prompts]'
    note: After each turn, a model checks whether the goal is met; /goal clear stops it early.
    why: Suits long jobs with a checkable end, and you still review the result.
  source: https://code.claude.com/docs/en/goal
- harness: claude-code
  group: make
  command: /deep-research
  what: 'Runs a research workflow: searches the web widely, cross-checks sources, and writes a cited report.'
  example:
    situation: A faculty member preparing a journal club wants an overview of recent evidence on early mobilization after hip fracture surgery.
    typed: '/deep-research early mobilization after hip fracture surgery: outcomes since 2020'
    shown:
    - '[Searches run in parallel; sources are fetched and cross-checked]'
    - '[A cited report is written]'
    why: A cited starting point; check the sources before you rely on any of them.
  source: https://code.claude.com/docs/en/workflows
- harness: claude-code
  group: make
  command: /slides
  what: Makes a new Claude Slides deck from a brief.
  example:
    situation: A course director needs a first draft of an orientation deck for the new clinical skills block.
    typed: /slides orientation for the clinical skills block, 10 slides
    shown:
    - '[A Claude Slides deck is drafted from the brief, ready to edit]'
    note: Needs a session where artifacts are available.
    why: A first draft to edit, rather than a blank deck.
  source: https://code.claude.com/docs/en/artifacts
- harness: claude-code
  group: make
  command: /design
  what: Drafts posters, one-pagers or screen mockups on one canvas, as a Claude Design artifact.
  example:
    situation: A student society needs a poster for a blood drive.
    typed: /design a poster for the student blood drive on campus
    shown:
    - '[Artboards drafted on a canvas, which you edit in Claude Design]'
    why: A designed first draft in minutes, which you then refine.
  source: https://code.claude.com/docs/en/artifacts
- harness: claude-code
  group: make
  command: /dataviz
  what: Gives Claude design guidance for charts and dashboards, including colorblind-safe colors.
  example:
    situation: A researcher wants a clear chart of exam scores by cohort for a curriculum report.
    typed: /dataviz a chart of exam scores by cohort, 2022 to 2026
    shown:
    - '[Claude picks the chart form for the data, checks the colors for colorblind safety and contrast, and draws it]'
    why: Charts that read clearly and work for colorblind readers.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: make
  command: /claude-in-chrome
  what: Has Claude carry out a task in your browser through Claude in Chrome.
  example:
    situation: A staff member wants Claude to fill in a long online registration form from details in a document.
    typed: /claude-in-chrome fill in the conference registration form using details.txt
    shown:
    - '[Claude works in the browser, asking before sensitive steps]'
    note: Available when Chrome integration is on for the session.
    why: Hands repetitive browser work to Claude while you watch.
  source: https://code.claude.com/docs/en/chrome
- harness: claude-code
  group: extend
  command: /add-dir
  what: Gives Claude access to one more folder for this session.
  example:
    situation: While writing new questions, Claude needs to check them against a shared question bank in another folder.
    typed: /add-dir ../shared-question-bank
    shown:
    - '[Folder suggestions appear as you type; Tab accepts one]'
    why: Access widens one folder at a time, on purpose, rather than to a whole drive.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: extend
  command: /skills
  what: Lists the skills installed, and how much of the context each one uses.
  example:
    situation: A faculty member wants to know which skills Claude Code already has before adding any.
    typed: /skills
    shown:
    - '[A filterable list of skills; t sorts them by size]'
    why: Check what is there, and what it costs in context, before adding more.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: extend
  command: /mcp
  what: Shows the outside tools Claude is connected to, and repairs their sign-ins.
  example:
    situation: A researcher's reference-manager connection has stopped responding.
    typed: /mcp
    shown:
    - '[A list of connected servers and their status]'
    note: /mcp reconnect all retries every connection that failed, without opening the list.
    why: See, and fix, which outside tools Claude can reach.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: extend
  command: /plugin
  what: Opens the plugin menu, or installs, enables or disables a plugin.
  example:
    situation: A faculty member wants a published plugin that bundles skills for grading rubrics.
    typed: /plugin
    shown:
    - '[The plugin menu: browse, install, enable or disable]'
    why: Adds capabilities in one step, and switches them off just as easily.
  source: https://code.claude.com/docs/en/plugins/overview
- harness: claude-code
  group: extend
  command: /import
  what: 'Brings settings over from Codex, Gemini CLI or Cursor: instruction files, connections, commands and skills.'
  example:
    situation: A faculty member who used Codex last term moves to Claude Code and wants their AGENTS.md rules and connections to come along.
    typed: /import codex --dry-run
    shown:
    - '[A list of what would be brought over, without changing anything yet]'
    note: Without --dry-run, it imports after you confirm.
    why: Switching tools without starting your setup again.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: extend
  command: /reload-skills
  what: Re-scans the skill folders, so a skill you just added works without restarting.
  example:
    situation: A faculty member has just saved a new skill for formatting exam items.
    typed: /reload-skills
    shown:
    - '[A report of how many skills are available, and how many were added or removed]'
    why: New or edited skills take effect straight away.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: long
  command: /background
  what: Sends the session to run in the background, freeing the terminal.
  example:
    situation: Claude is converting a semester of lecture recordings' transcripts into study notes, a long job.
    typed: /background
    shown:
    - '[The session keeps working in the background; the terminal is free]'
    note: claude agents shows background sessions; /fork copies the conversation into a new one instead.
    why: Long jobs keep going while you do something else.
  source: https://code.claude.com/docs/en/agent-view
- harness: claude-code
  group: long
  command: /tasks
  what: Shows and manages background work in this session, including helpers that have finished.
  example:
    situation: A faculty member wants to see whether the summary helpers Claude started have finished.
    typed: /tasks
    shown:
    - '[A list of background work and its status]'
    why: One place to check on everything running in the background.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: long
  command: /schedule
  what: Creates and manages routines that run in the cloud on a schedule (also /routines).
  example:
    situation: A staff member wants a weekly summary of new items in a shared policy folder every Monday morning.
    typed: /schedule
    shown:
    - '[Claude walks you through setting up the routine in conversation]'
    why: Recurring jobs run without your computer being on.
  source: https://code.claude.com/docs/en/routines
- harness: claude-code
  group: long
  command: /loop
  what: Runs a prompt again and again while the session stays open.
  example:
    situation: During a long data export, a researcher wants Claude to check the progress every few minutes.
    typed: /loop 5m check the export folder and tell me how many files are done
    shown:
    - '[The prompt runs every five minutes until you stop it]'
    note: Without an interval, Claude chooses the pace itself.
    why: Light monitoring without a separate tool.
  source: https://code.claude.com/docs/en/scheduled-tasks
- harness: claude-code
  group: long
  command: /desktop
  what: Moves the current session into the Claude Desktop app (also /app).
  example:
    situation: A faculty member started in the terminal but wants the desktop app's visual review of changes.
    typed: /desktop
    shown:
    - '[The session continues in Claude Desktop]'
    note: Needs macOS or x64 Windows (not Windows on Arm) and a Claude subscription.
    why: Same session, with the desktop app's visual tools.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: long
  command: /mobile
  what: Shows a QR code for downloading the Claude phone app (also /ios, /android).
  example:
    situation: A student wants to check on long tasks from their phone.
    typed: /mobile
    shown:
    - '[A QR code to download the Claude app]'
    why: Gets the phone app installed in seconds.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: settings
  command: /doctor
  what: Runs a checkup of the installation and proposes fixes it applies after you confirm.
  example:
    situation: Claude Code behaves oddly after an update on a faculty laptop.
    typed: /doctor
    shown:
    - '[A checkup of installation, settings and CLAUDE.md problems]'
    - '[Proposed fixes, each applied only after you confirm]'
    why: The first step before asking IT for help.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: settings
  command: /config
  what: Opens Settings (theme, model, output style and more), or sets a value directly.
  example:
    situation: A faculty member wants Claude Code in a dark theme without opening any menus.
    typed: /config theme=dark
    shown:
    - '[The setting is changed directly; /config alone opens Settings]'
    why: All preferences in one place, or one change in one line.
  source: https://code.claude.com/docs/en/settings
- harness: claude-code
  group: settings
  command: /theme
  what: Changes the color theme, including colorblind-friendly themes.
  example:
    situation: A student with red-green color blindness finds the default colors hard to tell apart.
    typed: /theme
    shown:
    - '[A list of themes: auto, light and dark variants, colorblind-accessible (daltonized) themes, and themes using your terminal''s own colors]'
    why: Makes the screen comfortable to read for your eyes.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: settings
  command: /voice
  what: Turns on voice dictation, so you can speak your prompts.
  example:
    situation: A faculty member would rather dictate long instructions than type them.
    typed: /voice hold
    shown:
    - 'Voice mode enabled (hold). Hold space to record. Dictation language: en (/config to change).'
    note: Needs a Claude.ai account; /voice tap records with one tap instead of holding.
    why: Speak long requests instead of typing them.
  source: https://code.claude.com/docs/en/voice-dictation
- harness: claude-code
  group: settings
  command: /output-style
  what: Lists or switches the style of Claude's replies, such as Concise, Explanatory or Learning.
  example:
    situation: A student wants Claude to explain its reasoning and leave small parts of a data-analysis script for them to write.
    typed: /output-style learning
    shown:
    - '[Replies now explain their choices and leave small pieces for you to write]'
    note: Concise leads with the result; Explanatory adds short notes on the reasons behind each change.
    why: Turns a session into practice, not just a finished result.
  source: https://code.claude.com/docs/en/output-styles
- harness: claude-code
  group: settings
  command: /feedback
  what: Sends feedback or a bug report to Anthropic, after a consent step (also /bug).
  example:
    situation: A faculty member finds a confusing error message and wants to report it.
    typed: /feedback
    shown:
    - '[A feedback dialog, with a consent step before anything is sent]'
    why: Problems reach the people who can fix them; you choose what is shared.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /advisor
  what: Turns on an advisor that consults a second model at key moments.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /agents
  what: Reminds you to ask Claude to create or manage helper agents (subagents).
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /artifacts
  what: Lists your artifacts, to attach, open, or copy a link.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /auto-mode-setup
  what: Drafts the environment details auto mode uses, from your project.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /autocompact
  what: Sets how full the context gets before Claude compacts it automatically.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /autofix-pr
  what: Starts a cloud session that watches a pull request and pushes fixes.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /batch
  what: Splits a large change into many parallel parts, after you approve a plan.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /cd
  what: Moves the session to another folder, keeping the conversation.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /chrome
  what: Configures Claude in Chrome.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /code-review
  what: Reviews code changes for bugs (also /review; /ultrareview runs a deeper review in the cloud).
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /color
  what: Sets the color of the prompt bar for the session.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /debug
  what: Turns on debug logging and troubleshoots from the log.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /fewer-permission-prompts
  what: Adds common read-only commands to the project's allow list.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /focus
  what: Shows only your prompt, a summary of tool use, and the final response.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /fork
  what: Copies the conversation into a new background session.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /hooks
  what: Shows your hook settings.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /ide
  what: Manages connections to code editors.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /install-github-app
  what: Installs the Claude GitHub app for a repository.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /install-slack-app
  what: Installs the Claude Slack app.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /keybindings
  what: Opens your keyboard shortcuts file.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /list-agents
  what: Lists the helpers and sessions Claude can message.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /logout
  what: Signs out of your Anthropic account.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /release-notes
  what: Shows what changed in each version.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /reload-plugins
  what: Reloads plugins without restarting.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /remote-control
  what: Makes this session controllable from claude.ai or the phone app (also /rc).
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /remote-env
  what: Chooses the default cloud environment for cloud sessions.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /run
  what: Launches and drives your app to see a change working.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /security-review
  what: Reviews a branch's changes for security problems.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /simplify
  what: Reviews changed code for clean-up and applies the fixes.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /skill-doctor
  what: Shows each skill's context cost and use.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /statusline
  what: Configures the status line.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /stop
  what: Stops the background session you are attached to.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /subtask
  what: Starts a background helper that inherits the conversation.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /team-onboarding
  what: Writes a team onboarding guide from your usage history.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /teleport
  what: Pulls a cloud session into the terminal (also /tp).
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /terminal-setup
  what: Adds a Shift+Enter new-line shortcut in supported terminals.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /tui
  what: Switches between the standard and full-screen display.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /update-config
  what: Changes settings from a plain-language request.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /upgrade
  what: Opens the page for upgrading your plan.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /verify
  what: Builds and runs your app to confirm a change works.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /web-setup
  what: Connects GitHub for cloud sessions.
  source: https://code.claude.com/docs/en/commands
- harness: claude-code
  group: other
  command: /workflows
  what: Opens the progress view for running workflows.
  source: https://code.claude.com/docs/en/commands
shortcuts:
- harness: claude-code
  keys: Shift+Tab
  what: Cycle permission modes (Manual, Accept edits, Plan, and Auto or Bypass where available).
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  keys: Esc
  what: Stop Claude mid-turn; its work so far is kept.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  keys: Esc Esc
  what: On an empty prompt, open the rewind menu.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  keys: Ctrl+G
  what: Open your prompt, or a proposed plan, in your text editor.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  keys: Ctrl+R
  what: Search your earlier prompts.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  keys: Ctrl+O
  what: Show the detailed transcript of what Claude did.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  keys: Ctrl+B
  what: Send a long-running command or helper to the background.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  keys: Ctrl+T
  what: Show or hide Claude's to-do list.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  keys: Shift+Enter
  what: Start a new line without sending.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  keys: '?'
  what: On an empty prompt, show the shortcut help.
  source: https://code.claude.com/docs/en/interactive-mode
symbols:
- harness: claude-code
  syntax: '@'
  what: Mentions a file so it is added to the conversation, with path completion.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  syntax: '!'
  what: At the start of a message, runs a shell command yourself and shows Claude the output.
  source: https://code.claude.com/docs/en/interactive-mode
- harness: claude-code
  syntax: ultrathink
  what: In a prompt, asks for deeper reasoning on that one turn.
  source: https://code.claude.com/docs/en/model-config
- harness: claude-code
  syntax: ultracode
  what: In a prompt, runs that task as a planned multi-agent workflow; /effort ultracode turns it on for the session.
  source: https://code.claude.com/docs/en/model-config
full_lists:
- title: Every Claude Code command
  url: https://code.claude.com/docs/en/commands
