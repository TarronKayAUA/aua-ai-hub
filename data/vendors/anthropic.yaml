- title: Permission modes
  url: https://code.claude.com/docs/en/permission-modes
privacy:
- title: Is my data used for model training?
  url: https://privacy.claude.com/en/articles/10023580-is-my-data-used-for-model-training
  covers: When consumer chats (Free, Pro and Max) are used for training, and how to choose.
- title: How long do you store my data?
  url: https://privacy.claude.com/en/articles/10023548-how-long-do-you-store-my-data
  covers: Retention of chats, including deleted ones.
- title: Who owns and manages the data of my Claude for Education account?
  url: https://privacy.claude.com/en/articles/11732894-who-owns-and-manages-the-data-of-my-claude-for-education-account
  covers: How a university manages its Education accounts and their data.
- title: Privacy for commercial customers (Team, Enterprise, API)
  url: https://privacy.claude.com/en/collections/10663361-commercial-customers
  covers: Anthropic's commercial privacy articles, including Business Associate Agreements.
- title: Anthropic Privacy Policy
  url: https://www.anthropic.com/legal/privacy
  covers: The full privacy policy.
changes:
- date: 2026-10-08
  change: Claude Docs, Slides and Design left beta and reached every plan, including Free; Claude Dashboards and Claude Motion launched in beta.
  source: https://claude.com/resources/articles/dashboards-and-motion
- date: 2026-10-07
  change: Claude Haiku 5.5 launched, selectable on every plan including Free.
  source: https://www.anthropic.com/claude/haiku
- date: 2026-10-06
  change: Claude for Google Workspace (Docs, Sheets and Slides) opened as a public beta on paid plans.
  source: https://claude.com/resources/articles/claude-now-works-in-google-docs-sheets-and-slides
- date: 2026-09-28
  change: Claude Sonnet 5.5 launched.
  source: https://www.anthropic.com/claude-sonnet-5-5
- date: 2026-09-22
