privacy:
  - title: SpaceXAI Consumer FAQs
    url: https://x.ai/legal/faq
    covers: Conversations on grok.com and the Grok apps may be used to train xAI's models unless you turn off "Improve the model" (on a phone, Settings, Data Controls; on grok.com, Settings, Data) or use Private Chat. The page is dated May 12, 2025, and Grok on X follows X's own settings.
  - title: SpaceXAI Privacy Policy
    url: https://x.ai/legal/privacy-policy
    covers: The full policy (effective August 24, 2026), which asks you not to provide sensitive information such as health information.
  - title: Enterprise FAQs
    url: https://x.ai/legal/faq-enterprise
    covers: Written for business customers of the API. xAI does not train on business data (the pricing table shows the same for the Business and Enterprise plans), deletes inputs and outputs within 30 days unless agreed otherwise, and says it can support a customer's obligations under HIPAA (the Health Insurance Portability and Accountability Act, the US health-privacy law) in some circumstances.
  - title: Business associate agreement questionnaire
    url: https://x.ai/legal/baa
    covers: How an organization asks xAI for a HIPAA business associate agreement. xAI describes it as covering use of its APIs, and none of its pages read for this guide extends it to chats on grok.com or the Grok apps.
  - title: Privacy Portal
    url: https://x.ai/privacy-portal
    covers: Requests to see, correct or delete your data, or to opt out of training.
  - title: 'Grok Bot: approvals, security, and privacy'
    url: https://docs.x.ai/grok-bot/approvals-security-and-privacy
    covers: Grok Bot uses a Cursor account, so its data storage and training opt-out follow your Cursor settings and Cursor's privacy policy, not your grok.com settings.
