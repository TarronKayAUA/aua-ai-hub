# Grok (xAI). Field guide: _fields.yaml in this folder.
# Commands: every Grok Build command in xAI's reference (docs.x.ai/build/modes-and-commands
# and /build/cli/reference), plus those its open-source user guide and changelog add.
# Commands a student, faculty member or staff member might use carry a worked example;
# developer-only ones sit in the last group without one. Read 2026-10-09.
id: xai
page: tools/company/xai.md
name: Grok
company: xAI
checked: 2026-10-09
pricing_url: https://x.ai/pricing
plans:
  - name: Free
    for: Anyone trying Grok on the web or the phone apps
    adds: "Chat with Grok 4.6, limited real-time web and X search, voice mode, image generation, connectors, and Grok Build. No video generation and no Grok Bot."
    source: https://x.ai/pricing
  - name: SuperGrok Lite
    for: Not stated (the pricing page names it only in its comparison table, with no price)
    adds: "In that table: full web and X search and video generation beyond Free; no Grok Bot."
    source: https://x.ai/pricing
  - name: SuperGrok
    for: Individuals who want higher limits
    adds: Higher limits across all features, image and video generation, and access to Grok Bot.
    source: https://x.ai/pricing
  - name: SuperGrok Plus
    for: Heavy individual use
    adds: Everything in SuperGrok, plus significantly higher usage across chat, images, voice and Build, 1080p video, faster replies, priority at peak times, and early access to new features.
    source: https://x.ai/pricing
  - name: SuperGrok Heavy
    for: The top individual tier (named in the comparison table, with no price shown)
    adds: In that table, the same features as SuperGrok plus priority support.
    source: https://x.ai/pricing
  - name: Business
    for: Teams and departments
    adds: No training on your business data, custom data retention, team seat management, consolidated billing, role-based access, domain verification, user analytics and audit controls. Single sign-on and Grok Bot are not ticked for Business.
    source: https://x.ai/pricing
  - name: Enterprise
    for: Large organizations, through xAI's sales team
    adds: Everything in Business, plus single sign-on, directory sync, custom roles, customer-managed encryption keys, a dedicated data plane, dedicated onboarding, and options for data residency and custom rate limits.
    source: https://x.ai/pricing
  - name: X Premium and X Premium+
    for: X subscribers who link their X account to Grok
    adds: "Once the accounts are linked (on grok.com, Settings, Account), xAI reads your X subscription and grants \"relevant benefits\". Which Grok features and limits each X tier includes could not be verified, because X's help pages refuse automated reading. X, not xAI, handles X Premium refunds."
    source: https://docs.x.ai/grok/faq
models:
  - name: Grok 4.7
    released: 2026-09-21
    best_for: Coding and knowledge work; xAI's newest model and Grok Build's default
    where: Grok Build, Cursor and the xAI API (application programming interface, for developers); not announced for grok.com or the Grok apps. Grok 4.7 Fast, a quicker version, runs only in Grok Build and Cursor and is not in Build's free tier.
    source: https://docs.x.ai/developers/grok-4-7
  - name: Grok 4.6
    released: 2026-08-12
    best_for: Long-running agent work and interactive, visual projects
    where: The model xAI's pricing table lists for every Grok plan; also Grok Build, Cursor and the xAI API
    source: https://x.ai/news/grok-4-6
  - name: Grok Imagine Image 2.0
    released: 2026-08-07
    best_for: "Making and editing images: region edits, background removal, and up to five reference images"
    where: Quality Mode at grok.com/imagine and in the Grok apps (image generation is on every plan); also the xAI API
    source: https://x.ai/news/grok-imagine-image-2
  - name: Grok Imagine Video 1.5
    released: 2026-06-16
    best_for: Short videos from text, an image or reference pictures, up to 1080p
    where: grok.com/imagine and the Grok apps on paid plans (video is not on Free); also the xAI API
    source: https://x.ai/news/grok-imagine-video-1-5-references
surfaces:
  - name: grok.com
    what: The Grok app in a web browser, with chat, search, images and video, voice, files, connectors and Build. xAI's help pages recommend grok.com in Chrome or another Chromium-based browser, since other addresses can lack features such as Projects.
    source: https://docs.x.ai/grok/faq
  - name: Grok phone apps
    what: The same assistant on iOS and Android; your conversations, settings and subscription stay in sync across devices.
    source: https://docs.x.ai/grok/overview
  - name: Grok on X
    what: Grok inside X (x.com and the X apps), under X's own terms, privacy policy and help center rather than xAI's.
    source: https://x.ai/legal/faq
  - name: Grok in Microsoft 365
    what: Add-ins that put Grok inside Word, PowerPoint, Excel and Outlook.
    source: https://x.ai/news/introducing-outlook-addin
  - name: Grok in Google Workspace
    what: An add-on that puts Grok beside the file open in Google Docs, Sheets or Slides.
    source: https://x.ai/news/introducing-google-workspace-addon
  - name: xAI API and Console
    what: For developers, Grok's models through the API, with keys, billing and Grok Business licenses managed in the xAI Console.
    source: https://docs.x.ai/grok/management
features:
  - name: Search
    what: Live web and X search, with citations to sources.
    plans: Every plan; limited on Free
    status: Available
    source: https://x.ai/grok
  - name: Multi-agent mode
    what: Several agents work on parts of a hard question at once, each showing its reasoning, and their results merge into one cited answer.
    plans: SuperGrok and higher
    status: Available
    source: https://x.ai/grok
  - name: Grok Imagine
    what: Images and short videos from text or reference pictures; every output carries a Grok watermark, with no setting to remove it.
    plans: Images on every plan; video on paid plans
    status: Available
    source: https://docs.x.ai/grok/faq
  - name: Voice
    what: Spoken back-and-forth conversation with Grok.
    plans: Every plan
    status: Available
    source: https://x.ai/grok
  - name: File uploads
    what: PDFs, Word, Excel and PowerPoint files, images, audio and video; most files up to 150 MB each, and about 100 files at once on the web (20 on Android).
    plans: Every plan; limits can vary by plan
    status: Available
    source: https://docs.x.ai/grok/faq
  - name: Memory, custom instructions and Canvas
    what: Grok remembers preferences across chats; custom instructions tailor its replies; Canvas is a space for long-form writing with inline suggestions.
    plans: Not stated by plan
    status: Available
    source: https://x.ai/grok
  - name: Private Chat
    what: A chat that stays out of your history, is deleted from xAI's systems within 30 days, and is not used for training. Start one with the ghost icon at the top right.
    plans: grok.com and the Grok apps
    status: Available
    source: https://x.ai/legal/faq
  - name: Connectors
    what: Gmail and Google Calendar, Google Drive, OneDrive, Outlook, Microsoft Teams, SharePoint, Salesforce and a catalog of others, or your own server using MCP (Model Context Protocol), so Grok can use them in a chat.
    plans: Every plan; on Business and Enterprise an admin must provision each one first
    status: Available since May 6, 2026
    source: https://docs.x.ai/grok/connectors
  - name: Skills
    what: Instructions Grok reuses in every conversation. Built-in skills make Word documents, presentations, spreadsheets and PDFs, and Skill Creator builds new ones with you.
    plans: Every account has the built-in skills
    status: Available since May 18, 2026
    source: https://x.ai/news/grok-skills
  - name: Automations
    what: Jobs Grok runs by itself on a schedule (once, daily, weekdays, weekly, monthly or yearly) or when a matching email arrives, reporting back by email, app notification, both or neither.
    plans: Scheduled automations on every plan; email triggers with SuperGrok
    status: Available since July 16, 2026
    source: https://x.ai/news/grok-automations
  - name: Build
    what: Describe an app, game, website or dashboard and Grok builds a working version in the chat; publish it to a grok.me address that only you, anyone with the link, or anyone at all can open.
    plans: Every plan
    status: Available since August 19, 2026
    source: https://x.ai/news/grok-build-for-everyone
  - name: Weekly usage allowance
    what: Paid plans share one weekly allowance across chat, images, voice, Build and the API, shown as a percentage under Settings, Usage. Extra Usage Credits, bought on the web, continue past it.
    plans: Paid plans
    status: Rolling out since June 2026
    source: https://docs.x.ai/grok/faq
  - name: Team workspace
    what: A workspace for your team beside your personal one on grok.com. Team admins set how widely members can share conversations, projects and skills, from not at all up to public links for conversations; by default, conversations can be shared across the organization.
    plans: Business and Enterprise
    status: Available
    source: https://docs.x.ai/grok/management
harnesses:
  - id: grok-build
    name: Grok Build
    what: xAI's agent for the terminal, open source since July 15, 2026. It reads the files in the folder you start it in, edits them, and runs commands, asking first by default. xAI presents it as a coding agent, but its tools (reading, searching and editing files, running commands) work on any files. It is not the Build feature in the Grok app, which makes small apps inside a chat.
    runs: A terminal on Windows (installed from PowerShell), macOS or Linux; also without the full-screen view in scripts, and inside editors and other apps through the Agent Client Protocol (ACP).
    plans: "Every plan, including Free, in xAI's pricing table (\"Available to try for Free\"); paid plans draw on the same weekly allowance as chat and images. Grok 4.7 Fast is not in its free tier, and xAI publishes no per-plan limits for it."
    acts: "It works in a loop of tool calls: reading, searching and editing files, running commands, and searching the web (fetching whole web pages is off by default). It keeps a to-do list for multi-step work, saves every session to disk, and can rewind to an earlier prompt. Plan mode has it explore and propose before any edit; /goal hands over long jobs."
    modes:
      - name: Ask
        what: The default. Reading and safe read-only commands run freely; it asks before anything not already allowed, such as an edit or another command.
      - name: Plan
        what: It explores and drafts a plan, and only the plan file may be edited until you approve, even in Auto or Always-approve. Commands still follow the permission mode, and xAI notes that a command can still write files.
      - name: Auto
        what: A classifier approves tool calls it judges safe; the others still ask. Appears only when the feature is turned on.
      - name: Always-approve
        what: No permission prompts for tool calls; deny rules and hooks still apply. Ctrl+O switches it on or off.
    instructions: At the start of every session it reads AGENTS.md and CLAUDE.md files (and their variants) in the folder and each folder above it up to the project root, plus your global rules, in full with no size limit; outside a git repository it reads only the folder you started in. grok inspect lists what it found. One brief can therefore serve Claude Code, Codex and Grok Build.
    skills: Folders containing a SKILL.md file, in a project's .grok/skills folder or in your personal .grok folder; it also reads Claude Code's skills. A skill is used when a task matches it, or run by name as /skill-name.
    hooks: Your own commands, or web addresses, called at fixed points such as before a tool runs. Only the check before a tool runs can block it, and a hook that crashes or times out lets the action through. A project's own hooks run only after you trust the project.
    subagents: "Helpers with their own context, in three built-in types: general-purpose, explore (reading and searching only) and plan (no commands, no edits). xAI's pages disagree on whether they are on by default."
    connectors: Outside tools through MCP servers, managed with /mcps; it also loads servers already set up for Claude Code or Cursor.
    sandbox: An optional sandbox limits where commands can write and, on Linux, their network access. It is off by default and documented for Linux and macOS only; xAI documents no sandbox for Windows.
    source: https://docs.x.ai/build/features/permissions
  - id: grok-bot
    name: Grok Bot
    what: xAI's work agent. Each Bot is a named teammate with one job, working on a cloud computer with a browser, files and a terminal, so work continues with your laptop closed. Grok Bot signs in with a Cursor account, and the computers Bots work on run in Cursor's cloud; it is separate from Grok on grok.com.
    runs: Desktop apps for Windows, macOS and Linux; phone apps for iPhone, iPad and Android; and tagging @bot in a post on X (not in every region).
    plans: A linked SuperGrok, SuperGrok Plus or SuperGrok Heavy subscription, or a paid Cursor plan; not Free or SuperGrok Lite. Bots have their own weekly usage, separate from your Grok plan. An Enterprise version was announced on September 3, 2026.
    acts: You message a Bot as you would a colleague. It uses connectors where they exist and operates the browser for everything else, hands you control of its computer for passwords, two-factor codes and payments, and returns emails and Slack messages as drafts you send or discard. A process that works can be saved as a skill or a scheduled routine.
    modes:
      - name: Per-action approval
        what: "A card shows the proposed action and its inputs: Allow once, Always allow (which saves a rule), or Deny. Approvals for work that started without you expire after about 10 minutes."
      - name: Auto Review
        what: Grok Bot checks tool calls and computer actions before they run, against your Ask first and Allow automatically rules; Ask first wins when both match.
      - name: Execution on Local Computer
        what: Whether Bots may run commands on the computer in front of you. Ask every time is the default; Always allow and Never allow are the others, and xAI advises Never allow unless a Bot needs your local files.
    instructions: No instruction file. Each Bot has a name, one job and a description, and preferences you state in chat are kept in its memory.
    skills: One private library shared by all your Bots; type / to use one. You can also teach a browser task by doing it once while the Bot records (Teach a task, up to ten minutes).
    hooks: ''
    subagents: Instead of helpers, several named Bots run in parallel, message each other and hand work over; Team Bots can be shared with colleagues.
    connectors: Plugins installed from Marketplace in the sidebar; an installed connector is available to every Bot on your account.
    sandbox: Bots work on a cloud computer assigned to your account and isolated from other users, but all your Bots share its files, sign-ins and browser sessions; xAI's documentation says not to use separate Bots as a security boundary.
    source: https://docs.x.ai/grok-bot/approvals-security-and-privacy
  - id: grok-app
    name: Agent Features in the Grok App
    what: "On grok.com and in the phone apps, Grok can act as well as answer: Build makes a working app or website in the chat, connectors reach your email, files and calendar, skills hold reusable instructions, automations run jobs on a schedule, and multi-agent mode splits a hard question among parallel agents."
    runs: grok.com and the iOS and Android apps.
    plans: Build, connectors, built-in skills and scheduled automations on every plan, including Free; email-triggered automations and multi-agent mode with SuperGrok and higher.
    acts: "Chat first: Grok uses a connected service whenever your question relates to it. An automation opens a fresh conversation on each run and saves it to the run history, and Run now starts one at once. Build writes the code and shows a working preview in the conversation before you publish it."
    modes:
      - name: Connector sign-in
        what: A connector works only after you complete its sign-in with that service; from then on Grok uses it whenever a question relates to it. xAI's pages describe no confirmation step before a connector action.
      - name: Admin provisioning
        what: On Business and Enterprise, a team admin must provision each connector before members can use it.
      - name: Publishing a build
        what: A published app opens for just you, anyone with the link, or anyone on the internet, as you choose.
    instructions: No instruction file; custom instructions and memory are settings, and skills hold reusable instructions.
    skills: Built-in skills for Word documents, presentations, spreadsheets and PDFs, plus your own; your version of a built-in skill takes priority over it. Skills can be attached to an automation.
    hooks: ''
    subagents: Multi-agent mode only, where several agents work in parallel and their results merge into one answer.
    connectors: Built-in connectors (Gmail and Google Calendar, Google Drive, OneDrive, Outlook, Microsoft Teams, SharePoint, Salesforce), a catalog of others, and custom MCP servers reachable over the internet.
    sandbox: ''
    source: https://docs.x.ai/grok/connectors
